      function EventGallery({ images }) {
        if (!images || images.length === 0) return null;
        return (
          <Section title="Galeri">
            <div className="-mx-4 flex snap-x snap-mandatory gap-3 overflow-x-auto px-4 pb-1 sm:mx-0 sm:px-0">
              {images.map((url, i) => (
                <img key={url + i} src={url} alt="" loading="lazy"
                  className="h-48 w-64 shrink-0 snap-start rounded-2xl object-cover sm:h-56 sm:w-72" />
              ))}
            </div>
          </Section>
        );
      }

      /** Link langsung ke landing page event ini — dipakai buat share & tujuan iklan (mis. Meta Ads). */
      /**
       * Link lewat /share/:slug (yakesma-api), bukan langsung #/event/:slug.
       * Situs ini SPA murni sisi-klien (hash routing) sehingga crawler
       * (Facebook/WhatsApp) tak bisa melihat judul/foto per-event kalau
       * link hash dibagikan langsung — hanya lihat meta tag generik.
       * /share/:slug di-render server (Next.js) dengan og:title/og:image
       * sesuai event, lalu otomatis mengalihkan manusia ke halaman aslinya.
       */
      function eventShareUrl(event) {
        // Penanda tanggal (bukan angka acak) — link tetap stabil sepanjang hari yang
        // sama (aman dipakai berulang di Meta Ads), tapi otomatis "kedaluwarsa" tiap
        // hari supaya proxy cache basi di jaringan operator seluler tertentu tidak
        // terus-menerus menyimpan versi lama (pernah terjadi: 404 di HP, normal di PC).
        const v = new Date().toISOString().slice(0, 10).replace(/-/g, "");
        return API_BASE + "/share/" + event.slug + "?v=" + v;
      }

      function ShareButton({ event }) {
        const [copied, setCopied] = useState(false);
        async function handleShare() {
          const url = eventShareUrl(event);
          if (navigator.share) {
            try { await navigator.share({ title: event.title, text: event.excerpt, url }); } catch (e) {}
            return;
          }
          try {
            await navigator.clipboard.writeText(url);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          } catch (e) {
            try { window.prompt("Salin link event ini:", url); } catch (e2) {}
          }
        }
        return (
          <button type="button" onClick={handleShare}
            className="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-brand-100 bg-white px-4 py-2 text-sm font-semibold text-brand-dark transition hover:border-brand hover:bg-brand-50">
            {copied ? <IconCheck className="size-4 text-brand" strokeWidth={2.6} /> : <IconShare className="size-4" />}
            {copied ? "Link tersalin!" : "Bagikan"}
          </button>
        );
      }

      function EventDetail({ slug, paket }) {
        const event = getEvent(slug);
        // Hook dipanggil sebelum early-return apa pun (aturan React) — isinya
        // sendiri sudah aman kalau event tidak ada, jadi tidak menembak apa-apa.
        useEffect(() => {
          if (!event || !window.fbq) return;
          // Kunjungan lewat link paket internal (testing karyawan) tidak dikirim ke Meta.
          if (paket && (event.packages || []).some((p) => p.id === paket && p.internal)) return;
          fbq('track', 'ViewContent', {
            content_ids: [event.slug],
            content_name: event.title,
            content_type: 'product',
            value: eventPriceInfo(event).price || 0,
            currency: 'IDR',
          });
        }, [event && event.slug]);
        if (!event) return <NotFound />;
        const terisi = registeredCount(event);
        const sisa = Math.max(0, event.quota - terisi);
        const pct = Math.min(100, Math.round((terisi / event.quota) * 100));
        const finished = isEventFinished(event);
        return (
          <Container className="space-y-5">
            <div className="flex items-center justify-between gap-3">
              <Link to="/event" className="inline-flex items-center gap-1.5 text-sm font-semibold text-ink/60 transition hover:text-brand-dark"><IconArrowLeft className="size-4" />Kembali ke Event</Link>
              <ShareButton event={event} />
            </div>
            <div className="flex flex-col gap-6 lg:grid lg:grid-cols-3 lg:gap-8">
              <div className="space-y-8 lg:col-span-2 lg:col-start-1">
                <div className="space-y-6">
                  <EventPoster event={event} className="aspect-[16/10] shadow-lg shadow-brand/10 sm:aspect-[16/9]" />
                  <div>
                    <span className="inline-block rounded-full bg-brand-50 px-3 py-1 text-xs font-bold text-brand-700">{event.category}</span>
                    <h1 className="mt-3 text-2xl font-extrabold leading-tight text-brand-dark sm:text-3xl">{event.title}</h1>
                    <p className="mt-2 text-ink/70">{event.excerpt}</p>
                  </div>
                  <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <Fact icon={IconCalendar} label={event.dateEnd ? "Pelaksanaan" : "Tanggal"} value={formatTanggalRange(event.date, event.dateEnd)} />
                    <Fact icon={IconClock} label="Waktu" value={formatWaktu(event.timeStart, event.timeEnd)} />
                    <Fact icon={IconMapPin} label="Lokasi" value={eventFormat(event) === "online" ? event.location : eventPlace(event)} />
                    {eventFormat(event) === "hybrid" && <Fact icon={IconUsers} label="Cara Ikut" value="Offline di lokasi atau Online (virtual)" />}
                    <Fact icon={IconUsers} label="Kuota" value={terisi + " dari " + event.quota + " terisi"} />
                    {(event.registrationStart || event.registrationEnd) && (
                      <Fact icon={IconCalendar} label="Pendaftaran"
                        value={
                          event.registrationStart && event.registrationEnd
                            ? formatTanggalRange(event.registrationStart, event.registrationEnd)
                            : event.registrationEnd
                              ? "Sampai " + formatTanggalPendek(event.registrationEnd)
                              : "Mulai " + formatTanggalPendek(event.registrationStart)
                        } />
                    )}
                  </div>
                </div>

                <EventGallery images={event.gallery} />

                <Section title="Deskripsi">
                  <div className="space-y-3 leading-relaxed text-ink/75">{event.about.map((p, i) => <p key={i}>{p}</p>)}</div>
                </Section>
                <Section title="Yang Anda Dapatkan">
                  <ul className="space-y-2.5">
                    {event.benefits.map((b, i) => (
                      <li key={i} className="flex items-start gap-3">
                        <span className="mt-0.5 grid size-5 shrink-0 place-items-center rounded-full bg-brand text-white"><IconCheck className="size-3.5" strokeWidth={2.6} /></span>
                        <span className="text-ink/75">{b}</span>
                      </li>
                    ))}
                  </ul>
                </Section>
                {eventFormat(event) !== "online" && eventHasRacepack(event) && (
                  <Section title="Racepack">
                    <div className="space-y-3 rounded-2xl border border-brand-50 bg-white p-4 text-sm text-ink/75">
                      <div>
                        <p className="flex items-center gap-1.5 font-bold text-brand-dark"><IconMapPin className="size-4 text-brand" />{eventFormat(event) === "hybrid" ? "Peserta offline: ambil di RPC (Race Pack Collection)" : "Ambil di RPC (Race Pack Collection)"}</p>
                        <div className="mt-1.5"><RpcDetails event={event} /></div>
                      </div>
                      {eventFormat(event) === "hybrid" && (
                        <p className="flex items-start gap-1.5"><IconPackage className="mt-0.5 size-4 shrink-0 text-brand" /><span><span className="font-bold text-brand-dark">Peserta online:</span> racepack dikirim ke alamat yang diisi saat mendaftar via POS Indonesia (ongkir ditanggung peserta).</span></p>
                      )}
                    </div>
                  </Section>
                )}
                {event.speaker && (
                  <Section title="Pemateri">
                    <div className="flex items-center gap-3 rounded-2xl border border-brand-50 bg-white p-4">
                      <span className="grid size-12 place-items-center rounded-full bg-brand-50 text-brand"><IconUser className="size-6" /></span>
                      <div><p className="font-bold text-brand-dark">{event.speaker}</p><p className="text-sm text-ink/55">Pemateri {event.category}</p></div>
                    </div>
                  </Section>
                )}
              </div>

              <aside className="space-y-4 lg:sticky lg:top-20 lg:col-start-3 lg:self-start">
                {finished ? (
                  <div className="rounded-2xl border border-brand-100 bg-white p-5 text-center shadow-sm">
                    <span className="mx-auto grid size-12 place-items-center rounded-full bg-brand-50 text-brand"><IconCheckCircle className="size-6" /></span>
                    <p className="mt-3 font-extrabold text-brand-dark">Event Sudah Terlaksana</p>
                    <p className="mt-1.5 text-sm text-ink/60">
                      Terima kasih untuk {terisi.toLocaleString("id-ID")} peserta yang sudah berpartisipasi. Nantikan event YAKESMA berikutnya!
                    </p>
                    <Link to="/event" className="mt-4 inline-flex items-center gap-1.5 rounded-xl bg-brand px-4 py-2.5 text-sm font-bold text-white transition hover:bg-brand-600">
                      Lihat Event Lainnya
                    </Link>
                  </div>
                ) : (
                  <RegistrationForm event={event} paketParam={paket} />
                )}
                <RunEventCta event={event} />
                <div className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
                  <div className="flex items-center justify-between text-sm"><span className="text-ink/60">Kuota terisi</span><span className="font-bold text-brand-dark">{terisi}/{event.quota}</span></div>
                  <div className="mt-2 h-2 overflow-hidden rounded-full bg-brand-50"><div className="h-full rounded-full bg-brand" style={{ width: pct + "%" }} /></div>
                  <p className="mt-2 text-xs text-ink/55">{sisa > 0 ? "Sisa " + sisa + " kursi tersedia" : "Kuota penuh"}</p>
                </div>

      function EventSaya() {
        const [regs, setRegs] = useState([]);
        const notFound = useRef({}); // kode yang sudah pasti tidak ada di server — jangan dicek berulang
        // Segarkan status pembayaran tiap pendaftaran dari server (mis. admin sudah menandai lunas) —
        // sebaik mungkin, diam-diam gagal jika offline.
        function refreshAll(onlyPending) {
          getRegistrations().forEach((r) => {
            if (!r.code || !r.email || notFound.current[r.code]) return;
            if (onlyPending && r.paymentStatus !== "pending_transfer") return;
            apiLookupStatus(r.code, r.email).then((res) => {
              if (!res.ok) { if (res.status === 404) notFound.current[r.code] = true; return; }
              if (!res.data.paymentStatus) return;
              const cur = getRegistrations().find((x) => x.id === r.id) || r;
              const patch = serverPatch(cur, res.data);
              if (!patch) return;
              updateRegistrationInCache(r.id, patch);
              setRegs(getRegistrations());
            });
          });
        }
        useEffect(() => { setRegs(getRegistrations()); refreshAll(false); }, []);
        useLiveRefresh(refreshAll, regs.some((r) => r.paymentStatus === "pending_transfer"));
        function sembunyikan(id) { removeRegistration(id); setRegs(getRegistrations()); }

      function AccountAuthPanel({ onLoggedIn }) {
        const [mode, setMode] = useState("login"); // login | register | forgot
        const [forgotSent, setForgotSent] = useState(false);
        const [name, setName] = useState("");
        const [email, setEmail] = useState("");
        const [phone, setPhone] = useState("");
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);

        async function submit(e) {
          e.preventDefault();
          setError("");
          if (mode === "forgot") {
            const v = email.trim();
            if (!/^\S+@\S+\.\S+$/.test(v)) { setError("Format email belum benar."); return; }
            setLoading(true);
            const r = await accountForgot(v);
            setLoading(false);
            if (!r.ok) { setError(r.error); return; }
            setForgotSent(true);
            return;
          }
          setLoading(true);
          const res = mode === "login"
            ? await accountLogin(email.trim(), password)
            : await accountRegister(name.trim(), email.trim(), phone.trim(), password);
          setLoading(false);
          if (!res.ok) { setError(res.error); return; }
          setAccountToken(res.token);
          onLoggedIn(res.account);
        }

        function switchMode(next) { setMode(next); setError(""); setPassword(""); setForgotSent(false); }

        if (mode === "forgot") {
          return (
            <div>
              <h3 className="mb-1 font-bold text-brand-dark">Lupa password</h3>
              {forgotSent ? (
                <div className="space-y-2 rounded-xl bg-brand-50 p-4 text-sm text-ink/75">
                  <p className="flex items-center gap-1.5 font-bold text-brand-dark"><IconCheckCircle className="size-4 text-brand" />Cek email Anda</p>
                  <p>Jika <b>{email.trim()}</b> punya akun, link untuk membuat password baru sudah kami kirim. Link berlaku 1 jam; cek juga folder Spam/Promosi.</p>
                </div>
              ) : (
                <form onSubmit={submit} className="space-y-3">
                  <p className="text-sm text-ink/60">Masukkan email akun Anda. Kami kirim link untuk membuat password baru.</p>
                  <Field label="Email" type="email" value={email} onChange={setEmail} placeholder="nama@email.com" />
                  {error && <p className="text-sm font-medium text-orange">{error}</p>}
                  <button type="submit" disabled={loading} className="flex w-full items-center justify-center rounded-xl bg-brand-dark px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-900 disabled:cursor-not-allowed disabled:opacity-60">
                    {loading ? "Mengirim…" : "Kirim link reset"}
                  </button>
                </form>
              )}
              <p className="mt-3 text-center text-xs text-ink/50">
                <button type="button" onClick={() => switchMode("login")} className="font-semibold text-brand hover:underline">Kembali ke Masuk</button>
              </p>
            </div>
          );
        }

        return (
          <div>
            <div className="mb-3 flex gap-1 rounded-xl bg-brand-50/60 p-1">
              <button type="button" onClick={() => switchMode("login")}
                className={"flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition " + (mode === "login" ? "bg-white text-brand-dark shadow-sm" : "text-ink/50")}>Masuk</button>
              <button type="button" onClick={() => switchMode("register")}
                className={"flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition " + (mode === "register" ? "bg-white text-brand-dark shadow-sm" : "text-ink/50")}>Daftar Akun</button>
            </div>
            <form onSubmit={submit} className="space-y-3">
              {mode === "register" && <Field label="Nama Lengkap" value={name} onChange={setName} placeholder="Nama Anda" />}
              <Field label="Email" type="email" value={email} onChange={setEmail} placeholder="nama@email.com" />
              {mode === "register" && <Field label="Nomor WhatsApp (opsional)" type="tel" value={phone} onChange={(v) => setPhone(cleanPhoneInput(v))} placeholder="08xxxxxxxxxx" inputMode="numeric" maxLength={13} />}
              <Field label="Password" type="password" value={password} onChange={setPassword} placeholder={mode === "register" ? "Minimal 8 karakter" : "Password"} />
              {mode === "login" && (
                <div className="-mt-1 text-right">
                  <button type="button" onClick={() => switchMode("forgot")} className="text-xs font-semibold text-brand hover:underline">Lupa password?</button>
                </div>
              )}
              {error && <p className="text-sm font-medium text-orange">{error}</p>}
              <button type="submit" disabled={loading} className="flex w-full items-center justify-center rounded-xl bg-brand-dark px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-900 disabled:cursor-not-allowed disabled:opacity-60">
                {loading ? "Memproses…" : mode === "login" ? "Masuk" : "Daftar"}
              </button>
            </form>
            <p className="mt-3 text-center text-xs text-ink/50">
              {mode === "login" ? "Belum punya akun? " : "Sudah punya akun? "}
              <button type="button" onClick={() => switchMode(mode === "login" ? "register" : "login")} className="font-semibold text-brand hover:underline">
                {mode === "login" ? "Daftar sekarang" : "Masuk di sini"}
              </button>
            </p>
          </div>
        );
      }

      /* ============ RESET PASSWORD (#/reset-password?u=&x=&t=) — dari link di email ============ */
      function ResetPassword({ u, x, t }) {
        const [password, setPassword] = useState("");
        const [confirm, setConfirm] = useState("");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);
        const [done, setDone] = useState(false);
        const linkOk = !!(u && x && t);

        async function submit(e) {
          e.preventDefault();
          if (password.length < 8) { setError("Password minimal 8 karakter."); return; }
          if (password !== confirm) { setError("Konfirmasi password tidak sama."); return; }
          setError(""); setLoading(true);
          const res = await accountReset(u, x, t, password);
          setLoading(false);
          if (!res.ok) { setError(res.error); return; }
          setAccountToken(res.token);
          saveAccount({ name: res.account.name, email: res.account.email, phone: res.account.phone || "" });
          setDone(true);
        }

        return (
          <Container>
           <div className="mx-auto max-w-md space-y-5">
            <h1 className="text-2xl font-extrabold text-brand-dark sm:text-3xl">Buat password baru</h1>
            <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              {done ? (
                <div className="space-y-3 text-sm text-ink/75">
                  <p className="flex items-center gap-1.5 font-bold text-brand-dark"><IconCheckCircle className="size-5 text-brand" />Password berhasil diganti</p>
                  <p>Anda sudah masuk ke akun dengan password baru.</p>
                  <Link to="/akun" className="flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white hover:bg-brand-600">Buka Akun</Link>
                </div>
              ) : !linkOk ? (
                <div className="space-y-3 text-sm text-ink/75">
                  <p>Link reset tidak lengkap. Minta link baru lewat Akun → Masuk → Lupa password?</p>
                  <Link to="/akun" className="font-semibold text-brand hover:underline">Ke halaman Akun</Link>
                </div>
              ) : (
                <form onSubmit={submit} className="space-y-3">
                  <Field label="Password baru" type="password" value={password} onChange={setPassword} placeholder="Minimal 8 karakter" />
                  <Field label="Ulangi password baru" type="password" value={confirm} onChange={setConfirm} placeholder="Ketik ulang password" />
                  {error && <p className="text-sm font-medium text-orange">{error}</p>}
                  <button type="submit" disabled={loading} className="flex w-full items-center justify-center rounded-xl bg-brand-dark px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-900 disabled:cursor-not-allowed disabled:opacity-60">
                    {loading ? "Menyimpan…" : "Simpan password baru"}
                  </button>
                </form>
              )}
            </section>
           </div>
          </Container>
        );
      }

      /* ============================ SETOR BUKTI LARI ============================

      function todayIsoWIB() { return new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10); }
      function runSubmissionState(event) {
        if (!event || !event.runSubmission) return null;

      function formatDurasi(sec) {
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;

      function formatKm(n) { return new Intl.NumberFormat("id-ID", { maximumFractionDigits: 2 }).format(n) + " km"; }
      function hexToRgba(hex, a) {
        const h = hex.replace("#", "");
        const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
        return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";

      /** Screenshot HP bisa 3-8MB — kecilkan ke maks 1600px JPEG sebelum diunggah (batas server 3MB). */
      function compressImage(file, maxDim, quality) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
              else { width = Math.round(width * (maxDim / height)); height = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext("2d");
            if (!ctx) { reject(new Error("canvas tidak didukung")); return; }
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              if (!blob) { reject(new Error("gagal memproses gambar")); return; }
              resolve(new File([blob], "bukti-lari.jpg", { type: "image/jpeg" }));
            }, "image/jpeg", quality);
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("gagal membaca gambar")); };
          img.src = url;
        });
      }

      const JSPDF_SRC = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      function loadJsPdf() {
        if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = JSPDF_SRC; s.async = true; s.crossOrigin = "anonymous"; s.integrity = "sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk";
          s.onload = () => (window.jspdf ? resolve(window.jspdf.jsPDF) : reject(new Error("jsPDF tidak termuat")));
          s.onerror = () => reject(new Error("jsPDF gagal dimuat"));
          document.head.appendChild(s);
        });
      }
      function loadImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
      }
      function roundRectPath(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function fitFont(ctx, text, weight, startSize, minSize, maxWidth, family) {
        let size = startSize;
        ctx.font = weight + " " + size + "px " + family;
        while (ctx.measureText(text).width > maxWidth && size > minSize) {
          size -= 2;
          ctx.font = weight + " " + size + "px " + family;
        }
      }

      /** Kanvas A4 lanskap (2000×1414). c = {name, eventTitle, periodText, distanceKm, durationSeconds, paceSeconds, runDate, certificateNo}. */
      async function renderCertificate(c) {

        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext("2d");

        const { green, dark, gold } = SITE.colors;
        const muted = "#5b6b63";

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        [[0, 0, 760, hexToRgba(green, 0.14)], [W, H, 860, hexToRgba(gold, 0.18)]].forEach(([x, y, r, color]) => {
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, color);
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        });
        const frame = ctx.createLinearGradient(0, 0, W, H);
        frame.addColorStop(0, green);
        frame.addColorStop(1, dark);
        ctx.strokeStyle = frame; ctx.lineWidth = 18; ctx.strokeRect(40, 40, W - 80, H - 80);
        ctx.strokeStyle = hexToRgba(gold, 0.9); ctx.lineWidth = 3; ctx.strokeRect(72, 72, W - 144, H - 144);

        ctx.fillStyle = gold;

        if ("letterSpacing" in ctx) ctx.letterSpacing = "12px";
        ctx.fillText("E-CERTIFICATE", W / 2, 335);
        if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";

        ctx.fillStyle = dark; ctx.font = "800 62px " + F;
        ctx.fillText("SERTIFIKAT FINISHER", W / 2, 415);
        ctx.fillStyle = muted; ctx.font = "400 34px " + F;
        ctx.fillText("Diberikan kepada", W / 2, 500);

        fitFont(ctx, c.name, "800", 104, 48, W - 420, F);
        ctx.fillStyle = green;
        ctx.fillText(c.name, W / 2, 628);
        ctx.strokeStyle = hexToRgba(gold, 0.85); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(W / 2 - 440, 668); ctx.lineTo(W / 2 + 440, 668); ctx.stroke();

        ctx.fillStyle = muted; ctx.font = "400 34px " + F;
        ctx.fillText("telah berhasil menyelesaikan", W / 2, 740);
        fitFont(ctx, c.eventTitle, "800", 60, 36, W - 420, F);
        ctx.fillStyle = dark;
        ctx.fillText(c.eventTitle, W / 2, 822);
        ctx.fillStyle = muted; ctx.font = "600 30px " + F;
        ctx.fillText(c.periodText, W / 2, 874);

        const stats = [
          ["JARAK", formatKm(c.distanceKm)],
          ["WAKTU TEMPUH", formatDurasi(c.durationSeconds)],
          ["PACE RATA-RATA", formatPace(c.paceSeconds) + " /km"],
        ];
        const bw = 440, bh = 172, gap = 44, x0 = (W - (bw * 3 + gap * 2)) / 2, y0 = 944;
        stats.forEach(([label, value], i) => {
          const x = x0 + i * (bw + gap);
          roundRectPath(ctx, x, y0, bw, bh, 28);
          ctx.fillStyle = hexToRgba(green, 0.08);
          ctx.fill();
          ctx.fillStyle = "#6b7a72"; ctx.font = "700 26px " + F;
          ctx.fillText(label, x + bw / 2, y0 + 62);
          ctx.fillStyle = dark; ctx.font = "800 58px " + F;
          ctx.fillText(value, x + bw / 2, y0 + 134);
        });
        ctx.fillStyle = muted; ctx.font = "400 28px " + F;
        ctx.fillText("Tanggal lari: " + formatTanggal(c.runDate), W / 2, 1186);

        ctx.textAlign = "left"; ctx.fillStyle = "#8a968f"; ctx.font = "600 24px " + F;
        ctx.fillText("No. Sertifikat: " + c.certificateNo, 130, H - 128);
        ctx.textAlign = "right"; ctx.fillStyle = dark; ctx.font = "800 30px " + F;
        ctx.fillText(SITE.name, W - 130, H - 152);
        ctx.fillStyle = "#8a968f"; ctx.font = "600 22px " + F;

      }
      function certFileName(c, ext) {
        const safe = (s) => s.replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
        return "Sertifikat-" + safe(c.eventTitle) + "-" + safe(c.name) + "." + ext;

      function triggerDownload(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);

      /* Teks tiap kolom di atas template resmi. Sinkron dengan CERT_FIELDS di yakesma-api/src/lib/validate.ts
         dan certFieldText di admin/index.html. */
      function certFieldText(key, c) {
        if (key === "name") return c.name;
        if (key === "distance") return formatKm(c.distanceKm);
        if (key === "duration") return formatDurasi(c.durationSeconds);
        if (key === "pace") return formatPace(c.paceSeconds) + " /km";
        if (key === "runDate") return formatTanggal(c.runDate);

      /** Sertifikat di atas gambar desain resmi dari admin; null kalau template gagal dimuat (pakai desain bawaan). */
      async function renderTemplateCertificate(templateUrl, layout, c) {
        const img = await loadImage(templateUrl);
        if (!img || !layout) return null;
        const W = img.naturalWidth, H = img.naturalHeight;
        const canvas = document.createElement("canvas");
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext("2d");
        try { await Promise.all(["500", "800"].map((w) => document.fonts.load(w + " 40px 'Plus Jakarta Sans'"))); } catch (e) {}
        ctx.drawImage(img, 0, 0, W, H);
        ctx.textBaseline = "middle";
        Object.keys(layout).forEach((key) => {
          const f = layout[key];
          if (!f || !f.show) return;
          const text = (f.label || "") + certFieldText(key, c);
          if (!text) return;
          fitFont(ctx, text, f.bold ? "800" : "500", Math.round((f.size / 100) * H), 8, W * 0.92, "'Plus Jakarta Sans', system-ui, sans-serif");
          ctx.fillStyle = f.color;
          ctx.textAlign = f.align;
          ctx.fillText(text, (f.x / 100) * W, (f.y / 100) * H);
        });
        return canvas;
      }

      async function downloadCertificate(c, format) {
        const canvas = (c.template && (await renderTemplateCertificate(c.template, c.layout, c))) || (await renderCertificate(c));
        if (format === "png") {
          const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
          triggerDownload(blob, certFileName(c, "png"));
          return;
        }
        const JsPDF = await loadJsPdf();
        const landscape = canvas.width >= canvas.height;
        const w = landscape ? 297 : 210, h = Math.round((w * canvas.height) / canvas.width);
        const pdf = new JsPDF({ orientation: landscape ? "landscape" : "portrait", unit: "mm", format: [w, h] });
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, w, h);
        pdf.save(certFileName(c, "pdf"));
      }
