      /* ====================== RESOLUSI DATA (API live → cache lokal → bawaan) ====================== */
      const CONTENT_CACHE_KEY = "yakesma_content_cache_v1";
      const CONTENT_PROMISE = window.__YAKESMA_CONTENT_PROMISE__ || Promise.resolve(null);

      function readCachedContent() {
        try {
          const raw = JSON.parse(localStorage.getItem(CONTENT_CACHE_KEY) || "null");
          if (raw && raw.events && raw.events.length) return raw;
        } catch (e) {}
        return null;
      }
      function cacheContent(payload) {
        if (!payload || !payload.events || !payload.events.length) return;
        try {
          localStorage.setItem(CONTENT_CACHE_KEY, JSON.stringify({
            site: payload.site, categories: payload.categories, events: payload.events,
          }));
        } catch (e) {}
      }

      // let (bukan const) — dipakai oleh komponen sebagai closure biasa, jadi
      // begitu boot() menimpa nilainya dengan data live, render ulang otomatis
      // memakai isi terbaru tanpa perlu mengubah struktur komponen.
      let SITE, CATEGORIES, EVENTS;
      function applyContent(payload) {
        const override = payload && payload.events && payload.events.length ? payload : null;
        SITE = Object.assign({}, _DEFAULT_SITE, (override && override.site) || {});
        SITE.colors = Object.assign(
          { green: "#28a840", dark: "#185838", gold: "#f6b700", orange: "#f58634" },
          SITE.colors || {}
        );
        CATEGORIES = override && override.categories && override.categories.length ? override.categories : _DEFAULT_CATEGORIES;
        EVENTS = override && override.events && override.events.length ? override.events : _DEFAULT_EVENTS;
      }
      applyContent(readCachedContent());

      const getEvent = (slug) => EVENTS.find((e) => e.slug === slug);

      /* ============================ HELPERS ============================ */
      function formatRupiah(n) {
        if (!n || n <= 0) return "Gratis";
        return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
      }
      function formatTanggal(iso) {
        const d = new Date(iso + "T00:00:00");
        const s = new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(d);
        return s.replace("Minggu", "Ahad");
      }
      function formatWaktu(a, b) {
        if (!a) return "Waktu menyusul";
        return b ? a + " – " + b + " WIB" : a + " WIB";
      }
      function tanggalBadge(iso) {
        const d = new Date(iso + "T00:00:00");
        const day = String(d.getDate()).padStart(2, "0");
        const month = new Intl.DateTimeFormat("id-ID", { month: "short" }).format(d).toUpperCase().replace(".", "");
        return { day, month };
      }
      function formatTanggalPendek(iso) {
        const d = new Date(iso + "T00:00:00");
        return new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "long", year: "numeric" }).format(d);
      }
      /** "24 Agustus – 1 November 2026" — bulan/tahun awal cuma ditulis kalau beda dari akhir. */
      function formatTanggalRange(startIso, endIso) {
        if (!endIso || endIso === startIso) return formatTanggal(startIso);
        const start = new Date(startIso + "T00:00:00");
        const end = new Date(endIso + "T00:00:00");
        const sameYear = start.getFullYear() === end.getFullYear();
        const sameMonth = sameYear && start.getMonth() === end.getMonth();
        const startFmt = sameMonth
          ? String(start.getDate())
          : sameYear
            ? new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "long" }).format(start)
            : formatTanggalPendek(startIso);
        return startFmt + " – " + formatTanggalPendek(endIso);
      }

      /* ============================ STORAGE (localStorage) ============================ */
      const REG_KEY = "yakesma_registrations_v1";
      const ACC_KEY = "yakesma_account_v1";
      function safeParse(raw, fb) { try { return raw ? JSON.parse(raw) : fb; } catch { return fb; } }
      function getRegistrations() {
        const list = safeParse(localStorage.getItem(REG_KEY), []);
        return list.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
      }
      function saveRegistration(reg) {
        const list = safeParse(localStorage.getItem(REG_KEY), []);
        list.push(reg);
        localStorage.setItem(REG_KEY, JSON.stringify(list));
      }
      function removeRegistration(id) {
        const list = safeParse(localStorage.getItem(REG_KEY), []);
        localStorage.setItem(REG_KEY, JSON.stringify(list.filter((r) => r.id !== id)));
      }
      function getAccount() { return safeParse(localStorage.getItem(ACC_KEY), null); }
      function saveAccount(acc) { localStorage.setItem(ACC_KEY, JSON.stringify(acc)); }
      function updateRegistrationInCache(id, patch) {
        const list = safeParse(localStorage.getItem(REG_KEY), []);
        const next = list.map((r) => (r.id === id ? Object.assign({}, r, patch) : r));
        localStorage.setItem(REG_KEY, JSON.stringify(next));
      }

      /* ============================ BACKEND (yakesma-api) ============================ */
      const API_BASE = "https://yakesma-event-api.vercel.app";

      /** Daftar event ke backend nyata. Mengembalikan {ok:true,data} atau {ok:false,error}. */
      async function apiRegister(payload) {
        try {
          const res = await fetch(API_BASE + "/api/registrations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal mendaftar. Coba lagi." };
          return { ok: true, data: body };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server. Periksa koneksi internet Anda." };
        }
      }

      /** Cek status pendaftaran terkini di server (dipakai untuk menyegarkan cache lokal). */
      async function apiLookupStatus(ticketCode, email) {
        try {
          const url = API_BASE + "/api/registrations/lookup?ticketCode=" +
            encodeURIComponent(ticketCode) + "&email=" + encodeURIComponent(email);
          const res = await fetch(url);
          if (!res.ok) return { ok: false };
          const body = await res.json();
          return { ok: true, data: body };
        } catch (e) {
          return { ok: false };
        }
      }

      /** Batalkan pesanan sendiri selama belum dibayar. */
      async function apiCancelOrder(ticketCode, email) {
        try {
          const res = await fetch(API_BASE + "/api/registrations/cancel", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ticketCode, email }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal membatalkan pesanan." };
          return { ok: true };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server. Periksa koneksi internet Anda." };
        }
      }

      /* ============ AKUN PENGUNJUNG (daftar/masuk/keluar) ============ */
      const ACCOUNT_TOKEN_KEY = "yakesma_account_token_v1";
      function getAccountToken() { return localStorage.getItem(ACCOUNT_TOKEN_KEY); }
      function setAccountToken(tok) { localStorage.setItem(ACCOUNT_TOKEN_KEY, tok); }
      function clearAccountToken() { localStorage.removeItem(ACCOUNT_TOKEN_KEY); }

      async function accountFetch(path, opts) {
        const tok = getAccountToken();
        const headers = Object.assign({}, (opts && opts.headers) || {}, tok ? { Authorization: "Bearer " + tok } : {});
        const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
        if (res.status === 401) clearAccountToken();
        return res;
      }

      async function accountRegister(name, email, phone, password) {
        try {
          const res = await fetch(API_BASE + "/api/account/register", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, password }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal mendaftar." };
          return { ok: true, token: body.token, account: body.account };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      async function accountLogin(email, password) {
        try {
          const res = await fetch(API_BASE + "/api/account/login", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal masuk." };
          return { ok: true, token: body.token, account: body.account };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      async function accountSession() {
        try {
          const res = await accountFetch("/api/account/session");
          const body = await res.json().catch(() => ({}));
          if (!res.ok || !body.ok) return { ok: false };
          return { ok: true, account: body.account };
        } catch (e) {
          return { ok: false };
        }
      }

      /* ============ WILAYAH INDONESIA (dropdown berjenjang) ============ */
      const WILAYAH_BASE = "https://www.emsifa.com/api-wilayah-indonesia/api";
      async function fetchWilayah(path) {
        try {
          const res = await fetch(WILAYAH_BASE + path);
          if (!res.ok) return [];
          return await res.json();
        } catch (e) {
          return [];
        }
      }
      const fetchProvinces = () => fetchWilayah("/provinces.json");
      const fetchRegencies = (provinceId) => fetchWilayah("/regencies/" + provinceId + ".json");
      const fetchDistricts = (regencyId) => fetchWilayah("/districts/" + regencyId + ".json");
      const fetchVillages = (districtId) => fetchWilayah("/villages/" + districtId + ".json");

      const SHIRT_SIZES = ["S", "M", "L", "XL", "2XL", "3XL", "4XL"];
      const SHIRT_SIZE_SURCHARGE = { S: 0, M: 0, L: 0, XL: 0, "2XL": 25000, "3XL": 50000, "4XL": 75000 };
      const COURIER = "POS Indonesia";
      // Tarif flat per zona POS Indonesia (Kilat Khusus, paket ringan <1kg) — sinkron
      // dengan yakesma-api/src/lib/validate.ts dan admin/index.html.
      function posShippingFee(province) {
        const p = (province || "").toUpperCase();
        if (p.includes("PAPUA") || p.includes("MALUKU")) return 50000;
        if (p.includes("JAWA") || p.includes("JAKARTA") || p.includes("YOGYAKARTA") || p.includes("BANTEN") || p.includes("BALI")) {
          return 20000;
        }
        return 35000;
      }

      /* ============================ ROUTER (hash) ============================ */
      function parseHash() {
        const raw = (location.hash || "").replace(/^#/, "") || "/";
        const [path, query = ""] = raw.split("?");
        return { path: path || "/", params: new URLSearchParams(query) };
      }
      function useRoute() {
        const [route, setRoute] = useState(parseHash());
        useEffect(() => {
          const on = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
          window.addEventListener("hashchange", on);
          return () => window.removeEventListener("hashchange", on);
        }, []);
        return route;
      }
      const navigate = (to) => { location.hash = to; };
      function Link({ to, className, children, ...rest }) {
        return <a href={"#" + to} className={className} {...rest}>{children}</a>;
      }

      /* ============================ IKON ============================ */

      }
      const IconHome = (p) => <SIcon {...p}><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9.5 21v-6h5v6" /></SIcon>;

      const IconCheckCircle = (p) => <SIcon {...p}><circle cx="12" cy="12" r="9" /><path d="m8.5 12.5 2.5 2.5 4.5-5" /></SIcon>;
      const IconArrowLeft = (p) => <SIcon {...p}><path d="M15 5l-7 7 7 7" /></SIcon>;
      const IconChevronRight = (p) => <SIcon {...p}><path d="m9 5 7 7-7 7" /></SIcon>;
      const IconSearch = (p) => <SIcon {...p}><circle cx="11" cy="11" r="6.5" /><path d="m20 20-3.5-3.5" /></SIcon>;
      const IconTrash = (p) => <SIcon {...p}><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" /></SIcon>;
      const IconShare = (p) => <SIcon {...p}><circle cx="6" cy="12" r="2.4" /><circle cx="18" cy="6" r="2.4" /><circle cx="18" cy="18" r="2.4" /><path d="M8.2 10.8 15.8 7.2M8.2 13.2 15.8 16.8" /></SIcon>;
      const IconCopy = (p) => <SIcon {...p}><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></SIcon>;
      const IconLogOut = (p) => <SIcon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /></SIcon>;
      const IconInstagram = (p) => <SIcon {...p}><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><path d="M17.5 6.5h.01" /></SIcon>;
      const IconWhatsApp = ({ className }) => (
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" className={className} aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-8.6 15.06L2 22l5.06-1.33A10 10 0 1 0 12 2Zm0 18.13a8.1 8.1 0 0 1-4.13-1.13l-.3-.18-3 .79.8-2.93-.19-.3A8.13 8.13 0 1 1 12 20.13Zm4.47-6.1c-.24-.12-1.44-.71-1.66-.79s-.39-.12-.55.12-.63.79-.77.95-.28.18-.52.06a6.65 6.65 0 0 1-1.96-1.21 7.36 7.36 0 0 1-1.36-1.69c-.14-.24 0-.37.11-.49s.24-.28.37-.42a1.62 1.62 0 0 0 .24-.41.45.45 0 0 0 0-.42c-.06-.12-.55-1.32-.75-1.81s-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3 2.75 2.75 0 0 0-.86 2.04 4.78 4.78 0 0 0 1 2.53 10.9 10.9 0 0 0 4.2 3.7c.59.26 1.05.41 1.4.52a3.38 3.38 0 0 0 1.55.1 2.53 2.53 0 0 0 1.66-1.17 2.06 2.06 0 0 0 .14-1.17c-.06-.1-.22-.16-.46-.28Z" />
        </svg>
      );

      /* ============================ KOMPONEN ============================ */
      function Container({ children, className = "" }) {
        return <div className={"mx-auto w-full max-w-5xl px-4 sm:px-6 " + className}>{children}</div>;
      }

      function EventPoster({ event, className = "aspect-square", compact = false }) {
        const { day, month } = tanggalBadge(event.date);
        // compact = kartu (kotak) di beranda/daftar event; !compact = hero halaman detail (lebar).
        const img = compact ? (event.imageSquare || event.imageWide) : (event.imageWide || event.imageSquare);
        return (
          <div className={"relative overflow-hidden rounded-2xl " + className}
            style={{ backgroundImage: img ? undefined : "linear-gradient(145deg," + event.gradient[0] + "," + event.gradient[1] + ")" }}>
            {img ? (
              <img src={img} alt="" className="absolute inset-0 h-full w-full object-cover" />

              <span className="pointer-events-none absolute -bottom-5 -right-3 select-none text-[7rem] leading-none opacity-15">{event.emoji}</span>

              ? "linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0.05) 55%, transparent)"

              <div className="flex items-start justify-between gap-2">
                <span className="text-[11px] font-extrabold uppercase tracking-[0.22em] text-white/90">YAKESMA</span>
                <span className="shrink-0 rounded-full bg-white/20 px-2.5 py-1 text-[11px] font-semibold text-white backdrop-blur-sm">{event.category}</span>
              </div>
              <div>
                <h3 className={"font-extrabold leading-tight text-white drop-shadow-sm " + (compact ? "text-base sm:text-lg" : "text-lg sm:text-2xl")}>{event.title}</h3>
                <div className="mt-3 inline-flex items-center gap-2 rounded-xl bg-white/95 px-3 py-1.5 text-brand-dark shadow-sm">

      function EventCard({ event }) {

          <Link to={"/event/" + event.slug} className="group block">
            <EventPoster event={event} compact className="aspect-square transition-transform duration-300 group-hover:-translate-y-1 group-hover:shadow-xl group-hover:shadow-brand/10" />

              <div className="mt-2 flex items-center justify-between">
                <span className={free ? "rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-bold text-brand-700" : "text-sm font-extrabold text-brand-dark"}>{formatRupiah(event.price)}</span>

            .filter((e) => !query || e.title.toLowerCase().includes(query) || e.location.toLowerCase().includes(query) || e.city.toLowerCase().includes(query) || e.category.toLowerCase().includes(query))

      const STATUS_LABEL = {

      function Barcode({ seed }) {
        const bars = Array.from({ length: 42 }, (_, i) => {
          const c = seed.charCodeAt(i % seed.length) + i * 7;

        return (
          <div className="mt-3 flex h-9 items-stretch justify-center gap-[2px]">

            </div>
            <div className="space-y-4 px-5 py-5">
              <div className="rounded-xl border border-dashed border-brand-200 p-4 text-center">
                <p className="text-xs font-semibold uppercase tracking-widest text-ink/50">Kode Tiket</p>
                <p className="mt-1 font-mono text-2xl font-extrabold tracking-widest text-brand-dark">{reg.code}</p>
                <Barcode seed={reg.code} />
              </div>

              {pending && (reg.paymentUrl ? <PayButton url={reg.paymentUrl} /> : <BankInfo code={reg.code} total={reg.total} />)}
              {pending && onCancelled && (
                <CancelOrderButton code={reg.code} email={reg.email} onCancelled={onCancelled} />
              )}

              <dl className="space-y-2 text-sm">
                <TicketRow label="Event" value={reg.title} />
                <TicketRow label="Tanggal" value={formatTanggal(reg.eventDate)} />
                <TicketRow label="Lokasi" value={reg.location} />
                <TicketRow label="Nama" value={reg.name} />
                <TicketRow label={free ? "Peserta" : "Tiket"} value={String(reg.quantity)} />
                {!free && <TicketRow label="Total" value={formatRupiah(reg.total)} strong />}
              </dl>
              <Link to="/event-saya" className="flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600">Lihat di Event Saya</Link>
              <Link to="/event" className="flex w-full items-center justify-center rounded-xl border border-brand-100 px-4 py-3 text-sm font-semibold text-brand-dark transition hover:bg-brand-50">Daftar Event Lain</Link>
            </div>
          </div>
        );
      }

      function emptyShipping() {
        return {
          address: "", provinceId: "", province: "", cityId: "", city: "",
          districtId: "", district: "", subdistrictId: "", subdistrict: "",
          postalCode: "", shirtSizes: [], courier: COURIER,
        };
      }

      function ShippingFields({ shipping, setShipping }) {
        const [provinces, setProvinces] = useState([]);
        const [regencies, setRegencies] = useState([]);
        const [districts, setDistricts] = useState([]);
        const [villages, setVillages] = useState([]);
        const [loadingLevel, setLoadingLevel] = useState("province");

        useEffect(() => {
          fetchProvinces().then((list) => { setProvinces(list); setLoadingLevel(null); });
        }, []);

        function onProvinceChange(id) {
          const found = provinces.find((p) => p.id === id);
          setShipping((s) => Object.assign({}, s, {
            provinceId: id, province: found ? found.name : "",
            cityId: "", city: "", districtId: "", district: "", subdistrictId: "", subdistrict: "",
          }));
          setRegencies([]); setDistricts([]); setVillages([]);
          if (!id) return;
          setLoadingLevel("regency");
          fetchRegencies(id).then((list) => { setRegencies(list); setLoadingLevel(null); });
        }
        function onCityChange(id) {
          const found = regencies.find((r) => r.id === id);
          setShipping((s) => Object.assign({}, s, {
            cityId: id, city: found ? found.name : "",
            districtId: "", district: "", subdistrictId: "", subdistrict: "",
          }));
          setDistricts([]); setVillages([]);
          if (!id) return;
          setLoadingLevel("district");
          fetchDistricts(id).then((list) => { setDistricts(list); setLoadingLevel(null); });
        }
        function onDistrictChange(id) {
          const found = districts.find((d) => d.id === id);
          setShipping((s) => Object.assign({}, s, {
            districtId: id, district: found ? found.name : "", subdistrictId: "", subdistrict: "",
          }));
          setVillages([]);
          if (!id) return;
          setLoadingLevel("village");
          fetchVillages(id).then((list) => { setVillages(list); setLoadingLevel(null); });
        }
        function onVillageChange(id) {
          const found = villages.find((v) => v.id === id);
          setShipping((s) => Object.assign({}, s, { subdistrictId: id, subdistrict: found ? found.name : "" }));
        }

        const selCls = "w-full rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20 disabled:bg-ink/5 disabled:text-ink/40";

        return (
          <div className="space-y-3 rounded-xl border border-brand-100 bg-brand-50/40 p-4">
            <p className="text-sm font-bold text-brand-dark">Info Pengiriman</p>
            <div>
              <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Alamat Lengkap</label>
              <textarea rows={2} value={shipping.address}
                onChange={(e) => setShipping((s) => Object.assign({}, s, { address: e.target.value }))}
                placeholder="Nama jalan, nomor rumah, RT/RW, patokan…" className={selCls} />
            </div>
            <div className="grid grid-cols-1 gap-3">
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Provinsi</label>
                <select value={shipping.provinceId} onChange={(e) => onProvinceChange(e.target.value)}
                  disabled={loadingLevel === "province"} className={selCls}>
                  <option value="">{loadingLevel === "province" ? "Memuat…" : "Pilih provinsi"}</option>
                  {provinces.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kota/Kabupaten</label>
                <select value={shipping.cityId} onChange={(e) => onCityChange(e.target.value)}
                  disabled={!shipping.provinceId || loadingLevel === "regency"} className={selCls}>
                  <option value="">{loadingLevel === "regency" ? "Memuat…" : "Pilih kota/kabupaten"}</option>
                  {regencies.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kecamatan</label>
                <select value={shipping.districtId} onChange={(e) => onDistrictChange(e.target.value)}
                  disabled={!shipping.cityId || loadingLevel === "district"} className={selCls}>
                  <option value="">{loadingLevel === "district" ? "Memuat…" : "Pilih kecamatan"}</option>
                  {districts.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kelurahan/Desa</label>
                <select value={shipping.subdistrictId} onChange={(e) => onVillageChange(e.target.value)}
                  disabled={!shipping.districtId || loadingLevel === "village"} className={selCls}>
                  <option value="">{loadingLevel === "village" ? "Memuat…" : "Pilih kelurahan/desa"}</option>
                  {villages.map((v) => <option key={v.id} value={v.id}>{v.name}</option>)}
                </select>
              </div>
            </div>
            <div className="grid grid-cols-1 gap-3">
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kode Pos</label>
                <input inputMode="numeric" maxLength={5} value={shipping.postalCode}
                  onChange={(e) => setShipping((s) => Object.assign({}, s, { postalCode: e.target.value.replace(/\D/g, "").slice(0, 5) }))}
                  placeholder="80111" className={selCls} />
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">
                  {shipping.shirtSizes.length > 1 ? "Ukuran Jersey per Peserta" : "Ukuran Jersey"}
                </label>
                <div className="space-y-2">
                  {shipping.shirtSizes.map((size, i) => (
                    <div key={i} className="flex items-center gap-2">
                      {shipping.shirtSizes.length > 1 && (
                        <span className="w-20 shrink-0 text-xs font-semibold text-ink/55">Peserta {i + 1}</span>
                      )}
                      <select value={size}
                        onChange={(e) => {
                          const next = shipping.shirtSizes.slice();
                          next[i] = e.target.value;
                          setShipping((s) => Object.assign({}, s, { shirtSizes: next }));
                        }}
                        className={selCls}>
                        <option value="">Pilih ukuran</option>
                        {SHIRT_SIZES.map((sz) => <option key={sz} value={sz}>{sz}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kurir</label>
                <div className="flex items-center justify-between rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm">
                  <span className="font-semibold text-brand-dark">POS Indonesia</span>
                  <span className="text-ink/55">{shipping.province ? "Ongkir " + formatRupiah(posShippingFee(shipping.province)) : "Ongkir dihitung setelah provinsi dipilih"}</span>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const DONATION_PRESETS = [25000, 50000, 100000, 250000];
      function DonationField({ label, amount, setAmount }) {
        return (
          <div className="space-y-2.5 rounded-xl border border-brand-100 bg-brand-50/40 p-4">
            <p className="text-sm font-bold text-brand-dark">Donasi Tambahan (Opsional)</p>
            {label && <p className="text-xs text-ink/60">{label}</p>}
            <div className="flex flex-wrap gap-2">
              {DONATION_PRESETS.map((p) => (
                <button key={p} type="button"
                  onClick={() => setAmount(amount === p ? 0 : p)}
                  className={"rounded-lg border px-3 py-1.5 text-sm font-semibold transition " + (amount === p ? "border-brand bg-brand text-white" : "border-brand-100 bg-white text-brand-dark hover:bg-brand-50")}>
                  {formatRupiah(p)}
                </button>
              ))}
            </div>
            <div>
              <label className="mb-1 block text-xs font-semibold text-ink/55">Jumlah lain (Rp)</label>
              <input inputMode="numeric" value={amount ? String(amount) : ""}
                onChange={(e) => setAmount(Math.min(10000000, Number(e.target.value.replace(/\D/g, "")) || 0))}
                placeholder="0"
                className="w-full rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
            </div>
          </div>
        );
      }

      function RegistrationForm({ event }) {
        const free = event.price <= 0;
        const [name, setName] = useState("");
        const [email, setEmail] = useState("");
        const [phone, setPhone] = useState("");
        const [qty, setQty] = useState(1);
        const [error, setError] = useState("");
        const [done, setDone] = useState(null);
        const [already, setAlready] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [shipping, setShipping] = useState(emptyShipping);
        const [donation, setDonation] = useState(0);
        const needsShipping = !!event.requiresShipping;
        const donationEnabled = !!event.donationEnabled;
        const shirtSurchargeTotal = needsShipping
          ? shipping.shirtSizes.reduce((sum, sz) => sum + (SHIRT_SIZE_SURCHARGE[sz] || 0), 0)
          : 0;
        const shippingFeeTotal = needsShipping && shipping.province ? posShippingFee(shipping.province) : 0;
        const grandTotal = event.price * qty + shirtSurchargeTotal + shippingFeeTotal + donation;

        useEffect(() => {
          const acc = getAccount();
          if (acc) { setName(acc.name); setEmail(acc.email); setPhone(acc.phone); }
          // Pendaftaran yang sudah dibatalkan tidak menghalangi pendaftaran ulang —
          // constraint unik di server juga hanya berlaku selama belum dibatalkan.
          const existing = getRegistrations().find((r) => r.slug === event.slug && r.paymentStatus !== "cancelled");
          if (!existing) return;
          setAlready(existing);
          // Segarkan status dari server (mis. admin sudah menandai lunas, atau
          // dibatalkan dari perangkat/tab lain) — sebaik mungkin, gagal diam-diam
          // jika offline, cache lama tetap dipakai.
          apiLookupStatus(existing.code, existing.email).then((res) => {
            if (res.ok && res.data.paymentStatus && res.data.paymentStatus !== existing.paymentStatus) {
              const patch = { paymentStatus: res.data.paymentStatus };
              updateRegistrationInCache(existing.id, patch);
              if (res.data.paymentStatus === "cancelled") { setAlready(null); return; }
              setAlready((prev) => (prev ? Object.assign({}, prev, patch) : prev));
            }
          });
        }, [event.slug]);

        // Satu ukuran jersey per peserta — panjang shirtSizes ikut jumlah tiket,
        // isi yang sudah dipilih dipertahankan saat jumlah berubah.
        useEffect(() => {
          if (!needsShipping) return;
          setShipping((s) => {
            const sizes = s.shirtSizes.slice(0, qty);
            while (sizes.length < qty) sizes.push("");
            return Object.assign({}, s, { shirtSizes: sizes });
          });
        }, [qty, needsShipping]);

        async function handleSubmit(e) {
          e.preventDefault();
          if (!name.trim() || !email.trim() || !phone.trim()) { setError("Mohon lengkapi nama, email, dan nomor WhatsApp."); return; }
          if (!/^\S+@\S+\.\S+$/.test(email)) { setError("Format email belum benar."); return; }
          if (needsShipping) {
            if (!shipping.address.trim()) { setError("Alamat wajib diisi."); return; }
            if (!shipping.province || !shipping.city || !shipping.district || !shipping.subdistrict) {
              setError("Provinsi, kota, kecamatan, dan kelurahan wajib diisi."); return;
            }
            if (!/^\d{5}$/.test(shipping.postalCode)) { setError("Kode pos harus 5 digit angka."); return; }
            if (shipping.shirtSizes.length !== qty || shipping.shirtSizes.some((sz) => !sz)) {
              setError("Pilih ukuran jersey untuk setiap peserta."); return;
            }
          }
          setError("");
          setSubmitting(true);
          const result = await apiRegister({
            eventSlug: event.slug,
            eventTitle: event.title,
            eventCategory: event.category,
            eventDate: event.date,
            eventLocation: event.online ? "Online" : event.location + ", " + event.city,
            name: name.trim(),
            email: email.trim(),
            phone: phone.trim(),
            quantity: qty,
            unitPrice: event.price,
            donationAmount: donation,
            shipping: needsShipping ? {
              address: shipping.address.trim(),
              province: shipping.province,
              city: shipping.city,
              district: shipping.district,
              subdistrict: shipping.subdistrict,
              postalCode: shipping.postalCode,
              shirtSizes: shipping.shirtSizes,
              courier: shipping.courier,
            } : undefined,
          });
          setSubmitting(false);
          if (!result.ok) { setError(result.error); return; }

          const reg = {
            id: result.data.id, slug: event.slug, title: event.title, category: event.category,
            name: name.trim(), email: email.trim(), phone: phone.trim(),
            quantity: qty, unitPrice: event.price, total: result.data.totalAmount,
            code: result.data.ticketCode, paymentStatus: result.data.paymentStatus,
            paymentUrl: result.data.paymentUrl || null,
            eventDate: event.date,
            location: event.online ? "Online" : event.location + ", " + event.city,
            createdAt: new Date().toISOString(),
          };
          saveRegistration(reg);
          saveAccount({ name: reg.name, email: reg.email, phone: reg.phone });
          setDone(reg);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        if (done) {
          return (
            <TicketCard reg={done} free={free} onCancelled={() => {
              updateRegistrationInCache(done.id, { paymentStatus: "cancelled" });
              setDone((d) => (d ? Object.assign({}, d, { paymentStatus: "cancelled" }) : d));
            }} />
          );
        }
        if (already)
          return (
            <div className="space-y-3 rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 text-brand-dark">
                  <IconCheckCircle className="size-6 text-brand" />
                  <p className="font-bold">Anda sudah terdaftar</p>
                </div>
                <StatusBadge status={already.paymentStatus} />
              </div>
              <p className="text-sm text-ink/60">
                Kode tiket Anda: <span className="font-mono font-bold text-brand-dark">{already.code}</span>
              </p>
              {already.paymentStatus === "pending_transfer" && (
                <React.Fragment>
                  {already.paymentUrl ? <PayButton url={already.paymentUrl} /> : <BankInfo code={already.code} total={already.total} />}
                  <CancelOrderButton code={already.code} email={already.email} onCancelled={() => {
                    updateRegistrationInCache(already.id, { paymentStatus: "cancelled" });
                    setAlready(null);
                  }} />
                </React.Fragment>
              )}
              <Link to="/event-saya" className="flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600">Lihat di Event Saya</Link>
            </div>
          );

        const todayIso = new Date().toISOString().slice(0, 10);
        if (event.registrationStart && todayIso < event.registrationStart) {
          return (
            <div className="space-y-2 rounded-2xl border border-brand-100 bg-white p-5 text-center shadow-sm">
              <IconCalendar className="mx-auto size-8 text-ink/30" />
              <p className="font-bold text-brand-dark">Pendaftaran Belum Dibuka</p>
              <p className="text-sm text-ink/60">Pendaftaran dibuka mulai {formatTanggalPendek(event.registrationStart)}.</p>
            </div>
          );
        }
        if (event.registrationEnd && todayIso > event.registrationEnd) {
          return (
            <div className="space-y-2 rounded-2xl border border-brand-100 bg-white p-5 text-center shadow-sm">
              <IconCalendar className="mx-auto size-8 text-ink/30" />
              <p className="font-bold text-brand-dark">Pendaftaran Sudah Ditutup</p>
              <p className="text-sm text-ink/60">Pendaftaran untuk event ini ditutup pada {formatTanggalPendek(event.registrationEnd)}.</p>
            </div>
          );
        }

        return (
          <form onSubmit={handleSubmit} className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
            <div className="mb-4 flex items-baseline justify-between">
              <span className="text-sm font-semibold text-ink/60">Harga</span>
              <span className="text-xl font-extrabold text-brand-dark">{formatRupiah(event.price)}</span>
            </div>
            <div className="space-y-3">
              <Field label="Nama Lengkap" value={name} onChange={setName} placeholder="Nama sesuai identitas" />
              <Field label="Email" type="email" value={email} onChange={setEmail} placeholder="nama@email.com" />
              <Field label="Nomor WhatsApp" type="tel" value={phone} onChange={(v) => setPhone(cleanPhoneInput(v))} placeholder="08xxxxxxxxxx" inputMode="numeric" maxLength={13} />
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Jumlah {free ? "Peserta" : "Tiket"}</label>
                <div className="flex items-center gap-3">
                  <button type="button" onClick={() => setQty((q) => Math.max(1, q - 1))} className="size-10 rounded-xl border border-brand-100 text-lg font-bold text-brand-dark transition hover:bg-brand-50" aria-label="Kurangi">−</button>
                  <span className="w-8 text-center text-lg font-bold text-brand-dark">{qty}</span>
                  <button type="button" onClick={() => setQty((q) => Math.min(5, q + 1))} className="size-10 rounded-xl border border-brand-100 text-lg font-bold text-brand-dark transition hover:bg-brand-50" aria-label="Tambah">+</button>
                </div>
              </div>
              {donationEnabled && (
                <DonationField label={event.donationLabel} amount={donation} setAmount={setDonation} />
              )}
            </div>
            {(!free || donationEnabled) && (
              <div className="mt-4 space-y-1.5 border-t border-brand-50 pt-4">
                <div className="flex items-center justify-between text-sm text-ink/60">
                  <span>Tiket × {qty}</span>
                  <span>{free ? "Gratis" : formatRupiah(event.price * qty)}</span>
                </div>
                {donation > 0 && (
                  <div className="flex items-center justify-between text-sm text-ink/60">
                    <span>Donasi{event.donationLabel ? " (" + event.donationLabel + ")" : ""}</span>
                    <span>{formatRupiah(donation)}</span>
                  </div>
                )}
                {shirtSurchargeTotal > 0 && (
                  <div className="flex items-center justify-between text-sm text-ink/60">
                    <span>Tambahan ukuran jersey</span>
                    <span>{formatRupiah(shirtSurchargeTotal)}</span>
                  </div>
                )}
                {needsShipping && (
                  <div className="flex items-center justify-between text-sm text-ink/60">
                    <span>Ongkir POS Indonesia</span>
                    <span>{shipping.province ? formatRupiah(shippingFeeTotal) : "—"}</span>
                  </div>
                )}
                <div className="flex items-center justify-between pt-1">
                  <span className="text-sm font-semibold text-ink/60">Total</span>
                  <span className="text-xl font-extrabold text-brand-dark">{formatRupiah(grandTotal)}</span>
                </div>
              </div>
            )}
            {needsShipping && (
              <div className="mt-4">
                <ShippingFields shipping={shipping} setShipping={setShipping} />
              </div>
            )}
            {error && <p className="mt-3 rounded-lg bg-orange/10 px-3 py-2 text-sm font-medium text-orange">{error}</p>}
            <button type="submit" disabled={submitting} className="mt-5 flex w-full items-center justify-center gap-2 rounded-xl bg-brand px-4 py-3.5 text-sm font-bold text-white shadow-sm shadow-brand/30 transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60">
              <IconTicket className="size-5" />{submitting ? "Memproses…" : grandTotal > 0 ? "Pesan Tiket" : "Daftar Sekarang"}
            </button>
            <p className="mt-3 text-center text-xs text-ink/45">{grandTotal > 0 ? "Setelah mendaftar, transfer sesuai instruksi. Admin mengonfirmasi secara manual." : "Pendaftaran gratis. Konfirmasi dikirim ke WhatsApp Anda."}</p>
          </form>
        );
      }

      function AppHeader() {
        return (
          <header className="sticky top-0 z-40 border-b border-black/5 bg-white/85 backdrop-blur-md">
            <div className="mx-auto flex h-16 max-w-5xl items-center justify-center px-4">
              <Link to="/" aria-label={SITE.name} className="flex items-center">
                <img src={SITE.logo} alt={SITE.name} className="h-8 w-auto sm:h-9" />
              </Link>
            </div>
          </header>
        );
      }

      function BottomNav({ path }) {
        const ICONS = { home: IconHome, calendar: IconCalendar, ticket: IconTicket, user: IconUser };
        return (
          <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-black/5 bg-white/95 backdrop-blur-md">
            <div className="mx-auto grid max-w-md grid-cols-4">
              {NAV.map((item) => {
                const Icon = ICONS[item.icon];
                const active = item.href === "/" ? path === "/" : path === item.href || path.startsWith(item.href + "/");
                return (
                  <Link key={item.href} to={item.href} className="relative flex flex-col items-center gap-1 py-2.5">
                    {active && <span className="absolute top-0 h-0.5 w-10 rounded-full bg-brand" />}
                    <Icon className={active ? "size-6 text-brand" : "size-6 text-ink/45"} strokeWidth={active ? 2.1 : 1.8} />
                    <span className={"text-[11px] font-medium " + (active ? "text-brand" : "text-ink/50")}>{item.label}</span>
                  </Link>
                );
              })}
            </div>
          </nav>
        );
      }

      /* ============================ HALAMAN ============================ */
      function SectionHeading({ title, action }) {
        return (
          <div className="mb-4 flex items-end justify-between gap-4">
            <h2 className="text-xl font-extrabold text-brand-dark sm:text-2xl">{title}</h2>
            {action}
          </div>
        );
      }
      function Stat({ value, label }) {
        return <div><div className="text-lg font-extrabold leading-none">{value}</div><div className="mt-1 text-xs text-white/75">{label}</div></div>;
      }

      function Home() {
        const upcoming = [...EVENTS].sort((a, b) => a.date.localeCompare(b.date));
        const terbaru = upcoming.slice(0, 6);
        const totalPeserta = EVENTS.reduce((s, e) => s + e.registered, 0);
        return (

      /** Link langsung ke landing page event ini — dipakai buat share & tujuan iklan (mis. Meta Ads). */
      /**
       * Link lewat /share/:slug (yakesma-api), bukan langsung #/event/:slug.
       * Situs ini SPA murni sisi-klien (hash routing) sehingga crawler
       * (Facebook/WhatsApp) tak bisa melihat judul/foto per-event kalau
       * link hash dibagikan langsung — hanya lihat meta tag generik.
       * /share/:slug di-render server (Next.js) dengan og:title/og:image
       * sesuai event, lalu otomatis mengalihkan manusia ke halaman aslinya.
       */
      function eventShareUrl(event) {
        // Penanda tanggal (bukan angka acak) — link tetap stabil sepanjang hari yang
        // sama (aman dipakai berulang di Meta Ads), tapi otomatis "kedaluwarsa" tiap
        // hari supaya proxy cache basi di jaringan operator seluler tertentu tidak
        // terus-menerus menyimpan versi lama (pernah terjadi: 404 di HP, normal di PC).
        const v = new Date().toISOString().slice(0, 10).replace(/-/g, "");
        return API_BASE + "/share/" + event.slug + "?v=" + v;
      }

      function ShareButton({ event }) {
        const [copied, setCopied] = useState(false);
        async function handleShare() {
          const url = eventShareUrl(event);
          if (navigator.share) {
            try { await navigator.share({ title: event.title, text: event.excerpt, url }); } catch (e) {}
            return;
          }
          try {
            await navigator.clipboard.writeText(url);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          } catch (e) {
            try { window.prompt("Salin link event ini:", url); } catch (e2) {}
          }
        }
        return (
          <button type="button" onClick={handleShare}
            className="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-brand-100 bg-white px-4 py-2 text-sm font-semibold text-brand-dark transition hover:border-brand hover:bg-brand-50">
            {copied ? <IconCheck className="size-4 text-brand" strokeWidth={2.6} /> : <IconShare className="size-4" />}
            {copied ? "Link tersalin!" : "Bagikan"}
          </button>
        );
      }

      function EventSaya() {

          cached.forEach((r) => {
            if (!r.code || !r.email) return;
            apiLookupStatus(r.code, r.email).then((res) => {
              if (res.ok && res.data.paymentStatus && res.data.paymentStatus !== r.paymentStatus) {
                updateRegistrationInCache(r.id, { paymentStatus: res.data.paymentStatus });
                setRegs(getRegistrations());

      function AccountAuthPanel({ onLoggedIn }) {
        const [mode, setMode] = useState("login"); // login | register
        const [name, setName] = useState("");
        const [email, setEmail] = useState("");
        const [phone, setPhone] = useState("");
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);

        async function submit(e) {
          e.preventDefault();
          setError(""); setLoading(true);
          const res = mode === "login"
            ? await accountLogin(email.trim(), password)
            : await accountRegister(name.trim(), email.trim(), phone.trim(), password);
          setLoading(false);
          if (!res.ok) { setError(res.error); return; }
          setAccountToken(res.token);
          onLoggedIn(res.account);
        }

        function switchMode(next) { setMode(next); setError(""); setPassword(""); }

        return (
          <div>
            <div className="mb-3 flex gap-1 rounded-xl bg-brand-50/60 p-1">
              <button type="button" onClick={() => switchMode("login")}
                className={"flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition " + (mode === "login" ? "bg-white text-brand-dark shadow-sm" : "text-ink/50")}>Masuk</button>
              <button type="button" onClick={() => switchMode("register")}
                className={"flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition " + (mode === "register" ? "bg-white text-brand-dark shadow-sm" : "text-ink/50")}>Daftar Akun</button>
            </div>
            <form onSubmit={submit} className="space-y-3">
              {mode === "register" && <Field label="Nama Lengkap" value={name} onChange={setName} placeholder="Nama Anda" />}
              <Field label="Email" type="email" value={email} onChange={setEmail} placeholder="nama@email.com" />
              {mode === "register" && <Field label="Nomor WhatsApp (opsional)" type="tel" value={phone} onChange={(v) => setPhone(cleanPhoneInput(v))} placeholder="08xxxxxxxxxx" inputMode="numeric" maxLength={13} />}
              <Field label="Password" type="password" value={password} onChange={setPassword} placeholder={mode === "register" ? "Minimal 8 karakter" : "Password"} />
              {error && <p className="text-sm font-medium text-orange">{error}</p>}
              <button type="submit" disabled={loading} className="flex w-full items-center justify-center rounded-xl bg-brand-dark px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-900 disabled:cursor-not-allowed disabled:opacity-60">
                {loading ? "Memproses…" : mode === "login" ? "Masuk" : "Daftar"}
              </button>
            </form>
            <p className="mt-3 text-center text-xs text-ink/50">
              {mode === "login" ? "Belum punya akun? " : "Sudah punya akun? "}
              <button type="button" onClick={() => switchMode(mode === "login" ? "register" : "login")} className="font-semibold text-brand hover:underline">
                {mode === "login" ? "Daftar sekarang" : "Masuk di sini"}
              </button>
            </p>
          </div>
        );
      }

      function Akun() {
        const [session, setSession] = useState("checking"); // checking | out | in
        const [account, setAccount] = useState(null);
        const [name, setName] = useState("");
        const [email, setEmail] = useState("");
        const [phone, setPhone] = useState("");
        const [count, setCount] = useState(0);
        const [saved, setSaved] = useState(false);

        useEffect(() => {
          const acc = getAccount();
          if (acc) { setName(acc.name); setEmail(acc.email); setPhone(acc.phone); }
          setCount(getRegistrations().length);

          if (!getAccountToken()) { setSession("out"); return; }
          accountSession().then((res) => {
            if (!res.ok) { setSession("out"); return; }
            setSession("in");
            setAccount(res.account);
            setName(res.account.name); setEmail(res.account.email); setPhone(res.account.phone || "");
          });
        }, []);

        function handleSave(e) {
          e.preventDefault();
          saveAccount({ name: name.trim(), email: email.trim(), phone: phone.trim() });
          setSaved(true); setTimeout(() => setSaved(false), 2200);
        }

        function handleLoggedIn(acc) {
          setSession("in");
          setAccount(acc);
          setName(acc.name); setEmail(acc.email); setPhone(acc.phone || "");
          saveAccount({ name: acc.name, email: acc.email, phone: acc.phone || "" });
        }

        function handleLogout() {
          clearAccountToken();
          setSession("out");
          setAccount(null);
        }

        return (
          <Container className="space-y-6">
            <h1 className="text-2xl font-extrabold text-brand-dark sm:text-3xl">Akun</h1>
            <section className="overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-sm">

                  <p className="truncate text-lg font-extrabold">{name || "Tamu"}</p>

              {session === "checking" ? (
                <p className="p-5 text-center text-sm text-ink/40">Memuat…</p>

                <div className="space-y-3 p-5">
                  <Field label="Nama Lengkap" value={name} onChange={setName} placeholder="Nama Anda" />
                  <Field label="Nomor WhatsApp" type="tel" value={phone} onChange={(v) => setPhone(cleanPhoneInput(v))} placeholder="08xxxxxxxxxx" inputMode="numeric" maxLength={13} />
                  <p className="text-xs text-ink/45">Email: {account.email} (tidak bisa diubah)</p>
                  <button type="button" onClick={handleSave} className="flex w-full items-center justify-center gap-2 rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600">
                    {saved ? <React.Fragment><IconCheckCircle className="size-5" /> Tersimpan</React.Fragment> : "Simpan Profil"}
                  </button>
                  <button type="button" onClick={handleLogout} className="flex w-full items-center justify-center gap-2 rounded-xl border border-orange/40 px-4 py-3 text-sm font-semibold text-orange transition hover:bg-orange/10">
                    <IconLogOut className="size-4" />Keluar
                  </button>
                </div>
              ) : (
                <div className="space-y-4 p-5">
                  <form onSubmit={handleSave} className="space-y-3">
                    <Field label="Nama Lengkap" value={name} onChange={setName} placeholder="Nama Anda" />
                    <Field label="Email" type="email" value={email} onChange={setEmail} placeholder="nama@email.com" />
                    <Field label="Nomor WhatsApp" type="tel" value={phone} onChange={(v) => setPhone(cleanPhoneInput(v))} placeholder="08xxxxxxxxxx" inputMode="numeric" maxLength={13} />
                    <button type="submit" className="flex w-full items-center justify-center gap-2 rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600">
                      {saved ? <React.Fragment><IconCheckCircle className="size-5" /> Tersimpan</React.Fragment> : "Simpan Profil"}
                    </button>
                    <p className="text-center text-xs text-ink/45">Data disimpan di perangkat Anda dan dipakai untuk mengisi form pendaftaran otomatis.</p>

                  <div className="border-t border-brand-50 pt-4">
                    <AccountAuthPanel onLoggedIn={handleLoggedIn} />

                </div>
              )}

              <span className="grid size-10 place-items-center rounded-xl bg-brand-50 text-brand"><IconTicket className="size-5" /></span>
              <div className="flex-1"><p className="font-bold text-brand-dark">Event Saya</p><p className="text-sm text-ink/55">Lihat tiket & pendaftaran Anda</p></div>
              <span className="text-brand">›</span>
            </Link>

            <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <h2 className="mb-3 font-extrabold text-brand-dark">Hubungi Kami</h2>
              <div className="grid gap-2.5 sm:grid-cols-2">
                <a href={"https://wa.me/" + SITE.whatsapp} target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 rounded-xl border border-brand-50 px-3.5 py-3 transition hover:bg-brand-50"><IconWhatsApp className="size-5 text-brand" /><span className="text-sm font-semibold text-brand-dark">WhatsApp</span></a>
                <a href={"https://instagram.com/" + SITE.instagram} target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 rounded-xl border border-brand-50 px-3.5 py-3 transition hover:bg-brand-50"><IconInstagram className="size-5 text-brand" /><span className="text-sm font-semibold text-brand-dark">@{SITE.instagram}</span></a>
              </div>
              <p className="mt-3 text-sm text-ink/55">{SITE.address}</p>
            </section>

            <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <h2 className="mb-2 font-extrabold text-brand-dark">Tentang Kami</h2>
              <p className="text-sm leading-relaxed text-ink/70">{SITE.name} adalah {SITE.tagline} yang berkhidmat menghimpun dan menyalurkan zakat, infak, sedekah, serta wakaf secara amanah dan profesional. Melalui beragam kajian, kelas, dan program sosial, kami mengajak umat untuk terus belajar dan berbagi.</p>
            </section>
            <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <h2 className="mb-2 font-extrabold text-brand-dark">Kebijakan Privasi</h2>
              <p className="text-sm leading-relaxed text-ink/70">Data pendaftaran yang Anda masukkan pada situs ini disimpan secara lokal di perangkat Anda dan digunakan semata untuk keperluan pendaftaran event. Kami tidak membagikan data Anda kepada pihak ketiga tanpa izin.</p>
            </section>
            <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <h2 className="mb-2 font-extrabold text-brand-dark">Syarat & Ketentuan</h2>
              <p className="text-sm leading-relaxed text-ink/70">Dengan mendaftar, Anda menyetujui untuk hadir sesuai jadwal dan mematuhi tata tertib penyelenggara. Kuota event terbatas dan berlaku selama tempat masih tersedia.</p>
            </section>

            <footer className="pb-2 pt-2 text-center">
              <img src={SITE.mark} alt={SITE.name} className="mx-auto h-9 w-auto opacity-90" />
              <p className="mt-3 text-xs text-ink/45">© {new Date().getFullYear()} {SITE.name} — {SITE.tagline}</p>
            </footer>
          </Container>
        );
      }

      function NotFound() {
        return (
          <Container className="py-20 text-center">
            <p className="text-6xl">🧭</p>
            <h1 className="mt-4 text-2xl font-extrabold text-brand-dark">Halaman tidak ditemukan</h1>
            <p className="mx-auto mt-2 max-w-sm text-ink/60">Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan.</p>
            <Link to="/" className="mt-6 inline-flex rounded-full bg-brand px-6 py-3 text-sm font-bold text-white transition hover:bg-brand-600">Kembali ke Beranda</Link>
          </Container>
        );
      }

      /* ============================ APP ============================ */
      const TITLES = { "/": null, "/event": "Event", "/event-saya": "Event Saya", "/akun": "Akun" };
      function App() {
        const route = useRoute();
        const seg = route.path.split("/").filter(Boolean);
        let page, title;
        if (route.path === "/") { page = <Home />; title = null; }
        else if (route.path === "/event") { page = <EventList kategori={route.params.get("kategori")} />; title = "Event"; }
        else if (seg[0] === "event" && seg[1]) { const ev = getEvent(seg[1]); page = <EventDetail slug={seg[1]} />; title = ev ? ev.title : "Event tidak ditemukan"; }
        else if (route.path === "/event-saya") { page = <EventSaya />; title = "Event Saya"; }
        else if (route.path === "/akun") { page = <Akun />; title = "Akun"; }
        else { page = <NotFound />; title = "Halaman tidak ditemukan"; }

        useEffect(() => {
          document.title = title ? title + " · " + SITE.name : SITE.name + " — " + SITE.tagline;
        }, [title]);

        return (
          <div className="app-bg flex min-h-screen flex-col font-sans text-ink">
            <AppHeader />
            <main className="flex-1 pb-24 pt-6 sm:pt-8">{page}</main>
            <BottomNav path={route.path} />
          </div>
        );
      }

      /* Terapkan warna brand dari data ke Tailwind (Play CDN) sebelum render */
      function applyBrandColors() {
        try {
          const c = SITE.colors;
          if (window.tailwind && c) {
            tailwind.config = {
              theme: {
                extend: {
                  colors: {
                    brand: {
                      DEFAULT: c.green, 50: "#edf8ef", 100: "#d3efd9", 200: "#a8dfb5",
                      300: "#74c98a", 400: "#45b866", 500: c.green, 600: "#1f9036",
                      700: "#1b752f", 800: c.dark, 900: "#123f28", dark: c.dark,
                    },
                    gold: { DEFAULT: c.gold, light: "#fbcf3a" },
                    orange: c.orange,
                    ink: "#17251d",
                  },
                  fontFamily: {
                    sans: ['"Plus Jakarta Sans"', "ui-sans-serif", "system-ui", "-apple-system", "sans-serif"],
                  },
                },
              },
            };
            if (tailwind.refresh) tailwind.refresh();
          }
        } catch (e) {}
      }

      /* ============================ BOOT ============================
         Render sekali secepat mungkin (cache lokal / bawaan), lalu — begitu
         konten live datang (di-race dengan timeout 2.5 detik supaya cold-start
         Vercel/koneksi lambat tak menahan tampilan awal) — render ulang
         dengan data terkini. Kalau API gagal total, situs tetap tampil apa
         adanya (fallback), bukan kosong/rusak. */
      (async function boot() {
        const root = ReactDOM.createRoot(document.getElementById("root"));

        let resolved = null;
        try {
          resolved = await Promise.race([
            CONTENT_PROMISE,
            new Promise((resolve) => setTimeout(() => resolve(null), 2500)),
          ]);
        } catch (e) {}

        if (resolved) {
          applyContent(resolved);
          cacheContent(resolved);
          applyBrandColors();
          root.render(<App key="live" />);
          return;
        }

        applyBrandColors();
        root.render(<App key="fallback" />);

        CONTENT_PROMISE.then((data) => {
          if (!data) return;
          applyContent(data);
          cacheContent(data);
          applyBrandColors();
          root.render(<App key="live" />);
        }).catch(() => {});
      })();
    </script>
  </body>
</html>
