      /* ====================== RESOLUSI DATA (API live → cache lokal → bawaan) ====================== */
      const CONTENT_CACHE_KEY = "yakesma_content_cache_v1";
      const CONTENT_PROMISE = window.__YAKESMA_CONTENT_PROMISE__ || Promise.resolve(null);

      function readCachedContent() {
        try {
          const raw = JSON.parse(localStorage.getItem(CONTENT_CACHE_KEY) || "null");
          if (raw && raw.events && raw.events.length) return raw;
        } catch (e) {}
        return null;
      }
      function cacheContent(payload) {
        if (!payload || !payload.events || !payload.events.length) return;
        try {
          localStorage.setItem(CONTENT_CACHE_KEY, JSON.stringify({
            site: payload.site, categories: payload.categories, events: payload.events,
          }));
        } catch (e) {}
      }

      // let (bukan const) — dipakai oleh komponen sebagai closure biasa, jadi
      // begitu boot() menimpa nilainya dengan data live, render ulang otomatis
      // memakai isi terbaru tanpa perlu mengubah struktur komponen.
      let SITE, CATEGORIES, EVENTS;
      function applyContent(payload) {
        const override = payload && payload.events && payload.events.length ? payload : null;
        SITE = Object.assign({}, _DEFAULT_SITE, (override && override.site) || {});
        SITE.colors = Object.assign(
          { green: "#28a840", dark: "#185838", gold: "#f6b700", orange: "#f58634" },
          SITE.colors || {}
        );
        CATEGORIES = override && override.categories && override.categories.length ? override.categories : _DEFAULT_CATEGORIES;
        EVENTS = override && override.events && override.events.length ? override.events : _DEFAULT_EVENTS;
      }
      applyContent(readCachedContent());

      const getEvent = (slug) => EVENTS.find((e) => e.slug === slug);
      /** "Terisi" = peserta terkonfirmasi otomatis (Lunas + Gratis, dari API) + angka manual dari admin. */
      const registeredCount = (e) => (Number(e.registered) || 0) + (Number(e.confirmedCount) || 0);

      /* ============================ HELPERS ============================ */
      function formatRupiah(n) {
        if (!n || n <= 0) return "Gratis";
        return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
      }
      function formatTanggal(iso) {
        const d = new Date(iso + "T00:00:00");
        const s = new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(d);
        return s.replace("Minggu", "Ahad");
      }
      function formatWaktu(a, b) {
        if (!a) return "Waktu menyusul";
        return b ? a + " – " + b + " WIB" : a + " WIB";
      }
      function tanggalBadge(iso) {
        const d = new Date(iso + "T00:00:00");
        const day = String(d.getDate()).padStart(2, "0");
        const month = new Intl.DateTimeFormat("id-ID", { month: "short" }).format(d).toUpperCase().replace(".", "");
        return { day, month };
      }
      function formatTanggalPendek(iso) {
        const d = new Date(iso + "T00:00:00");
        return new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "long", year: "numeric" }).format(d);
      }
      /** "24 Agustus – 1 November 2026" — bulan/tahun awal cuma ditulis kalau beda dari akhir. */
      function formatTanggalRange(startIso, endIso) {
        if (!endIso || endIso === startIso) return formatTanggal(startIso);
        const start = new Date(startIso + "T00:00:00");
        const end = new Date(endIso + "T00:00:00");
        const sameYear = start.getFullYear() === end.getFullYear();
        const sameMonth = sameYear && start.getMonth() === end.getMonth();
        const startFmt = sameMonth
          ? String(start.getDate())
          : sameYear
            ? new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "long" }).format(start)
            : formatTanggalPendek(startIso);
        return startFmt + " – " + formatTanggalPendek(endIso);
      }

      /** Event dianggap sudah selesai kalau tanggal pelaksanaannya (dateEnd
       * kalau berbentuk rentang, atau date) sudah lewat hari ini. Dipakai
       * untuk mengganti form pendaftaran dengan info "sudah selesai" di
       * halaman detail — event lama tetap tampil di daftar/beranda yang sama
       * dengan event aktif, cuma form-nya yang berbeda. */
      function isEventFinished(event) {

      /* ============ KODE POS (dicocokkan dengan kelurahan terpilih) ============
         Sumber: kodepos.vercel.app (data komunitas, CORS terbuka). Nama wilayahnya
         ditulis berbeda dari api-wilayah-indonesia ("NUSAPENIDA" vs "Nusa Penida",
         "KOTA JAKARTA SELATAN" vs "Administrasi Jakarta Selatan"), jadi dicocokkan
         setelah huruf kecil + tanpa spasi/tanda baca, dengan beberapa variasi query. */
      const KODEPOS_BASE = "https://kodepos.vercel.app/search/?q=";
      const _postalCache = {};
      function normWilayah(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
      function regencyCore(s) {
        return String(s || "").toLowerCase().replace(/\b(kabupaten|kota administrasi|administrasi|kota)\b|adm\./g, " ").replace(/\s+/g, " ").trim();
      }
      async function searchKodepos(q) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 8000);
        try {
          const res = await fetch(KODEPOS_BASE + encodeURIComponent(q.toLowerCase()), { signal: ctrl.signal });
          if (!res.ok) throw new Error("kodepos " + res.status);
          const body = await res.json();
          return Array.isArray(body.data) ? body.data : [];
        } finally {
          clearTimeout(t);
        }
      }
      /** {level:"desa"|"kecamatan", codes:["12520"]} · null kalau tidak ditemukan · melempar error kalau layanan tidak bisa dihubungi. */
      async function lookupPostalCodes(village, district, regency) {
        const key = [village, district, regency].join("|");
        if (_postalCache[key] !== undefined) return _postalCache[key];
        const V = normWilayah(village), D = normWilayah(district), R = normWilayah(regencyCore(regency));
        const uniq = (rows) => Array.from(new Set(rows.map((x) => String(x.code)))).sort();
        let result = null;
        // Tiga variasi dijalankan bersamaan (layanan kadang lambat); urutan prioritas tetap dijaga.
        const settled = await Promise.allSettled(
          [village + " " + district, village + " " + regencyCore(regency), village].map(searchKodepos));
        if (settled.every((s) => s.status === "rejected")) throw new Error("layanan kode pos tidak bisa dihubungi");
        for (const s of settled) {
          if (s.status !== "fulfilled") continue;
          const rows = s.value.filter((x) =>
            normWilayah(x.village) === V && (normWilayah(x.district) === D || normWilayah(regencyCore(x.regency)) === R));
          if (rows.length) { result = { level: "desa", codes: uniq(rows) }; break; }
        }
        if (!result) {
          const rows = (await searchKodepos(district + " " + regencyCore(regency))).filter((x) =>
            normWilayah(x.district) === D && normWilayah(regencyCore(x.regency)) === R);
          if (rows.length) result = { level: "kecamatan", codes: uniq(rows) };
        }
        _postalCache[key] = result;
        return result;
      }

      /**
       * Segarkan status pesanan SAAT peserta kembali ke halaman (tab/aplikasi dibuka lagi, mis. setelah

       * refresh(onlyPending) dipanggil; ia sendiri yang menangani error (gagal = diam, coba lagi nanti).
       */
      function useLiveRefresh(refresh, poll) {
        const latest = useRef(refresh);
        latest.current = refresh;
        useEffect(() => {
          let last = 0;
          const run = (fromTimer) => {
            if (document.visibilityState !== "visible") return;
            const now = Date.now();
            if (now - last < 3000) return; // focus + visibilitychange biasanya datang bersamaan
            last = now;
            latest.current(fromTimer === true);
          };
          const onShow = () => run(false);
          document.addEventListener("visibilitychange", onShow);
          window.addEventListener("focus", onShow);
          window.addEventListener("pageshow", onShow);
          window.addEventListener("online", onShow);
          const timer = poll ? setInterval(() => run(true), 30000) : null;
          return () => {
            document.removeEventListener("visibilitychange", onShow);
            window.removeEventListener("focus", onShow);
            window.removeEventListener("pageshow", onShow);
            window.removeEventListener("online", onShow);
            if (timer) clearInterval(timer);
          };
        }, [!!poll]);
      }

      // Frasa "saya mau bayar pendaftaran" adalah trigger BalesOtomatis untuk instruksi pembayaran — jangan diubah tanpa menyesuaikan trigger-nya.
      function payWhatsAppUrl(code, total) {
        const text = "Halo YAKESMA, saya mau bayar pendaftaran.\nKode tiket: " + code + "\nTotal: " + formatRupiah(total);
        return "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent(text);
      }

      /* ---------- QRIS lembaga: QRIS statis → QRIS bernominal ---------- */
      // Standar QRIS (EMVCo): ubah tag 01 "11" (statis) → "12" (dinamis), sisipkan tag 54
      // (nominal) sesuai urutan tag, lalu hitung ulang CRC16-CCITT di tag 63. Dana tetap
      // masuk ke merchant QRIS yang sama — hanya nominalnya yang terisi otomatis di aplikasi.
      function qrisCrc16(str) {
        let crc = 0xffff;
        for (let i = 0; i < str.length; i++) {
          crc ^= str.charCodeAt(i) << 8;
          for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
        }
        return crc.toString(16).toUpperCase().padStart(4, "0");
      }
      function qrisTlv(str) {
        const out = [];
        for (let i = 0; i + 4 <= str.length; ) {
          const len = parseInt(str.slice(i + 2, i + 4), 10);
          if (isNaN(len)) return null;
          out.push([str.slice(i, i + 2), str.slice(i + 4, i + 4 + len)]);
          i += 4 + len;
        }
        return out;
      }
      function qrisValid(payload) {
        return typeof payload === "string" && /^000201/.test(payload) && payload.length > 12 &&
          payload.slice(-8, -4) === "6304" && qrisCrc16(payload.slice(0, -4)) === payload.slice(-4).toUpperCase();
      }
      function qrisInfo(payload) {
        const top = qrisTlv(payload) || [];
        const get = (t) => (top.find((x) => x[0] === t) || [])[1] || "";
        const sub = qrisTlv(get("51")) || [];
        return { merchant: get("59"), city: get("60"), nmid: (sub.find((x) => x[0] === "02") || [])[1] || "" };
      }
      function qrisWithAmount(payload, amount) {
        const fields = (qrisTlv(payload.slice(0, -8)) || []).filter((f) => f[0] !== "54" && f[0] !== "63");
        const amt = String(Math.round(amount));
        const out = fields.map((f) => (f[0] === "01" ? ["01", "12"] : f));
        const at = out.findIndex((f) => f[0] > "54");
        out.splice(at === -1 ? out.length : at, 0, ["54", amt]);
        const body = out.map((f) => f[0] + String(f[1].length).padStart(2, "0") + f[1]).join("") + "6304";
        return body + qrisCrc16(body);
      }
      const hasQris = () => SITE.qrisEnabled !== false && qrisValid(SITE.qris);
      /**
       * QRIS hanya ditampilkan untuk pesanan yang SERVER beri kode unik. Keputusan ada di server, bukan di
       * salinan pengaturan di browser — tab yang terbuka sejak sebelum QRIS dinonaktifkan masih menyimpan
       * QRIS lama dan akan menampilkan QRIS tanpa kode unik (pembayaran jadi sulit dicocokkan).
       */
      const usesQris = (reg) => hasQris() && Number(reg && reg.uniqueCode) > 0;

      const QR_SRC = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
      function loadQrLib() {
        if (window.qrcode) return Promise.resolve(window.qrcode);
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = QR_SRC; s.async = true; s.crossOrigin = "anonymous"; s.integrity = "sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1";
          s.onload = () => (window.qrcode ? resolve(window.qrcode) : reject(new Error("QR tidak termuat")));
          s.onerror = () => reject(new Error("QR gagal dimuat"));
          document.head.appendChild(s);
        });
      }
      /** Gambar QR + nominal + nama merchant ke canvas (juga dipakai untuk "Simpan Gambar"). */
      function drawQrisCanvas(canvas, qr, opts) {
        const n = qr.getModuleCount(), cell = Math.max(4, Math.floor(520 / (n + 8)));
        const qrSize = (n + 8) * cell, W = qrSize + 40, H = qrSize + 150;
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#000000";
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
          if (qr.isDark(r, c)) ctx.fillRect(20 + (c + 4) * cell, 20 + (r + 4) * cell, cell, cell);
        ctx.textAlign = "center";
        ctx.fillStyle = "#185838"; ctx.font = "bold 40px 'Plus Jakarta Sans', Arial, sans-serif";
        ctx.fillText(formatRupiah(opts.amount), W / 2, qrSize + 70);
        ctx.fillStyle = "#4b5563"; ctx.font = "22px 'Plus Jakarta Sans', Arial, sans-serif";
        ctx.fillText(opts.merchant + " · " + opts.code, W / 2, qrSize + 108);
        if (opts.nmid) ctx.fillText("NMID " + opts.nmid, W / 2, qrSize + 138);
      }

      function QrisPayment({ reg, proof, onClaimed }) {
        const canvasRef = useRef(null);
        const [qrError, setQrError] = useState("");
        const [claiming, setClaiming] = useState(false);
        const [claimError, setClaimError] = useState("");
        const claimed = Boolean(reg.paymentClaimedAt);
        const info = qrisInfo(SITE.qris);
        const payload = qrisWithAmount(SITE.qris, reg.total);
        const deadline = reg.createdAt ? new Date(new Date(reg.createdAt).getTime() + 24 * 3600 * 1000) : null;
        const deadlineText = deadline ? new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jakarta" }).format(deadline).replace("Minggu", "Ahad") + " WIB" : "";

        useEffect(() => {
          let alive = true;
          loadQrLib().then((qrcode) => {
            if (!alive || !canvasRef.current) return;
            const qr = qrcode(0, "M"); qr.addData(payload); qr.make();
            drawQrisCanvas(canvasRef.current, qr, { amount: reg.total, merchant: info.merchant || "QRIS", code: reg.code, nmid: info.nmid });
          }).catch(() => alive && setQrError("QRIS gagal dimuat. Periksa koneksi lalu muat ulang halaman."));
          return () => { alive = false; };
        }, [payload]);

        function simpan() {
          if (!canvasRef.current) return;
          const a = document.createElement("a");
          a.href = canvasRef.current.toDataURL("image/png");
          a.download = "QRIS-" + reg.code + ".png";
          document.body.appendChild(a); a.click(); a.remove();
        }

        async function sudahBayar() {
          setClaiming(true); setClaimError("");
          const res = await apiClaimPayment(reg.code, proof);
          setClaiming(false);
          if (!res.ok) { setClaimError(res.error); return; }
          onClaimed && onClaimed(res.data.paymentClaimedAt || new Date().toISOString(), res.data.paymentStatus);
        }

        return (
          <div className="space-y-3">
            <div className="rounded-xl border border-brand-100 bg-white p-4 text-center">
              <p className="text-xs font-bold uppercase tracking-widest text-ink/50">Bayar dengan QRIS</p>
              <p className="mt-1 text-2xl font-extrabold text-brand-dark">{formatRupiah(reg.total)}</p>
              {reg.uniqueCode ? (
                <p className="mt-0.5 text-xs text-ink/60">
                  Termasuk kode unik <span className="font-bold text-brand-dark">{formatRupiah(reg.uniqueCode)}</span> — bayar <b>tepat</b> sesuai nominal ini.
                </p>
              ) : null}
              <div className="mx-auto mt-3 max-w-[260px]">
                {qrError
                  ? <p className="rounded-lg bg-orange/10 p-3 text-xs text-orange">{qrError}</p>
                  : <canvas ref={canvasRef} className="h-auto w-full rounded-lg border border-slate-200" aria-label={"QRIS pembayaran " + reg.code} />}
              </div>
              <p className="mt-2 text-xs text-ink/55">
                Nama penerima di aplikasi: <span className="font-semibold text-brand-dark">{info.merchant}</span>{info.nmid ? " · NMID " + info.nmid : ""}
                <br />QRIS resmi milik LAZNAS YAKESMA
              </p>
              <button type="button" onClick={simpan} disabled={!!qrError}
                className="mt-3 inline-flex items-center justify-center rounded-lg border border-brand-100 px-3 py-2 text-xs font-bold text-brand-dark hover:bg-brand-50 disabled:opacity-50">
                ⬇ Simpan Gambar QRIS
              </button>
              <p className="mx-auto mt-2 max-w-xs text-[11px] leading-relaxed text-ink/50">
                Bayar dari HP ini? Simpan gambar QRIS, lalu buka aplikasi e-wallet/m-banking → Scan/QRIS → pilih gambar dari galeri.
              </p>
            </div>

            {claimed ? (
              <div className="rounded-xl border border-brand-200 bg-brand-50 p-4 text-sm">
                <p className="flex items-center gap-1.5 font-bold text-brand-dark"><IconCheckCircle className="size-4 shrink-0 text-brand" />Terima kasih, pembayaran Anda sedang diverifikasi</p>
                <p className="mt-1 text-ink/70">Tim kami mencocokkan pembayaran dengan mutasi QRIS. Konfirmasi lunas dikirim lewat email. Pesanan tidak akan dibatalkan selama proses verifikasi.</p>
              </div>
            ) : (
              <div>
                <button type="button" onClick={sudahBayar} disabled={claiming}
                  className="flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3.5 text-sm font-bold text-white shadow-sm shadow-brand/30 transition hover:bg-brand-600 disabled:opacity-60">
                  {claiming ? "Menyimpan…" : "Saya sudah bayar"}
                </button>
                {claimError && <p className="mt-1.5 text-xs font-medium text-orange">{claimError}</p>}
              </div>
            )}

            {SITE.whatsapp && (
              <a href={payWhatsAppUrl(reg.code, reg.total)} target="_blank" rel="noopener noreferrer"
                className="flex w-full items-center justify-center gap-2 rounded-xl border border-brand px-4 py-3 text-sm font-bold text-brand transition hover:bg-brand-50">
                <IconWhatsApp className="size-4" />{claimed ? "Kirim bukti bayar via WhatsApp" : "Butuh bantuan? Chat CS"}
              </a>
            )}
            {!claimed && (
              <p className="flex items-start gap-1.5 rounded-lg bg-orange/5 px-3 py-2 text-xs font-semibold text-orange">
                <IconClock className="mt-px size-3.5 shrink-0" />Bayar sebelum {deadlineText || "24 jam setelah mendaftar"}. Pesanan yang belum dibayar dibatalkan otomatis.
              </p>
            )}
          </div>
        );
      }

      function PaymentInfo({ reg, proof, onClaimed }) {
        const code = reg.code, total = reg.total;
        if (usesQris(reg)) return <QrisPayment reg={reg} proof={proof || { email: reg.email }} onClaimed={onClaimed} />;
        // Peserta sudah menekan "Saya sudah bayar" (saat pembayaran QRIS) — jangan suruh membayar lagi.
        if (reg.paymentClaimedAt) {
          return (
            <div className="space-y-3">
              <div className="rounded-xl border border-brand-200 bg-brand-50 p-4 text-sm">
                <p className="flex items-center gap-1.5 font-bold text-brand-dark"><IconCheckCircle className="size-4 shrink-0 text-brand" />Pembayaran Anda sedang diverifikasi</p>
                <p className="mt-1 text-ink/70">
                  Tim kami mencocokkan pembayaran Anda. Status di halaman ini berubah menjadi <b>Lunas</b> setelah dikonfirmasi, dan
                  konfirmasinya juga dikirim lewat email. <b>Tidak perlu membayar lagi.</b>
                </p>
              </div>
              {SITE.whatsapp && (
                <a href={"https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent("Halo YAKESMA, saya sudah membayar. Mohon dicek.\nKode tiket: " + code + "\nTotal: " + formatRupiah(total))}
                  target="_blank" rel="noopener noreferrer"
                  className="flex w-full items-center justify-center gap-2 rounded-xl border border-brand px-4 py-3 text-sm font-bold text-brand transition hover:bg-brand-50">
                  <IconWhatsApp className="size-4" />Kirim bukti bayar via WhatsApp
                </a>
              )}
            </div>
          );
        }
        return (
          <div className="space-y-3">
            {SITE.whatsapp && (
              <a href={payWhatsAppUrl(code, total)} target="_blank" rel="noopener noreferrer"
                className="flex w-full items-center justify-center gap-2 rounded-xl bg-brand px-4 py-3.5 text-sm font-bold text-white shadow-sm shadow-brand/30 transition hover:bg-brand-600">
                <IconWhatsApp className="size-5" />Bayar via WhatsApp
              </a>
            )}
            <div className="rounded-xl border border-dashed border-orange/40 bg-orange/5 p-4 text-sm">
              {SITE.accountNumber ? (
                <React.Fragment>
                  <p className="font-bold text-brand-dark">Instruksi Transfer</p>
                  <p className="mt-1 text-ink/70">
                    Transfer <span className="font-bold text-brand-dark">{formatRupiah(total)}</span> ke:
                  </p>
                  <p className="mt-2 font-bold text-brand-dark">{SITE.bankName}</p>
                  <p className="text-ink/70">
                    {SITE.accountNumber} a.n. {SITE.accountHolder}
                  </p>
                  <p className="mt-2 text-ink/70">
                    Sertakan kode <span className="font-mono font-bold text-brand-dark">{code}</span> pada
                    kolom berita/catatan transfer, lalu kirim bukti transfer lewat tombol WhatsApp di atas.
                  </p>
                </React.Fragment>
              ) : (
                <p className="text-ink/70">
                  Total pembayaran <span className="font-bold text-brand-dark">{formatRupiah(total)}</span>.
                  Klik tombol di atas — CS kami akan mengirimkan nomor rekening/QRIS, lalu kirim bukti
                  transfer di chat yang sama dengan menyertakan kode <span className="font-mono font-bold text-brand-dark">{code}</span>.
                </p>
              )}
              <p className="mt-2 flex items-start gap-1.5 border-t border-orange/20 pt-2 text-xs font-semibold text-orange">
                <IconClock className="mt-px size-3.5 shrink-0" />Selesaikan pembayaran dalam 24 jam setelah mendaftar. Pesanan yang belum dibayar dibatalkan otomatis.
              </p>
            </div>
          </div>
        );
      }

      function Barcode({ seed }) {
        const bars = Array.from({ length: 42 }, (_, i) => {
          const c = seed.charCodeAt(i % seed.length) + i * 7;
          return { w: (c % 3) + 1, dark: c % 4 !== 0 };
        });
        return (
          <div className="mt-3 flex h-9 items-stretch justify-center gap-[2px]">
            {bars.map((b, i) => <span key={i} style={{ width: b.w + "px" }} className={b.dark ? "bg-brand-dark" : "bg-transparent"} />)}
          </div>
        );
      }

      function TicketRow({ label, value, strong }) {
        return (
          <div className="flex items-start justify-between gap-4">
            <dt className="text-ink/55">{label}</dt>
            <dd className={"text-right " + (strong ? "font-extrabold text-brand-dark" : "font-semibold text-brand-dark")}>{value}</dd>
          </div>
        );
      }

      // Frasa "saya peserta terdaftar" adalah trigger BalesOtomatis untuk menu utama CS — jangan diubah tanpa menyesuaikan trigger-nya.
      function csWhatsAppUrl(reg) {
        const text = "Halo YAKESMA, saya peserta terdaftar " + reg.title + ".\nKode tiket: " + reg.code;
        return "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent(text);
      }

      function TicketCard({ reg, free, onCancelled, onClaimed }) {
        const pending = reg.paymentStatus === "pending_transfer";
        const cancelled = reg.paymentStatus === "cancelled";
        return (
          <div className="animate-in overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-sm">
            <div className={(pending || cancelled) ? "bg-gold/10 px-5 py-5 text-center" : "bg-brand-50 px-5 py-5 text-center"}>
              <IconCheckCircle className={(pending || cancelled) ? "mx-auto size-12 text-orange" : "mx-auto size-12 text-brand"} />
              <h3 className="mt-2 text-lg font-extrabold text-brand-dark">
                {cancelled ? "Pesanan Dibatalkan" : free ? "Pendaftaran Berhasil!" : pending ? (usesQris(reg) && !reg.paymentClaimedAt ? "Selesaikan Pembayaran" : "Menunggu Konfirmasi Pembayaran") : "Pesanan Diterima!"}
              </h3>
              <p className="mt-1 text-sm text-ink/60">
                {cancelled ? "Sudah transfer? Hubungi CS kami lewat WhatsApp. Anda juga bisa mendaftar ulang kapan saja." : "Tunjukkan kode ini saat registrasi ulang."}
              </p>
            </div>
            <div className="space-y-4 px-5 py-5">
              <div className="rounded-xl border border-dashed border-brand-200 p-4 text-center">
                <p className="text-xs font-semibold uppercase tracking-widest text-ink/50">Kode Tiket</p>
                <p className="mt-1 font-mono text-2xl font-extrabold tracking-widest text-brand-dark">{reg.code}</p>
                <Barcode seed={reg.code} />
              </div>

              {pending && <PaymentInfo reg={reg} onClaimed={onClaimed} />}
              {pending && onCancelled && !reg.paymentClaimedAt && (
                <CancelOrderButton code={reg.code} email={reg.email} onCancelled={onCancelled} />
              )}

              <dl className="space-y-2 text-sm">
                <TicketRow label="Event" value={reg.title} />
                {reg.packageName && <TicketRow label="Paket" value={reg.packageName} />}
                <TicketRow label="Tanggal" value={formatTanggal(reg.eventDate)} />
                {reg.participationMode && getEvent(reg.slug) && eventFormat(getEvent(reg.slug)) === "hybrid" && (
                  <TicketRow label="Cara Ikut" value={MODE_LABEL[reg.participationMode]} />
                )}
                <TicketRow label="Lokasi" value={reg.location} />
                <TicketRow label="Nama" value={reg.name} />
                <TicketRow label={free ? "Peserta" : "Tiket"} value={String(reg.quantity)} />
                {!free && <TicketRow label="Total" value={formatRupiah(reg.total)} strong />}
              </dl>
              <RacepackInfo reg={reg} />
              {SITE.whatsapp && !pending && (
                <a href={csWhatsAppUrl(reg)} target="_blank" rel="noopener noreferrer" className="flex w-full items-center justify-center gap-2 rounded-xl border border-brand px-4 py-3 text-sm font-bold text-brand transition hover:bg-brand-50">
                  <IconWhatsApp className="size-4" />Hubungi CS via WhatsApp
                </a>
              )}
              <Link to="/event-saya" className="flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600">Lihat di Event Saya</Link>
              <Link to="/event" className="flex w-full items-center justify-center rounded-xl border border-brand-100 px-4 py-3 text-sm font-semibold text-brand-dark transition hover:bg-brand-50">Daftar Event Lain</Link>
            </div>
          </div>
        );
      }

      function emptyShipping() {
        return {
          address: "", provinceId: "", province: "", cityId: "", city: "",
          districtId: "", district: "", subdistrictId: "", subdistrict: "",
          postalCode: "", shirtSizes: [], courier: COURIER,
          // Hasil cek kode pos untuk kelurahan terpilih — hanya dipakai di browser, tidak ikut dikirim.
          postalCheck: null, postalOverride: false,
        };
      }

      function PostalCodeStatus({ shipping, setPostal }) {
        const pc = shipping.postalCheck;
        if (!pc) return null;
        const chip = "rounded-full border px-3 py-1 text-xs font-bold transition";
        if (pc.status === "loading") return <p className="mt-1.5 text-xs text-ink/50">Mencari kode pos untuk kelurahan ini…</p>;
        if (pc.status === "notfound" || pc.status === "error") {
          return <p className="mt-1.5 text-xs text-ink/55">Kode pos untuk kelurahan ini tidak bisa dicek otomatis. Silakan isi manual sesuai alamat Anda.</p>;
        }
        const area = pc.level === "desa" ? "Kel. " + titleCase(shipping.subdistrict) + ", Kec. " + titleCase(shipping.district) : "Kec. " + titleCase(shipping.district);
        const matches = pc.codes.indexOf(shipping.postalCode) !== -1;
        if (matches) {
          return <p className="mt-1.5 flex items-center gap-1 text-xs font-semibold text-brand-700"><IconCheck className="size-3.5" />Kode pos sesuai {area}</p>;
        }
        if (shipping.postalOverride) {
          return (
            <p className="mt-1.5 text-xs text-ink/55">
              Kode pos diisi manual — pastikan sesuai alamat pengiriman.{" "}
              <button type="button" onClick={() => setPostal(pc.codes.length === 1 ? pc.codes[0] : "", false)} className="font-semibold text-brand hover:underline">Pakai kode pos yang disarankan</button>
            </p>
          );
        }
        return (
          <div className={"mt-2 rounded-lg px-3 py-2.5 text-xs " + (shipping.postalCode ? "bg-orange/10" : "bg-white")}>
            <p className={shipping.postalCode ? "font-semibold text-orange" : "font-semibold text-brand-dark"}>
              {shipping.postalCode ? "Kode pos " + shipping.postalCode + " tidak sesuai dengan " + area + "." : "Pilih kode pos untuk " + area + ":"}
            </p>
            <div className="mt-2 flex flex-wrap items-center gap-1.5">
              {pc.codes.map((c) => (
                <button key={c} type="button" onClick={() => setPostal(c, false)} className={chip + " border-brand bg-white text-brand-dark hover:bg-brand-50"}>{c}</button>
              ))}
              <button type="button" onClick={() => setPostal(shipping.postalCode, true)} className="ml-1 font-semibold text-ink/50 underline hover:text-ink">Kode pos saya berbeda</button>
            </div>
          </div>
        );
      }
      function titleCase(s) { return String(s || "").toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase()); }

      /** Satu pilihan ukuran jersey per peserta — dipakai racepack yang dikirim maupun yang diambil di RPC. */
      function ShirtSizeFields({ sizes, onChange, sizeChartImage }) {
        const [showSizeChart, setShowSizeChart] = useState(false);
        const selCls = "w-full rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20";
        return (
          <div>
            <div className="mb-1.5 flex items-center justify-between gap-2">
              <label className="block text-sm font-semibold text-brand-dark">
                {sizes.length > 1 ? "Ukuran Jersey per Peserta" : "Ukuran Jersey"}
              </label>
              {sizeChartImage && (
                <button type="button" onClick={() => setShowSizeChart(true)}
                  className="shrink-0 text-xs font-semibold text-brand hover:underline">
                  Lihat panduan ukuran
                </button>
              )}
            </div>
            <div className="space-y-2">
              {sizes.map((size, i) => (
                <div key={i} className="flex items-center gap-2">
                  {sizes.length > 1 && (
                    <span className="w-20 shrink-0 text-xs font-semibold text-ink/55">Peserta {i + 1}</span>
                  )}
                  <select value={size}
                    onChange={(e) => {
                      const next = sizes.slice();
                      next[i] = e.target.value;
                      onChange(next);
                    }}
                    className={selCls}>
                    <option value="">Pilih ukuran</option>
                    {SHIRT_SIZES.map((sz) => <option key={sz} value={sz}>{sz}</option>)}
                  </select>
                </div>
              ))}
            </div>
            {showSizeChart && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-ink/80 p-4"
                onClick={() => setShowSizeChart(false)}>
                <div className="relative max-h-[90vh] max-w-full" onClick={(e) => e.stopPropagation()}>
                  <button type="button" onClick={() => setShowSizeChart(false)} aria-label="Tutup"
                    className="absolute -top-3 -right-3 grid size-9 place-items-center rounded-full bg-white text-ink shadow-lg">
                    <IconX className="size-4" />
                  </button>
                  <img src={sizeChartImage} alt="Panduan Ukuran Jersey" className="max-h-[90vh] max-w-full rounded-xl object-contain shadow-2xl" />
                </div>
              </div>
            )}
          </div>
        );
      }

      function ShippingFields({ shipping, setShipping, sizeChartImage, shipQuote, needsSizes = true }) {
        const [provinces, setProvinces] = useState([]);
        const [regencies, setRegencies] = useState([]);
        const [districts, setDistricts] = useState([]);
        const [villages, setVillages] = useState([]);
        const [loadingLevel, setLoadingLevel] = useState("province");
        const postalReq = React.useRef(0);
        const POSTAL_RESET = { postalCode: "", postalCheck: null, postalOverride: false };

        useEffect(() => {
          fetchProvinces().then((list) => { setProvinces(list); setLoadingLevel(null); });
        }, []);

        function onProvinceChange(id) {
          const found = provinces.find((p) => p.id === id);
          postalReq.current++;
          setShipping((s) => Object.assign({}, s, POSTAL_RESET, {
            provinceId: id, province: found ? found.name : "",
            cityId: "", city: "", districtId: "", district: "", subdistrictId: "", subdistrict: "",
          }));
          setRegencies([]); setDistricts([]); setVillages([]);
          if (!id) return;
          setLoadingLevel("regency");
          fetchRegencies(id).then((list) => { setRegencies(list); setLoadingLevel(null); });
        }
        function onCityChange(id) {
          const found = regencies.find((r) => r.id === id);
          postalReq.current++;
          setShipping((s) => Object.assign({}, s, POSTAL_RESET, {
            cityId: id, city: found ? found.name : "",
            districtId: "", district: "", subdistrictId: "", subdistrict: "",
          }));
          setDistricts([]); setVillages([]);
          if (!id) return;
          setLoadingLevel("district");
          fetchDistricts(id).then((list) => { setDistricts(list); setLoadingLevel(null); });
        }
        function onDistrictChange(id) {
          const found = districts.find((d) => d.id === id);
          postalReq.current++;
          setShipping((s) => Object.assign({}, s, POSTAL_RESET, {
            districtId: id, district: found ? found.name : "", subdistrictId: "", subdistrict: "",
          }));
          setVillages([]);
          if (!id) return;
          setLoadingLevel("village");
          fetchVillages(id).then((list) => { setVillages(list); setLoadingLevel(null); });
        }
        function onVillageChange(id) {
          const found = villages.find((v) => v.id === id);
          const req = ++postalReq.current;
          setShipping((s) => Object.assign({}, s, POSTAL_RESET, {
            subdistrictId: id, subdistrict: found ? found.name : "",
            postalCheck: found ? { status: "loading" } : null,
          }));
          if (!found) return;
          lookupPostalCodes(found.name, shipping.district, shipping.city)
            .then((r) => {
              if (req !== postalReq.current) return;
              setShipping((s) => Object.assign({}, s, r
                ? { postalCheck: { status: "matched", level: r.level, codes: r.codes }, postalCode: r.codes.length === 1 ? r.codes[0] : "" }
                : { postalCheck: { status: "notfound" } }));
            })
            .catch(() => {
              if (req !== postalReq.current) return;
              setShipping((s) => Object.assign({}, s, { postalCheck: { status: "error" } }));
            });
        }
        function setPostal(code, override) {
          setShipping((s) => Object.assign({}, s, { postalCode: code, postalOverride: !!override }));
        }

        const selCls = "w-full rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20 disabled:bg-ink/5 disabled:text-ink/40";

        return (
        <React.Fragment>
          <div className="space-y-3 rounded-xl border border-brand-100 bg-brand-50/40 p-4">
            <p className="text-sm font-bold text-brand-dark">Info Pengiriman</p>
            <div>
              <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Alamat Lengkap</label>
              <textarea rows={2} value={shipping.address}
                onChange={(e) => setShipping((s) => Object.assign({}, s, { address: e.target.value }))}
                placeholder="Nama jalan, nomor rumah, RT/RW, patokan…" className={selCls} />
            </div>
            <div className="grid grid-cols-1 gap-3">
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Provinsi</label>
                <select value={shipping.provinceId} onChange={(e) => onProvinceChange(e.target.value)}
                  disabled={loadingLevel === "province"} className={selCls}>
                  <option value="">{loadingLevel === "province" ? "Memuat…" : "Pilih provinsi"}</option>
                  {provinces.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kota/Kabupaten</label>
                <select value={shipping.cityId} onChange={(e) => onCityChange(e.target.value)}
                  disabled={!shipping.provinceId || loadingLevel === "regency"} className={selCls}>
                  <option value="">{loadingLevel === "regency" ? "Memuat…" : "Pilih kota/kabupaten"}</option>
                  {regencies.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kecamatan</label>
                <select value={shipping.districtId} onChange={(e) => onDistrictChange(e.target.value)}
                  disabled={!shipping.cityId || loadingLevel === "district"} className={selCls}>
                  <option value="">{loadingLevel === "district" ? "Memuat…" : "Pilih kecamatan"}</option>
                  {districts.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kelurahan/Desa</label>
                <select value={shipping.subdistrictId} onChange={(e) => onVillageChange(e.target.value)}
                  disabled={!shipping.districtId || loadingLevel === "village"} className={selCls}>
                  <option value="">{loadingLevel === "village" ? "Memuat…" : "Pilih kelurahan/desa"}</option>
                  {villages.map((v) => <option key={v.id} value={v.id}>{v.name}</option>)}
                </select>
              </div>
            </div>
            <div className="grid grid-cols-1 gap-3">
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kode Pos</label>
                <input inputMode="numeric" maxLength={5} value={shipping.postalCode}
                  onChange={(e) => setPostal(e.target.value.replace(/\D/g, "").slice(0, 5), shipping.postalOverride)}
                  placeholder={shipping.postalCheck && shipping.postalCheck.status === "loading" ? "Mencari kode pos…" : "Pilih kelurahan dulu"}
                  className={selCls} />
                <PostalCodeStatus shipping={shipping} setPostal={setPostal} />
              </div>
              {needsSizes && (
                <ShirtSizeFields sizes={shipping.shirtSizes} sizeChartImage={sizeChartImage}
                  onChange={(next) => setShipping((s) => Object.assign({}, s, { shirtSizes: next }))} />
              )}
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Kurir</label>
                <div className="flex items-center justify-between rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm">
                  <span className="font-semibold text-brand-dark">POS Indonesia</span>
                  <span className="text-right text-ink/55">
                    {!shipQuote ? "Ongkir dihitung setelah alamat & kode pos lengkap"
                      : shipQuote.status === "loading" ? "Menghitung ongkir…"
                      : shipQuote.status === "error" ? "Ongkir gagal dihitung, periksa kode pos"
                      : <React.Fragment>Ongkir <b className="text-brand-dark">{formatRupiah(shipQuote.fee)}</b><span className="block text-xs">Estimasi {shipQuote.sla} hari</span></React.Fragment>}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </React.Fragment>
        );
      }

      const DONATION_PRESETS = [25000, 50000, 100000, 250000];
      // Judul bawaan untuk event yang belum mengisi "Judul Bagian Donasi" di admin.
      const DEFAULT_DONATION_TITLE = "Donasi Pohon Tambahan (Opsional)";
      // Donasi wajib: pendaftar harus berdonasi minimal `min` per pendaftaran (dicek ulang di server).
      function DonationField({ title, label, amount, setAmount, required, min }) {
        // min = 0 berarti fitur minimal donasi mati.
        const presets = min
          ? [min].concat(DONATION_PRESETS.filter((p) => p > min)).slice(0, 4)
          : DONATION_PRESETS;
        const note = required
          ? (min ? "Wajib, minimal " + formatRupiah(min) + " per pendaftaran" : "Wajib diisi")
          : (min ? "Minimal donasi " + formatRupiah(min) + " bila diisi" : "");
        return (
          <div className="space-y-2.5 rounded-xl border border-brand-100 bg-brand-50/40 p-4">
            <div>
              <p className="text-sm font-bold text-brand-dark">{(title && title.trim()) || (required ? "Donasi" : DEFAULT_DONATION_TITLE)}</p>
              {note && <p className={"mt-0.5 text-xs font-semibold " + (required ? "text-orange" : "text-ink/55")}>{note}</p>}
            </div>
            {label && <p className="text-xs text-ink/60">{label}</p>}
            <div className="flex flex-wrap gap-2">
              {presets.map((p) => (
                <button key={p} type="button"
                  onClick={() => setAmount(amount === p && !required ? 0 : p)}
                  className={"rounded-lg border px-3 py-1.5 text-sm font-semibold transition " + (amount === p ? "border-brand bg-brand text-white" : "border-brand-100 bg-white text-brand-dark hover:bg-brand-50")}>
                  {formatRupiah(p)}
                </button>
              ))}
            </div>
            <div>
              <label className="mb-1 block text-xs font-semibold text-ink/55">Jumlah lain (Rp)</label>
              <input inputMode="numeric" value={amount ? String(amount) : ""}
                onChange={(e) => setAmount(Math.min(10000000, Number(e.target.value.replace(/\D/g, "")) || 0))}
                placeholder={min ? "Minimal " + min : "0"}
                className="w-full rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
              {min > 0 && amount > 0 && amount < min && (
                <p className="mt-1 text-xs font-semibold text-orange">Minimal donasi {formatRupiah(min)}.</p>
              )}
            </div>
          </div>
        );
      }

      /** Event hybrid: peserta memilih ikut offline (datang ke lokasi) atau online (virtual). */
      function ModePicker({ event, value, onChange }) {
        const racepack = eventHasRacepack(event);
        const opts = [
          { id: "offline", icon: IconMapPin, title: "Offline", desc: "Datang ke " + (eventPlace(event) || "lokasi event") + (racepack ? ". Racepack diambil di RPC, tanpa ongkir." : ".") },
          { id: "online", icon: IconGlobe, title: "Online (virtual)", desc: "Lari di mana saja" + (racepack ? ". Racepack dikirim ke alamat Anda (+ ongkir)." : ".") },
        ];
        return (
          <div className="mb-4">
            <p className="mb-2 text-sm font-semibold text-brand-dark">Pilih Cara Ikut</p>
            <div className="grid gap-2" role="radiogroup">
              {opts.map((o) => {
                const on = o.id === value;
                return (
                  <button key={o.id} type="button" role="radio" aria-checked={on} onClick={() => onChange(o.id)}
                    className={"flex w-full items-start gap-3 rounded-xl border px-3.5 py-3 text-left transition " + (on ? "border-brand bg-brand-50 ring-2 ring-brand/20" : "border-brand-100 bg-white hover:border-brand")}>
                    <span className={"mt-0.5 grid size-5 shrink-0 place-items-center rounded-full border-2 " + (on ? "border-brand" : "border-ink/25")}>
                      {on && <span className="size-2.5 rounded-full bg-brand" />}
                    </span>
                    <span className="min-w-0 flex-1">
                      <span className="flex items-center gap-1.5 font-bold text-brand-dark"><o.icon className="size-4 text-brand" />{o.title}</span>
                      <span className="mt-0.5 block text-xs text-ink/65">{o.desc}</span>
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        );
      }

      /** Info Race Pack Collection untuk peserta offline. */
      /** Jadwal RPC: tanggal (bisa sebelum hari lari) + jam; `rpcSchedule` teks bebas untuk data lama. */
      function rpcScheduleText(e) {
        if (!e.rpcDate) return e.rpcSchedule || "";
        return formatTanggalRange(e.rpcDate, e.rpcDateEnd && e.rpcDateEnd !== e.rpcDate ? e.rpcDateEnd : "") + (e.rpcTime ? ", " + e.rpcTime : "");
      }
      function RpcDetails({ event, compact }) {
        const rows = [["Lokasi", event.rpcLocation], ["Alamat", event.rpcAddress], ["Jadwal", rpcScheduleText(event)]].filter((r) => r[1]);
        if (!rows.length) {
          return <p className="text-xs text-ink/60">Lokasi & jadwal pengambilan racepack akan diumumkan panitia lewat WhatsApp/email.</p>;
        }
        return (
          <div className="space-y-1 text-xs text-ink/70">
            {rows.map((r) => <p key={r[0]}><span className="font-semibold text-brand-dark">{r[0]}:</span> {r[1]}</p>)}
            {event.rpcMapsUrl && <a href={event.rpcMapsUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 font-semibold text-brand hover:underline"><IconMapPin className="size-3.5" />Buka di Google Maps</a>}
            {!compact && event.rpcNotes && <p className="whitespace-pre-line">{event.rpcNotes}</p>}
          </div>
        );
      }

      /** Status racepack di tiket: diambil di RPC (peserta offline) atau dikirim (peserta online). */
      function RacepackInfo({ reg }) {
        const event = getEvent(reg.slug);
        if (!reg.racepackMethod || reg.paymentStatus === "cancelled") return null;
        const tgl = (iso) => iso ? new Date(iso).toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
        if (reg.racepackStatus === "picked_up" || reg.racepackStatus === "shipped") {
          return (
            <div className="rounded-xl bg-brand-50 px-3 py-2.5 text-xs text-brand-dark">
              <p className="flex items-center gap-1.5 font-bold"><IconCheckCircle className="size-4 text-brand" />{reg.racepackStatus === "picked_up" ? "Racepack sudah diambil" : "Racepack sudah dikirim"}</p>
              <p className="mt-0.5 text-ink/60">{tgl(reg.racepackAt)}{reg.racepackStatus === "shipped" && reg.racepackNote ? " · Resi " + reg.racepackNote : ""}</p>
            </div>
          );
        }
        if (reg.racepackMethod === "shipping") {
          return <p className="flex items-start gap-1.5 rounded-xl bg-brand-50/60 px-3 py-2.5 text-xs text-ink/65"><IconPackage className="mt-px size-3.5 shrink-0 text-brand" />Racepack dikirim ke alamat Anda via POS Indonesia{reg.paymentStatus === "pending_transfer" ? " setelah pembayaran lunas" : ""}.</p>;
        }
        return (
          <div className="space-y-1.5 rounded-xl border border-brand-100 bg-brand-50/60 px-3 py-2.5">
            <p className="flex items-center gap-1.5 text-xs font-bold text-brand-dark"><IconPackage className="size-3.5 text-brand" />Ambil racepack di RPC (Race Pack Collection)</p>
            {event && <RpcDetails event={event} compact />}
            <p className="text-xs text-ink/60">Tunjukkan kode tiket <b className="font-mono">{reg.code}</b>{reg.paymentStatus === "pending_transfer" ? " — racepack hanya untuk pesanan yang sudah lunas" : ""}.</p>
          </div>
        );
      }

      function RegistrationForm({ event, paketParam }) {
        // Cara ikut: event hybrid → peserta memilih (belum ada pilihan bawaan); selain itu mengikuti format event.
        const format = eventFormat(event);
        const [mode, setMode] = useState(format === "hybrid" ? "" : format);
        // Katalog paket: paket internal (testing) hanya tampil kalau dibuka lewat link ?paket=<kode>.
        // Event hybrid: paket bisa khusus peserta online/offline — tampil setelah cara ikut dipilih.
        const activePkgs = (event.packages || []).filter((p) => p.active);
        const hasPkgs = activePkgs.length > 0;
        const visiblePkgs = activePkgs.filter((p) => (!p.internal || p.id === paketParam) && (format !== "hybrid" || !p.mode || p.mode === mode));
        const [pkgId, setPkgId] = useState(() => {
          const fromLink = visiblePkgs.find((p) => p.id === paketParam);
          return fromLink ? fromLink.id : visiblePkgs.length === 1 ? visiblePkgs[0].id : "";
        });
        // Ganti cara ikut → paket yang tidak berlaku untuk cara ikut baru dilepas.
        useEffect(() => {
          if (!hasPkgs) return;
          setPkgId((cur) => {
            if (visiblePkgs.some((p) => p.id === cur)) return cur;
            const fromLink = visiblePkgs.find((p) => p.id === paketParam);
            return fromLink ? fromLink.id : visiblePkgs.length === 1 ? visiblePkgs[0].id : "";
          });
        }, [mode]);
        const pkg = visiblePkgs.find((p) => p.id === pkgId) || null;
        const unitPrice = hasPkgs ? (pkg ? pkg.price : 0) : event.price;
        const free = hasPkgs ? !!pkg && pkg.price <= 0 : event.price <= 0;
        const [name, setName] = useState("");
        const [email, setEmail] = useState("");
        const [phone, setPhone] = useState("");
        const [qty, setQty] = useState(1);
        const [error, setError] = useState("");
        const [done, setDone] = useState(null);
        const [already, setAlready] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [shipping, setShipping] = useState(emptyShipping);
        const [donation, setDonation] = useState(0);
        const [refCode, setRefCode] = useState(readAffiliateRef);
        const [refCheck, setRefCheck] = useState(null); // null | {status:"loading"|"ok"|"invalid", name}
        useEffect(() => {
          const code = normalizeRefCode(refCode);
          if (!code) { setRefCheck(null); return; }
          let stale = false;
          setRefCheck({ status: "loading" });
          const t = setTimeout(() => {
            apiCheckAffiliate(code, event.slug).then((r) => {
              if (stale) return;
              setRefCheck(r && r.valid ? { status: "ok", name: r.name } : r ? { status: "invalid" } : null);
            });
          }, 400);
          return () => { stale = true; clearTimeout(t); };
        }, [refCode, event.slug]);
        // Racepack: peserta online → dikirim ke alamat (+ongkir); peserta offline → diambil di RPC.
        const hasRacepack = !!mode && (hasPkgs ? !!pkg && (pkg.medal || pkg.jersey) : !!event.requiresShipping);
        const needsShipping = hasRacepack && mode === "online";
        const needsPickup = hasRacepack && mode === "offline";
        const needsSizes = hasRacepack && (hasPkgs ? !!pkg && pkg.jersey : true);
        const donationEnabled = !!event.donationEnabled;
        const donationRequired = donationEnabled && !!event.donationRequired;
        // Data lama (sebelum toggle minimal): donasi wajib selalu punya minimal.
        const donationMinOn = donationEnabled && (event.donationMinEnabled === undefined ? donationRequired : !!event.donationMinEnabled);
        const donationMin = donationMinOn ? Math.max(1, Number(event.donationMin) || 0) : 0;
        const shirtSurchargeTotal = needsSizes
          ? shipping.shirtSizes.reduce((sum, sz) => sum + (SHIRT_SIZE_SURCHARGE[sz] || 0), 0)
          : 0;
        const [shipQuote, setShipQuote] = useState(null); // null | {status:"loading"|"ok"|"error", fee, sla}
        const shippingFeeTotal = needsShipping && shipQuote && shipQuote.status === "ok" ? shipQuote.fee : 0;
        useEffect(() => {
          if (!needsShipping) return;
          const complete = shipping.province && shipping.city && shipping.district && /^\d{5}$/.test(shipping.postalCode);
          if (!complete) { setShipQuote(null); return; }
          let stale = false;
          setShipQuote({ status: "loading" });
          const t = setTimeout(() => {
            apiShippingQuote(shipping).then((q) => {
              if (stale) return;
              setShipQuote(q && q.fee > 0 ? { status: "ok", fee: q.fee, sla: q.sla } : { status: "error" });
            });
          }, 300);
          return () => { stale = true; clearTimeout(t); };
        }, [needsShipping, shipping.province, shipping.city, shipping.district, shipping.postalCode]);
        const grandTotal = unitPrice * qty + shirtSurchargeTotal + shippingFeeTotal + donation;

        useEffect(() => {
          const acc = getAccount();
          if (acc) { setName(acc.name); setEmail(acc.email); setPhone(acc.phone); }
          // Pendaftaran yang sudah dibatalkan tidak menghalangi pendaftaran ulang —
          // constraint unik di server juga hanya berlaku selama belum dibatalkan.
          const existing = getRegistrations().find((r) => r.slug === event.slug && r.paymentStatus !== "cancelled");
          if (!existing) return;
          setAlready(existing);
          // Segarkan status dari server (mis. admin sudah menandai lunas, atau
          // dibatalkan dari perangkat/tab lain) — sebaik mungkin, gagal diam-diam
          // jika offline, cache lama tetap dipakai.
          apiLookupStatus(existing.code, existing.email).then((res) => {
            if (!res.ok || !res.data.paymentStatus) return;
            const patch = serverPatch(existing, res.data);
            if (!patch) return;
            updateRegistrationInCache(existing.id, patch);
            if (res.data.paymentStatus === "cancelled") { setAlready(null); return; }
            setAlready((prev) => (prev ? Object.assign({}, prev, patch) : prev));
          });
        }, [event.slug]);

        // Pesanan yang sedang tampil (baru didaftarkan = done, atau sudah terdaftar = already): perbarui
        // statusnya saat peserta kembali ke halaman ini / berkala selama masih menunggu pembayaran.
        const watched = done || already;
        const watchedGone = useRef(false);
        function refreshWatched() {
          if (!watched || !watched.code || !watched.email || watchedGone.current) return;
          apiLookupStatus(watched.code, watched.email).then((res) => {
            if (!res.ok) { if (res.status === 404) watchedGone.current = true; return; }
            if (!res.data.paymentStatus) return;
            const cur = getRegistrations().find((x) => x.id === watched.id) || watched;
            const patch = serverPatch(cur, res.data);
            if (!patch) return;
            updateRegistrationInCache(watched.id, patch);
            if (done) setDone((d) => (d ? Object.assign({}, d, patch) : d));
            else if (res.data.paymentStatus === "cancelled") setAlready(null);
            else setAlready((prev) => (prev ? Object.assign({}, prev, patch) : prev));
          });
        }
        useLiveRefresh(refreshWatched, !!watched && watched.paymentStatus === "pending_transfer");

        // Satu ukuran jersey per peserta — panjang shirtSizes ikut jumlah tiket,
        // isi yang sudah dipilih dipertahankan saat jumlah berubah.
        useEffect(() => {
          if (!needsSizes) return;
          setShipping((s) => {
            const sizes = s.shirtSizes.slice(0, qty);
            while (sizes.length < qty) sizes.push("");
            return Object.assign({}, s, { shirtSizes: sizes });
          });
        }, [qty, needsSizes]);

        async function handleSubmit(e) {
          e.preventDefault();
          if (!name.trim() || !email.trim() || !phone.trim()) { setError("Mohon lengkapi nama, email, dan nomor WhatsApp."); return; }
          if (!/^\S+@\S+\.\S+$/.test(email)) { setError("Format email belum benar."); return; }
          if (!mode) { setError("Pilih cara ikut: Offline atau Online."); return; }
          if (hasPkgs && !pkg) { setError("Pilih paket terlebih dahulu."); return; }
          if (donationRequired && donation < Math.max(1, donationMin)) { setError(donationMin ? "Donasi wajib diisi, minimal " + formatRupiah(donationMin) + "." : "Donasi wajib diisi."); return; }
          if (!donationRequired && donationMin && donation > 0 && donation < donationMin) { setError("Minimal donasi " + formatRupiah(donationMin) + ". Kosongkan bila tidak ingin berdonasi."); return; }
          if (needsPickup && needsSizes && (shipping.shirtSizes.length !== qty || shipping.shirtSizes.some((sz) => !sz))) {
            setError("Pilih ukuran jersey untuk setiap peserta."); return;
          }
          if (needsShipping) {
            if (!shipping.address.trim()) { setError("Alamat wajib diisi."); return; }
            if (!shipping.province || !shipping.city || !shipping.district || !shipping.subdistrict) {
              setError("Provinsi, kota, kecamatan, dan kelurahan wajib diisi."); return;
            }
            if (!/^\d{5}$/.test(shipping.postalCode)) { setError("Kode pos harus 5 digit angka."); return; }
            const pc = shipping.postalCheck;
            if (pc && pc.status === "loading") { setError("Kode pos sedang dicek, tunggu sebentar."); return; }
            if (pc && pc.status === "matched" && pc.codes.indexOf(shipping.postalCode) === -1 && !shipping.postalOverride) {
              setError("Kode pos tidak sesuai dengan kelurahan yang dipilih. Pilih kode pos yang disarankan."); return;
            }
            if (needsSizes && (shipping.shirtSizes.length !== qty || shipping.shirtSizes.some((sz) => !sz))) {
              setError("Pilih ukuran jersey untuk setiap peserta."); return;
            }
            if (!shipQuote || shipQuote.status !== "ok") {
              setError(shipQuote && shipQuote.status === "loading" ? "Ongkir sedang dihitung, tunggu sebentar." : "Ongkir belum bisa dihitung. Periksa alamat dan kode pos."); return;
            }
          }
          setError("");
          setSubmitting(true);
          // Dibuat SEKALI di sini, dipakai ulang di CAPI (server, lewat
          // payload) dan Pixel (browser, di bawah setelah sukses) supaya
          // Meta deduplikasi keduanya jadi satu konversi.
          const eventId = metaEventId();
          const result = await apiRegister({
            eventSlug: event.slug,
            eventTitle: event.title,
            eventCategory: event.category,
            eventDate: event.date,
            eventLocation: mode === "online" ? "Online" : eventPlace(event),
            participationMode: mode,
            name: name.trim(),
            email: email.trim(),
            phone: phone.trim(),
            quantity: qty,
            unitPrice: unitPrice,
            packageId: pkg ? pkg.id : undefined,
            donationAmount: donation,
            shipping: needsShipping ? {
              address: shipping.address.trim(),
              province: shipping.province,
              city: shipping.city,
              district: shipping.district,
              subdistrict: shipping.subdistrict,
              postalCode: shipping.postalCode,
              shirtSizes: needsSizes ? shipping.shirtSizes : [],
              courier: shipping.courier,
            } : undefined,
            shirtSizes: needsPickup && needsSizes ? shipping.shirtSizes : undefined,
            metaEventId: eventId,
            metaFbp: readCookie("_fbp"),
            metaFbc: readCookie("_fbc"),
            affiliateCode: normalizeRefCode(refCode) || undefined,
          });
          setSubmitting(false);
          if (!result.ok) { setError(result.error); return; }

          if (window.fbq && !(pkg && pkg.internal)) {
            // "InitiateCheckout" untuk berbayar (bukan "Purchase") -- checkout
            // lewat transfer manual/WA, uang belum tentu masuk di titik ini.
            // "Purchase" sungguhan ditembak dari server saat admin/Xendit
            // benar-benar mengonfirmasi pembayaran, bukan dari sini.
            fbq("track", result.data.totalAmount > 0 ? "InitiateCheckout" : "CompleteRegistration", {
              content_ids: [event.slug],
              content_name: event.title,
              content_type: "product",
              value: result.data.totalAmount,
              currency: "IDR",
            }, { eventID: eventId });
          }

          const reg = {
            id: result.data.id, slug: event.slug, title: event.title, category: event.category,
            name: name.trim(), email: email.trim(), phone: phone.trim(),
            quantity: qty, unitPrice: unitPrice, total: result.data.totalAmount,
            packageName: pkg ? pkg.name : "",
            code: result.data.ticketCode, paymentStatus: result.data.paymentStatus,
            paymentUrl: result.data.paymentUrl || null,
            uniqueCode: result.data.uniqueCode || null, paymentClaimedAt: null,
            eventDate: event.date,
            location: result.data.location || (mode === "online" ? "Online" : eventPlace(event)),
            participationMode: result.data.participationMode || mode,
            racepackMethod: result.data.racepackMethod || (needsShipping ? "shipping" : needsPickup ? "pickup" : null),
            racepackStatus: null,
            createdAt: result.data.createdAt || new Date().toISOString(),
          };
          saveRegistration(reg);
          saveAccount({ name: reg.name, email: reg.email, phone: reg.phone });
          setDone(reg);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        if (done) {
          return (
            <TicketCard reg={done} free={free} onCancelled={() => {
              updateRegistrationInCache(done.id, { paymentStatus: "cancelled" });
              setDone((d) => (d ? Object.assign({}, d, { paymentStatus: "cancelled" }) : d));
            }} onClaimed={(at, status) => {
              const patch = { paymentClaimedAt: at, paymentStatus: status || done.paymentStatus };
              updateRegistrationInCache(done.id, patch);
              setDone((d) => (d ? Object.assign({}, d, patch) : d));
            }} />
          );
        }
        if (already)
          return (
            <div className="space-y-3 rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 text-brand-dark">
                  <IconCheckCircle className="size-6 text-brand" />
                  <p className="font-bold">Anda sudah terdaftar</p>
                </div>
                <StatusBadge status={already.paymentStatus} claimed={!!already.paymentClaimedAt} />
              </div>
              <p className="text-sm text-ink/60">
                Kode tiket Anda: <span className="font-mono font-bold text-brand-dark">{already.code}</span>
              </p>
              {already.paymentStatus === "pending_transfer" && (
                <React.Fragment>
                  <PaymentInfo reg={already} onClaimed={(at, status) => {
                    const patch = { paymentClaimedAt: at, paymentStatus: status || already.paymentStatus };
                    updateRegistrationInCache(already.id, patch);
                    setAlready((prev) => (prev ? Object.assign({}, prev, patch) : prev));
                  }} />
                  {!already.paymentClaimedAt && (
                    <CancelOrderButton code={already.code} email={already.email} onCancelled={() => {
                      updateRegistrationInCache(already.id, { paymentStatus: "cancelled" });
                      setAlready(null);
                    }} />
                  )}
                </React.Fragment>
              )}
              <Link to="/event-saya" className="flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600">Lihat di Event Saya</Link>
            </div>
          );

        const todayIso = todayIsoWIB();
        // Pre-launch: pendaftaran sudah dibuka sebelum tanggal "Pendaftaran Dibuka"; tetap ditutup sesuai tanggal tutup.
        const preLaunchActive = !!event.preLaunch && !!event.registrationStart && todayIso < event.registrationStart;
        if (event.registrationStart && todayIso < event.registrationStart && !event.preLaunch) {
          return (
            <div className="space-y-2 rounded-2xl border border-brand-100 bg-white p-5 text-center shadow-sm">
              <IconCalendar className="mx-auto size-8 text-ink/30" />
              <p className="font-bold text-brand-dark">Pendaftaran Belum Dibuka</p>
              <p className="text-sm text-ink/60">Pendaftaran dibuka mulai {formatTanggalPendek(event.registrationStart)}.</p>
            </div>
          );
        }
        if (event.registrationEnd && todayIso > event.registrationEnd) {
          return (
            <div className="space-y-2 rounded-2xl border border-brand-100 bg-white p-5 text-center shadow-sm">
              <IconCalendar className="mx-auto size-8 text-ink/30" />

              <div className="pointer-events-none absolute inset-0" style={{ backgroundImage: "radial-gradient(50% 60% at 85% 10%, rgba(246,183,0,0.35), transparent 60%), radial-gradient(45% 55% at 8% 100%, rgba(255,255,255,0.14), transparent 60%)" }} />

                  <a href={"https://wa.me/" + SITE.whatsapp} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 rounded-full border border-white/40 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-white/10"><IconWhatsApp className="size-4" />Hubungi Kami</a>

            <section>

      function EventList({ kategori }) {
        const initial = CATEGORIES.includes(kategori) ? kategori : undefined;
        return (
          <Container className="space-y-6">
            <header>
              <h1 className="text-2xl font-extrabold text-brand-dark sm:text-3xl">Semua Event</h1>

      function Fact({ icon: Icon, label, value }) {
        return (
          <div className="flex items-center gap-3 rounded-xl border border-brand-50 bg-white px-3.5 py-3">
            <span className="grid size-9 shrink-0 place-items-center rounded-lg bg-brand-50 text-brand"><Icon className="size-5" /></span>
            <div className="min-w-0"><p className="text-xs text-ink/50">{label}</p><p className="truncate text-sm font-bold text-brand-dark">{value}</p></div>
          </div>

      function Section({ title, children }) {
        return <section><h2 className="mb-3 text-lg font-extrabold text-brand-dark">{title}</h2>{children}</section>;
