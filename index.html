          e.preventDefault();
          setError("");
          if (name.trim().length < 2) return setError("Isi nama peserta — nama ini tercetak di sertifikat.");
          if (!runDate) return setError("Pilih tanggal lari.");
          if (!(kmNum >= ev.runMinKm)) return setError("Jarak minimal " + ev.runMinKm + " km dalam satu kali lari.");
          if (secs <= 0) return setError("Isi waktu tempuh sesuai aplikasi lari.");
          if (!paceOk) return setError("Pace " + formatPace(pace) + "/km di luar batas wajar (" + formatPace(RUN_MIN_PACE) + "–" + formatPace(RUN_MAX_PACE) + "/km). Periksa jarak dan waktu tempuh.");
          if (!file) return setError("Unggah screenshot hasil lari dari aplikasi Anda.");
          if (!agree) return setError("Centang pernyataan kebenaran data terlebih dahulu.");
          const fd = new FormData();
          fd.append("ticketCode", creds.ticketCode);
          fd.append("email", creds.email);
          fd.append("participantNo", String(slot));
          fd.append("participantName", name.trim());
          fd.append("appName", app);
          fd.append("runDate", runDate);
          fd.append("distanceKm", String(kmNum));
          fd.append("durationSeconds", String(secs));
          fd.append("file", file);
          setBusy(true);
          const res = await apiRunSubmit(fd);
          setBusy(false);
          if (!res.ok) return setError(res.error);
          onSaved(res.data);
        }

        const timeInput = "w-full rounded-xl border border-brand-100 bg-white px-2 py-2.5 text-center text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20";
        return (
          <form onSubmit={submit} className="space-y-4">
            <div className="rounded-xl border border-gold/40 bg-gold/10 p-3.5 text-sm">
              <p className="font-bold text-brand-dark">Syarat bukti lari</p>
              <ul className="mt-1.5 list-disc space-y-1 pl-5 text-ink/70 marker:text-brand">
                <li>Satu kali lari (single run) minimal <b>{ev.runMinKm} km</b></li>
                <li>Dilakukan pada {formatTanggalRange(ev.date, ev.dateEnd)}</li>
                <li>Screenshot memperlihatkan <b>jarak, waktu tempuh, dan tanggal</b></li>
                <li>Data yang diisi sama dengan screenshot</li>
              </ul>
            </div>

            <Field label={"Nama di sertifikat" + (access.registration.quantity > 1 ? " (peserta " + slot + ")" : "")} value={name} onChange={setName} placeholder="Nama lengkap peserta" maxLength={100} />

            <div>
              <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Aplikasi yang dipakai</label>
              <div className="flex flex-wrap gap-2">
                {RUN_APPS.map((a) => (
                  <button key={a} type="button" onClick={() => setApp(a)}
                    className={"rounded-full border px-3.5 py-1.5 text-sm font-semibold transition " + (app === a ? "border-brand bg-brand text-white" : "border-brand-100 bg-white text-brand-dark hover:border-brand")}>{a}</button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Tanggal lari</label>
                <input type="date" value={runDate} min={win.runDateMin} max={win.runDateMax} onChange={(e) => setRunDate(e.target.value)}
                  className="w-full rounded-xl border border-brand-100 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Jarak (km)</label>
                <input value={km} onChange={(e) => setKm(e.target.value.replace(/[^0-9.,]/g, "").slice(0, 6))} inputMode="decimal" placeholder={"mis. " + String(ev.runMinKm).replace(".", ",") + ",02"}
                  className="w-full rounded-xl border border-brand-100 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
              </div>
            </div>

            <div>
              <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Waktu tempuh</label>
              <div className="grid grid-cols-3 gap-2">
                {[["Jam", hh, setHh], ["Menit", mm, setMm], ["Detik", ss, setSs]].map(([lbl, val, set]) => (
                  <div key={lbl}>
                    <input value={val} onChange={(e) => set(e.target.value.replace(/\D/g, "").slice(0, 2))} inputMode="numeric" placeholder="0" className={timeInput} />
                    <p className="mt-1 text-center text-[11px] text-ink/45">{lbl}</p>
                  </div>
                ))}
              </div>
              {pace > 0 && (
                <p className={"mt-2 inline-flex rounded-full px-3 py-1 text-xs font-bold " + (paceOk ? "bg-brand-50 text-brand-700" : "bg-orange/10 text-orange")}>
                  Pace rata-rata {formatPace(pace)} /km{paceOk ? "" : " — periksa kembali"}
                </p>
              )}
            </div>

            <div>
              <label className="mb-1.5 block text-sm font-semibold text-brand-dark">Screenshot hasil lari</label>
              <label className="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-brand-200 bg-brand-50/40 px-4 py-5 text-center transition hover:border-brand hover:bg-brand-50">
                {preview ? (
                  <img src={preview} alt="Pratinjau screenshot" className="max-h-64 rounded-lg object-contain shadow-sm" />
                ) : (
                  <React.Fragment>
                    <span className="grid size-11 place-items-center rounded-full bg-white text-brand shadow-sm"><IconUpload className="size-5" /></span>
                    <span className="text-sm font-semibold text-brand-dark">{preparing ? "Memproses gambar…" : "Pilih screenshot dari galeri"}</span>
                    <span className="text-xs text-ink/50">JPG/PNG, dari {app === "Lainnya" ? "aplikasi lari Anda" : app}</span>
                  </React.Fragment>
                )}
                <input type="file" accept="image/*" className="hidden" onChange={onFile} disabled={busy || preparing} />
              </label>
              {preview && <p className="mt-1.5 text-center text-xs text-ink/50">Ketuk gambar untuk mengganti</p>}
              {submission && !preview && <p className="mt-1.5 text-xs text-ink/50">Mengubah hasil lari wajib menyertakan screenshot baru.</p>}
            </div>

            <label className="flex items-start gap-2.5 text-sm text-ink/70">
              <input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} className="mt-0.5 size-4 shrink-0 accent-[#28a840]" />
              <span>Saya menyatakan data ini benar dan merupakan hasil lari saya sendiri. Panitia berhak membatalkan hasil yang tidak sesuai.</span>
            </label>

            {error && <p className="rounded-lg bg-orange/10 px-3 py-2 text-sm font-medium text-orange">{error}</p>}

            <div className="flex gap-2">
              <button type="submit" disabled={busy || preparing}
                className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60">
                {busy ? "Mengirim…" : <React.Fragment><IconUpload className="size-5" />Kirim Bukti Lari</React.Fragment>}
              </button>
              {onCancel && (
                <button type="button" onClick={onCancel} disabled={busy} className="rounded-xl border border-brand-100 px-4 py-3 text-sm font-semibold text-ink/60 hover:bg-brand-50">Batal</button>
              )}
            </div>
          </form>
        );
      }

      function ParticipantRun({ slot, submission, access, creds, onUpdated, autoOpen }) {
        const win = access.window;
        const [editing, setEditing] = useState(!submission && win.open && autoOpen);
        const [justSaved, setJustSaved] = useState(false);
        const [certBusy, setCertBusy] = useState("");
        const [certError, setCertError] = useState("");
        const multi = access.registration.quantity > 1;
        const accepted = submission && submission.status === "accepted";
        const rejected = submission && submission.status === "rejected";

        function handleSaved(data) {
          setEditing(false);
          setJustSaved(true);
          onUpdated(data);
        }
        async function cert(format) {
          setCertBusy(format); setCertError("");
          try {
            await downloadCertificate({
              name: submission.participantName,
              eventTitle: access.event.title,
              periodText: "Lari Virtual · " + formatTanggalRange(access.event.date, access.event.dateEnd),
              distanceKm: submission.distanceKm,
              durationSeconds: submission.durationSeconds,
              paceSeconds: submission.paceSeconds,
              runDate: submission.runDate,
              certificateNo: submission.certificateNo,
              template: (getEvent(access.event.slug) || {}).certificateTemplate || "",
              layout: (getEvent(access.event.slug) || {}).certificateLayout || null,
            }, format);
          } catch (e) {
            setCertError("Gagal membuat sertifikat. Coba lagi atau gunakan browser lain.");
          }
          setCertBusy("");
        }

        return (
          <section className="animate-in overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-sm">
            <div className="flex items-center justify-between gap-3 border-b border-brand-50 px-5 py-3.5">
              <div className="min-w-0">
                {multi && <p className="text-[11px] font-bold uppercase tracking-wide text-ink/45">Peserta {slot}</p>}
                <p className="truncate font-extrabold text-brand-dark">{submission ? submission.participantName : multi ? "Belum ada hasil" : access.registration.name}</p>
              </div>
              {accepted ? <span className="shrink-0 rounded-full bg-brand px-2.5 py-1 text-[11px] font-bold text-white">Finisher</span>
                : rejected ? <span className="shrink-0 rounded-full bg-orange/15 px-2.5 py-1 text-[11px] font-bold text-orange">Ditolak</span>
                : <span className="shrink-0 rounded-full bg-ink/10 px-2.5 py-1 text-[11px] font-bold text-ink/50">Belum setor</span>}
            </div>

            <div className="space-y-4 p-5">
              {justSaved && accepted && (
                <div className="rounded-xl bg-brand-50 px-4 py-3 text-sm text-brand-dark">
                  <b>Bukti lari tersimpan.</b> Anda berada di peringkat <b>#{submission.rank}</b> dari {access.totalFinishers} finisher.
                </div>
              )}

              {editing ? (
                <RunSubmitForm slot={slot} submission={submission} access={access} creds={creds} onSaved={handleSaved}
                  onCancel={submission ? () => setEditing(false) : null} />
              ) : submission ? (
                <React.Fragment>
                  {accepted && submission.rank && (
                    <div className="flex items-center gap-4 rounded-2xl p-4 text-white" style={{ backgroundImage: `linear-gradient(135deg,${SITE.colors.green},${SITE.colors.dark})` }}>
                      <div className="text-center">
                        <p className="text-[11px] font-bold uppercase tracking-wide text-white/75">Peringkat</p>
                        <p className="text-4xl font-extrabold leading-none">#{submission.rank}</p>
                      </div>
                      <p className="text-sm text-white/85">dari <b className="text-white">{access.totalFinishers}</b> finisher, berdasarkan pace rata-rata tercepat</p>
                    </div>
                  )}
                  <div className="grid grid-cols-3 gap-2">
                    <RunStat label="Jarak" value={formatKm(submission.distanceKm)} />
                    <RunStat label="Waktu" value={formatDurasi(submission.durationSeconds)} />
                    <RunStat label="Pace" value={formatPace(submission.paceSeconds)} />
                  </div>
                  <div className="flex items-center gap-3 text-sm text-ink/60">
                    {submission.proofUrl && (
                      <a href={submission.proofUrl} target="_blank" rel="noopener noreferrer" className="shrink-0">
                        <img src={submission.proofUrl} alt="Bukti lari" className="size-14 rounded-lg border border-brand-100 object-cover" />
                      </a>
                    )}
                    <div className="min-w-0">
                      <p className="flex items-center gap-1.5"><IconCalendar className="size-4 text-brand" />{formatTanggal(submission.runDate)}</p>
                      {submission.appName && <p className="mt-0.5 text-xs text-ink/50">via {submission.appName}</p>}
                    </div>
                  </div>

                  {rejected && (
                    <div className="rounded-xl border border-orange/30 bg-orange/5 p-3.5 text-sm">
                      <p className="font-bold text-orange">Hasil lari ditolak panitia</p>
                      <p className="mt-1 text-ink/70">{submission.rejectReason}</p>
                      <p className="mt-1.5 text-xs text-ink/50">{win.open ? "Silakan setor ulang dengan data dan screenshot yang benar." : "Periode setor sudah berakhir. Hubungi panitia lewat WhatsApp bila ada pertanyaan."}</p>
                    </div>
                  )}

                  {accepted && submission.customCertificateUrl && (
                    <a href={submission.customCertificateUrl} target="_blank" rel="noopener noreferrer"
                      className="flex w-full items-center justify-center gap-2 rounded-xl bg-brand px-3 py-3 text-sm font-bold text-white transition hover:bg-brand-600">
                      <IconDownload className="size-5" />Unduh Sertifikat (PDF)
                    </a>
                  )}
                  {accepted && !submission.customCertificateUrl && (
                    <div>
                      <div className="grid grid-cols-2 gap-2">
                        <button type="button" onClick={() => cert("pdf")} disabled={!!certBusy}
                          className="flex items-center justify-center gap-2 rounded-xl bg-brand px-3 py-3 text-sm font-bold text-white transition hover:bg-brand-600 disabled:opacity-60">
                          <IconDownload className="size-5" />{certBusy === "pdf" ? "Menyiapkan…" : "Sertifikat PDF"}
                        </button>
                        <button type="button" onClick={() => cert("png")} disabled={!!certBusy}
                          className="flex items-center justify-center gap-2 rounded-xl border border-brand px-3 py-3 text-sm font-bold text-brand transition hover:bg-brand-50 disabled:opacity-60">
                          <IconDownload className="size-5" />{certBusy === "png" ? "Menyiapkan…" : "Gambar PNG"}
                        </button>
                      </div>
                      {certError && <p className="mt-2 text-sm text-orange">{certError}</p>}
                    </div>
                  )}

                  {win.open && (
                    <button type="button" onClick={() => { setEditing(true); setJustSaved(false); }}
                      className={rejected
                        ? "flex w-full items-center justify-center gap-2 rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600"
                        : "w-full text-center text-sm font-semibold text-ink/50 hover:text-brand-dark"}>
                      {rejected ? "Setor Ulang Bukti Lari" : "Ubah hasil lari"}
                    </button>
                  )}
                </React.Fragment>
              ) : win.state === "before" ? (
                <p className="text-sm text-ink/60">Setor bukti lari dibuka mulai <b>{formatTanggalPendek(win.opensOn)}</b>.</p>
              ) : win.state === "closed" ? (
                <p className="text-sm text-ink/60">Periode setor bukti lari sudah berakhir pada {formatTanggalPendek(win.closesOn)}.</p>
              ) : (
                <button type="button" onClick={() => setEditing(true)} className="flex w-full items-center justify-center gap-2 rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600">
                  <IconUpload className="size-5" />Setor Bukti Lari
                </button>
              )}
            </div>
          </section>
        );
      }

      function RunLeaderboard({ board, myEntries }) {
        const [showAll, setShowAll] = useState(false);
        if (!board) return <p className="py-6 text-center text-sm text-ink/40">Memuat peringkat…</p>;
        const rows = showAll ? board.entries : board.entries.slice(0, 20);
        const myRanks = new Set(myEntries.map((m) => m.rank));
        const outside = myEntries.filter((m) => m.rank > rows.length);
        // Tiga besar: lingkaran warna emas/perak/perunggu, bukan emoji medali.
        const medal = { 1: "#d4a017", 2: "#9aa5b1", 3: "#b8733d" };
        const Row = ({ r, mine, name }) => (
          <li className={"flex items-center gap-3 px-4 py-3 " + (mine ? "bg-brand-50" : "")}>
            <span className="grid w-9 shrink-0 place-items-center text-center font-extrabold text-brand-dark">{medal[r.rank] ? <span className="grid size-7 place-items-center rounded-full text-xs text-white" style={{ background: medal[r.rank] }}>{r.rank}</span> : "#" + r.rank}</span>
            <div className="min-w-0 flex-1">
              <p className="flex items-center gap-1.5 truncate font-bold text-brand-dark">{name || r.name}{mine && <span className="shrink-0 rounded-full bg-brand px-2 py-0.5 text-[10px] font-bold text-white">Anda</span>}</p>
              <p className="text-xs text-ink/50">{formatKm(r.distanceKm)} · {formatDurasi(r.durationSeconds)}</p>
            </div>
            <span className="shrink-0 text-right">
              <span className="block font-extrabold text-brand-dark">{formatPace(r.paceSeconds)}</span>
              <span className="block text-[10px] text-ink/45">/km</span>
            </span>
          </li>
        );
        return (
          <section className="overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-sm">
            <div className="p-5 pb-3">
              <h2 className="text-lg font-extrabold text-brand-dark">Papan Peringkat</h2>
              <p className="text-sm text-ink/55">Diurutkan berdasarkan pace rata-rata tercepat.</p>
              <div className="mt-3 grid grid-cols-2 gap-2">
                <RunStat label="Finisher" value={board.stats.finishers.toLocaleString("id-ID")} />
                <RunStat label="Total jarak" value={formatKm(board.stats.totalKm)} />
              </div>
            </div>
            {board.entries.length === 0 ? (
              <p className="px-5 pb-5 text-sm text-ink/50">Belum ada peserta yang menyetor bukti lari.</p>
            ) : (
              <React.Fragment>
                <ul className="divide-y divide-brand-50 border-t border-brand-50">
                  {rows.map((r) => <Row key={r.rank} r={r} mine={myRanks.has(r.rank)} />)}
                  {outside.map((m) => <Row key={"me" + m.rank} r={m} mine name={m.name} />)}
                </ul>
                {board.entries.length > 20 && (
                  <button type="button" onClick={() => setShowAll(!showAll)} className="w-full border-t border-brand-50 py-3 text-sm font-semibold text-brand hover:bg-brand-50">
                    {showAll ? "Tampilkan lebih sedikit" : "Lihat " + board.entries.length + " teratas"}
                  </button>
                )}
              </React.Fragment>
            )}
          </section>
        );
      }

      function RunDashboard({ access, creds, onUpdated, onLogout }) {
        const { registration, event } = access;
        const win = access.window;
        const [board, setBoard] = useState(null);
        const [boardKey, setBoardKey] = useState(0);
        useEffect(() => { apiRunLeaderboard(event.slug).then(setBoard); }, [event.slug, boardKey]);

        const bySlot = {};
        access.submissions.forEach((s) => { bySlot[s.participantNo] = s; });
        const slots = Array.from({ length: registration.quantity }, (_, i) => i + 1);
        const firstEmptySlot = slots.find((n) => !bySlot[n]);
        const myEntries = access.submissions.filter((s) => s.status === "accepted" && s.rank).map((s) => ({
          rank: s.rank, name: s.participantName, distanceKm: s.distanceKm, durationSeconds: s.durationSeconds, paceSeconds: s.paceSeconds,
        }));

        function handleUpdated(data) {
          onUpdated(data);
          setBoardKey((k) => k + 1);
        }

        const banner = win.state === "open"
          ? { cls: "bg-brand-50 text-brand-dark", text: "Periode setor dibuka sampai " + formatTanggalPendek(win.closesOn) + ". Hasil bisa diubah selama periode masih berlangsung." }
          : win.state === "before"
            ? { cls: "bg-gold/15 text-brand-dark", text: "Setor bukti lari dibuka mulai " + formatTanggalPendek(win.opensOn) + "." }
            : { cls: "bg-ink/5 text-ink/60", text: "Periode setor berakhir pada " + formatTanggalPendek(win.closesOn) + ". Sertifikat tetap bisa diunduh." };

        return (
          <div className="space-y-4">
            <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <p className="text-[11px] font-bold uppercase tracking-wide text-ink/45">Lari Virtual</p>
                  <h2 className="mt-0.5 text-lg font-extrabold leading-tight text-brand-dark">{event.title}</h2>
                  <p className="mt-1 text-sm text-ink/60">{formatTanggalRange(event.date, event.dateEnd)} · min. {event.runMinKm} km</p>
                  <p className="mt-1 text-xs text-ink/50">Tiket <span className="font-mono font-bold text-brand-dark">{registration.ticketCode}</span> · a.n. {registration.name}</p>
                </div>
                <button type="button" onClick={onLogout} className="shrink-0 text-sm font-semibold text-ink/45 hover:text-orange">Ganti tiket</button>
              </div>
              <p className={"mt-4 rounded-xl px-3.5 py-2.5 text-sm " + banner.cls}>{banner.text}</p>
            </section>

            {slots.map((n) => (
              <ParticipantRun key={n} slot={n} submission={bySlot[n]} access={access} creds={creds} onUpdated={handleUpdated} autoOpen={n === firstEmptySlot} />
            ))}

            {myEntries.length > 0 ? (
              <RunLeaderboard board={board} myEntries={myEntries} />
            ) : (
              <section className="rounded-2xl border border-dashed border-brand-200 bg-white/70 p-6 text-center">
                <span className="mx-auto grid size-12 place-items-center rounded-2xl bg-brand-50 text-brand"><IconMedal className="size-6" /></span>
                <p className="mt-3 font-extrabold text-brand-dark">Papan Peringkat</p>
                <p className="mx-auto mt-1 max-w-xs text-sm text-ink/60">
                  {board && board.stats.finishers > 0
                    ? board.stats.finishers.toLocaleString("id-ID") + " peserta sudah finish. Setor bukti lari Anda untuk melihat posisi Anda di papan peringkat."
                    : "Papan peringkat terbuka setelah Anda menyetor bukti lari."}
                </p>
              </section>
            )}
          </div>
        );
      }

      function SetorLari() {
        const saved = readRunAccess();
        const [access, setAccess] = useState(null);
        const [creds, setCreds] = useState(null);
        const [booting, setBooting] = useState(!!(saved && saved.ticketCode && saved.email));
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");

        async function open(ticketCode, email) {
          const c = { ticketCode: ticketCode.trim().toUpperCase(), email: email.trim().toLowerCase() };
          setLoading(true); setError("");
          const res = await apiRunAccess(c.ticketCode, c.email);
          setLoading(false); setBooting(false);
          if (!res.ok) { setError(res.error); clearRunAccess(); return; }
          saveRunAccess(c);
          setCreds(c);
          setAccess(res.data);
          window.scrollTo(0, 0);
        }
        useEffect(() => {
          if (saved && saved.ticketCode && saved.email) open(saved.ticketCode, saved.email);
        }, []);
        function logout() { clearRunAccess(); setAccess(null); setCreds(null); setError(""); }

        return (
          <Container className="space-y-5">
            <RunHero />
            {booting ? (
              <p className="py-10 text-center text-sm text-ink/40">Memuat…</p>
            ) : access ? (
              <RunDashboard access={access} creds={creds} onUpdated={setAccess} onLogout={logout} />
            ) : (
              <RunAccessForm initialCode={saved ? saved.ticketCode : ""} initialEmail={saved ? saved.email : ""} error={error} loading={loading} onOpen={open} />
            )}
          </Container>
        );
      }

      function NotFound() {
        return (
          <Container className="py-20 text-center">
            <p className="text-6xl font-extrabold tracking-tight text-brand-200">404</p>
            <h1 className="mt-4 text-2xl font-extrabold text-brand-dark">Halaman tidak ditemukan</h1>
            <p className="mx-auto mt-2 max-w-sm text-ink/60">Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan.</p>
            <Link to="/" className="mt-6 inline-flex rounded-full bg-brand px-6 py-3 text-sm font-bold text-white transition hover:bg-brand-600">Kembali ke Beranda</Link>
          </Container>
        );
      }

      /* ============ HALAMAN BAYAR (#/bayar/<kode>?t=<token>) — dibuka dari email & WhatsApp ============ */
      function BayarPage({ code, token }) {
        const local = getRegistrations().find((r) => r.code === code);
        const [email, setEmail] = useState(local ? local.email : "");
        const [proof, setProof] = useState(token ? { token: token } : local ? { email: local.email } : null);
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(!!proof);
        const [error, setError] = useState("");

        useEffect(() => {
          if (!proof) return;
          let alive = true;
          setLoading(true); setError("");
          const req = proof.token ? apiLookupByToken(code, proof.token) : apiLookupStatus(code, proof.email);
          req.then((res) => {
            if (!alive) return;
            setLoading(false);
            if (!res.ok) { setData(null); setError(res.error || "Pendaftaran tidak ditemukan. Periksa kode tiket dan email Anda."); return; }
            setData(res.data);
            if (local) {
              const patch = serverPatch(local, res.data);
              if (patch) updateRegistrationInCache(local.id, patch);
            }
          });
          return () => { alive = false; };
        }, [code, proof && (proof.token || proof.email)]);

        // Muat ulang status saat peserta kembali ke halaman ini / berkala selama masih menunggu pembayaran.
        const gone = useRef(false);
        function refreshBayar() {
          if (!proof || gone.current) return;
          const req = proof.token ? apiLookupByToken(code, proof.token) : apiLookupStatus(code, proof.email);
          req.then((res) => {
            if (!res.ok) { if (res.status === 404) gone.current = true; return; }
            setData(res.data);
            if (local) {
              const cur = getRegistrations().find((x) => x.id === local.id) || local;
              const patch = serverPatch(cur, res.data);
              if (patch) updateRegistrationInCache(local.id, patch);
            }
          });
        }
        useLiveRefresh(refreshBayar, !!data && data.paymentStatus === "pending_transfer");

        function cariDenganEmail(e) {
          e.preventDefault();
          const v = email.trim().toLowerCase();
          if (!v) { setError("Masukkan email yang dipakai saat mendaftar."); return; }
          setProof({ email: v });
        }

        const reg = data ? {
          code: data.ticketCode || code, total: data.totalAmount, email: proof && proof.email,
          createdAt: data.createdAt, uniqueCode: data.uniqueCode, paymentClaimedAt: data.paymentClaimedAt,
        } : null;

        return (
          <Container>
           <div className="mx-auto max-w-xl space-y-5">
            <header>
              <h1 className="text-2xl font-extrabold text-brand-dark sm:text-3xl">Pembayaran</h1>
              <p className="mt-1 text-sm text-ink/60">Kode tiket <span className="font-mono font-bold text-brand-dark">{code}</span></p>
            </header>

            {!proof && (
              <form onSubmit={cariDenganEmail} className="space-y-3 rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
                <p className="text-sm text-ink/70">Masukkan email yang Anda pakai saat mendaftar untuk menampilkan pembayaran.</p>
                <Field label="Email" type="email" value={email} onChange={setEmail} placeholder="nama@email.com" />
                {error && <p className="text-xs font-medium text-orange">{error}</p>}
                <button type="submit" className="w-full rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white hover:bg-brand-600">Tampilkan Pembayaran</button>
              </form>
            )}

            {proof && loading && <p className="text-sm text-ink/60">Memuat data pembayaran…</p>}

            {proof && !loading && error && (
              <div className="space-y-3 rounded-2xl border border-orange/30 bg-orange/5 p-5 text-sm">
                <p className="font-semibold text-brand-dark">{error}</p>
                <button type="button" onClick={() => { setProof(null); setError(""); }} className="font-semibold text-brand hover:underline">Coba dengan email</button>
              </div>
            )}

            {data && !loading && (
              <div className="space-y-4 rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <h2 className="font-bold text-brand-dark">{data.eventTitle}</h2>
                    {data.packageName && <p className="text-xs font-semibold text-brand-700">{data.packageName}</p>}
                    {data.name && <p className="mt-0.5 text-xs text-ink/55">a.n. {data.name} · {data.quantity} peserta</p>}
                  </div>
                  <StatusBadge status={data.paymentStatus} claimed={!!data.paymentClaimedAt} />
                </div>

                {data.paymentStatus === "pending_transfer" && (
                  <PaymentInfo reg={reg} proof={proof} onClaimed={(at, status) => {
                    setData((d) => Object.assign({}, d, { paymentClaimedAt: at, paymentStatus: status || d.paymentStatus }));
                    if (local) updateRegistrationInCache(local.id, { paymentClaimedAt: at, paymentStatus: status || local.paymentStatus });
                  }} />
                )}
                {(data.paymentStatus === "paid" || data.paymentStatus === "free") && (
                  <div className="rounded-xl border border-brand-200 bg-brand-50 p-4 text-sm">
                    <p className="flex items-center gap-1.5 font-bold text-brand-dark"><IconCheckCircle className="size-4 shrink-0 text-brand" />{data.paymentStatus === "paid" ? "Pembayaran sudah dikonfirmasi" : "Pendaftaran gratis — tidak perlu membayar"}</p>
                    <p className="mt-1 text-ink/70">Anda resmi terdaftar. Jazakallahu khairan!</p>
                  </div>
                )}
                {data.paymentStatus === "cancelled" && (
                  <div className="rounded-xl border border-orange/30 bg-orange/5 p-4 text-sm">
                    <p className="font-bold text-brand-dark">Pesanan ini sudah dibatalkan</p>
                    <p className="mt-1 text-ink/70">
                      {data.cancelReason === "expired" ? "Dibatalkan otomatis karena belum dibayar dalam 24 jam. " : ""}
                      Sudah membayar?{" "}
                      <a href={"https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent("Halo YAKESMA, pesanan saya dibatalkan padahal sudah bayar.\nKode tiket: " + code)}
                        target="_blank" rel="noopener noreferrer" className="font-semibold text-brand hover:underline">Hubungi CS</a>. Anda juga bisa mendaftar ulang.
                    </p>
                  </div>
                )}
                <Link to="/event-saya" className="flex w-full items-center justify-center rounded-xl border border-brand-100 px-4 py-3 text-sm font-semibold text-brand-dark transition hover:bg-brand-50">Event Saya</Link>
              </div>
            )}
           </div>
          </Container>
        );
      }

      /* ============ MENU DASHBOARD AFFILIATE (#/affiliate) — pemilik kode masuk sendiri lewat link di email ============ */
      function AffiliateHome() {
        const [saved, setSaved] = useState(getSavedAffiliateDashboards);
        const [email, setEmail] = useState(() => (getAccount() || {}).email || "");
        const [state, setState] = useState("idle"); // idle | sending | sent
        const [error, setError] = useState("");

        async function submit(e) {
          e.preventDefault();
          const v = email.trim();
          if (!/^\S+@\S+\.\S+$/.test(v)) { setError("Format email belum benar."); return; }
          setError(""); setState("sending");
          const res = await apiAffiliateAccess(v);
          if (!res.ok) { setState("idle"); setError(res.error); return; }
          setState("sent");
        }

        return (
          <Container>
           <div className="mx-auto max-w-xl space-y-5">
            <header>
              <h1 className="text-2xl font-extrabold text-brand-dark sm:text-3xl">Dashboard Affiliate</h1>
              <p className="mt-1 text-sm text-ink/60">Untuk komunitas & mitra yang punya kode affiliate dari panitia: pantau pendaftar, status pembayaran, dan perkiraan komisi Anda.</p>
            </header>

            {saved.length > 0 && (
              <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
                <h2 className="font-bold text-brand-dark">Dashboard di perangkat ini</h2>
                <ul className="mt-2 divide-y divide-brand-50">
                  {saved.map((d) => (
                    <li key={d.code} className="flex items-center justify-between gap-3 py-2.5">
                      <div className="min-w-0">
                        <p className="truncate text-sm font-semibold text-ink/85">{d.name || "Affiliate"}</p>
                        <p className="font-mono text-xs font-bold text-brand-dark">{d.code}</p>
                      </div>
                      <div className="flex shrink-0 items-center gap-3">
                        <button type="button" onClick={() => { forgetAffiliateDashboard(d.code); setSaved(getSavedAffiliateDashboards()); }}
                          className="text-xs font-semibold text-ink/40 hover:text-orange">Lupakan</button>
                        <Link to={"/affiliate/" + d.code + "?t=" + encodeURIComponent(d.t)}
                          className="inline-flex items-center gap-1 rounded-xl bg-brand px-3.5 py-2 text-sm font-bold text-white hover:bg-brand-600">
                          Buka<IconChevronRight className="size-4" />
                        </Link>
                      </div>
                    </li>
                  ))}
                </ul>
              </section>
            )}

            <section className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
              <h2 className="font-bold text-brand-dark">{saved.length ? "Masuk dengan kode lain" : "Masuk ke dashboard"}</h2>
              {state === "sent" ? (
                <div className="mt-3 space-y-2 rounded-xl bg-brand-50 p-4 text-sm text-ink/75">
                  <p className="flex items-center gap-1.5 font-bold text-brand-dark"><IconCheckCircle className="size-4 text-brand" />Cek email Anda</p>
                  <p>Jika <b>{email.trim()}</b> terdaftar sebagai email affiliate, link dashboard sudah kami kirim ke sana. Biasanya tiba dalam 1–2 menit; cek juga folder Spam/Promosi.</p>
                  <button type="button" onClick={() => setState("idle")} className="text-sm font-semibold text-brand hover:underline">Pakai email lain</button>
                </div>
              ) : (
                <form onSubmit={submit} className="mt-3 space-y-3">
                  <Field label="Email affiliate" type="email" value={email} onChange={setEmail} placeholder="nama@email.com" />
                  {error && <p className="rounded-lg bg-orange/10 px-3 py-2 text-sm font-medium text-orange">{error}</p>}
                  <button type="submit" disabled={state === "sending"}
                    className="flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white transition hover:bg-brand-600 disabled:opacity-60">
                    {state === "sending" ? "Mengirim…" : "Kirim link ke email saya"}
                  </button>
                  <p className="text-xs text-ink/50">Gunakan email yang Anda berikan ke panitia saat kode affiliate dibuat. Belum punya kode atau email belum terdaftar? Hubungi panitia.</p>
                </form>
              )}
            </section>
           </div>
          </Container>
        );
      }

      /* ============ HALAMAN AFFILIATE (#/affiliate/<kode>?t=<token>) — link pribadi dari panitia ============ */
      const AFF_STATUS = { paid: "Lunas", free: "Terdaftar (gratis)", pending_transfer: "Menunggu bayar", cancelled: "Batal" };
      /**
       * Perolehan mitra di bawah affiliate ini (affiliate berjenjang, maks. 4 tingkat). Hanya jumlah peserta —
       * imbalan mitra tidak ditampilkan karena imbalan hanya dihitung dari pendaftar langsung masing-masing.
       */
      function AffiliateNetwork({ net, own }) {
        const total = net.total;
        const all = {
          participants: own.participants + total.participants,
          confirmed: own.confirmedParticipants + total.confirmedParticipants,
          pending: own.pendingParticipants + total.pendingParticipants,
        };
        const direct = net.members.filter((m) => m.depth === 1).length;
        return (
          <div className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
            <h2 className="font-bold text-brand-dark">Jaringan mitra</h2>
            <p className="mt-0.5 text-xs text-ink/55">{direct} mitra langsung{net.members.length > direct ? ", " + net.members.length + " affiliate di seluruh jaringan" : ""}. Angka di atas hanya pendaftar lewat kode Anda sendiri.</p>
            <div className="mt-3 grid grid-cols-3 gap-2 rounded-xl bg-brand-50/60 p-3 text-center">
              <div><p className="text-xl font-extrabold text-brand-dark">{all.participants}</p><p className="text-[11px] text-ink/55">peserta jaringan</p></div>
              <div><p className="text-xl font-extrabold text-brand">{all.confirmed}</p><p className="text-[11px] text-ink/55">lunas</p></div>
              <div><p className="text-xl font-extrabold text-orange">{all.pending}</p><p className="text-[11px] text-ink/55">menunggu bayar</p></div>
            </div>
            <p className="mt-1.5 text-[11px] text-ink/45">Total jaringan = pendaftar langsung Anda + seluruh mitra di bawah Anda.</p>
            <ul className="mt-3 divide-y divide-brand-50">
              <li className="flex items-center justify-between gap-3 pb-1.5 text-[11px] font-semibold uppercase tracking-wide text-ink/40">
                <span>Mitra</span><span>Lunas · Menunggu</span>
              </li>
              {net.members.map((m) => (
                <li key={m.code} className="flex items-center justify-between gap-3 py-2" style={{ paddingLeft: (m.depth - 1) * 16 }}>
                  <div className="min-w-0">
                    <p className="truncate text-sm font-semibold text-ink/85">
                      {m.depth > 1 && <span className="mr-1 text-ink/30" aria-hidden="true">└</span>}{m.name}
                      {!m.active && <span className="ml-1.5 rounded-full bg-ink/10 px-1.5 py-0.5 text-[10px] font-semibold text-ink/50">nonaktif</span>}
                    </p>
                    <p className="text-xs text-ink/45">
                      <span className="font-mono">{m.code}</span>
                      {m.totalStats.participants !== m.stats.participants ? " · " + m.stats.participants + " langsung, " + (m.totalStats.participants - m.stats.participants) + " dari mitranya" : ""}
                    </p>
                  </div>
                  <p className="shrink-0 text-sm font-bold text-brand-dark">
                    {m.totalStats.confirmedParticipants}<span className="font-normal text-ink/40"> · {m.totalStats.pendingParticipants}</span>
                  </p>
                </li>
              ))}
            </ul>
          </div>
        );
      }

      function AffiliatePage({ code, token }) {
        const [data, setData] = useState(null);
        const [error, setError] = useState("");
        const [copied, setCopied] = useState("");
        const [tab, setTab] = useState("direct");

        function load() {
          apiAffiliateStats(code, token).then((res) => {
            if (!res.ok) {
              setError(res.error);
              // Link lama (sudah di-reset panitia) tidak disimpan lagi sebagai pintasan di perangkat ini.
              if (/tidak valid/i.test(res.error || "")) forgetAffiliateDashboard(code);
              return;
            }
            setError(""); setData(res.data);
            saveAffiliateDashboard(code, token, res.data.name);
          });
        }
        useEffect(() => { load(); }, [code, token]);
        useLiveRefresh(load, false);

        async function share(link) {
          const text = "Yuk ikut " + link.title + "! Daftar lewat link ini:";
          if (navigator.share) {
            try { await navigator.share({ title: link.title, text: text, url: link.url }); } catch (e) {}
            return;
          }
          try {
            await navigator.clipboard.writeText(link.url);
            setCopied(link.eventSlug);
            setTimeout(() => setCopied(""), 2000);
          } catch (e) {
            try { window.prompt("Salin link ini:", link.url); } catch (e2) {}
          }
        }

        const st = data && data.stats;
        const net = data && data.network;
        const list = net && tab === "network" ? net : data;
        return (
          <Container>
           <div className="mx-auto max-w-xl space-y-5">
            <header>
              <h1 className="text-2xl font-extrabold text-brand-dark sm:text-3xl">{data ? data.name : "Affiliate"}</h1>
              <p className="mt-1 text-sm text-ink/60">Kode affiliate <span className="font-mono font-bold text-brand-dark">{code}</span></p>
            </header>

            {!data && !error && <p className="text-sm text-ink/60">Memuat data…</p>}
            {error && (
              <div className="space-y-3 rounded-2xl border border-orange/30 bg-orange/5 p-5 text-sm font-semibold text-brand-dark">
                <p>{error}</p>
                <Link to="/affiliate" className="inline-flex rounded-xl bg-brand px-4 py-2.5 text-sm font-bold text-white hover:bg-brand-600">Minta link baru lewat email</Link>
              </div>
            )}

            {data && (
              <React.Fragment>
                {!data.active && (
                  <p className="rounded-xl bg-ink/5 px-3 py-2 text-xs font-semibold text-ink/60">Kode ini sedang nonaktif — pendaftar baru tidak lagi tercatat atas nama Anda.</p>
                )}
                <div className="grid grid-cols-2 gap-3">
                  <div className="rounded-2xl border border-brand-100 bg-white p-4 shadow-sm">
                    <p className="text-xs font-semibold text-ink/50">Peserta terdaftar</p>
                    <p className="mt-1 text-2xl font-extrabold text-brand-dark">{st.participants}</p>
                    <p className="text-[11px] text-ink/45">{st.registrations} pesanan aktif</p>
                  </div>
                  <div className="rounded-2xl border border-brand-100 bg-white p-4 shadow-sm">
                    <p className="text-xs font-semibold text-ink/50">Peserta lunas</p>
                    <p className="mt-1 text-2xl font-extrabold text-brand">{st.confirmedParticipants}</p>
                    <p className="text-[11px] text-ink/45">{st.pendingParticipants} menunggu bayar</p>
                  </div>
                  {data.commissionType === "fixed" && (
                    <div className="col-span-2 rounded-2xl border border-brand-200 bg-brand-50 p-4">
                      <p className="text-xs font-semibold text-ink/55">Perkiraan komisi</p>
                      <p className="mt-1 text-2xl font-extrabold text-brand-dark">{formatRupiah(st.commission)}</p>
                      <p className="text-[11px] text-ink/55">{formatRupiah(data.commissionAmount)} × {st.paidParticipants} peserta lunas. Pembayaran komisi dilakukan oleh panitia.</p>
                    </div>
                  )}
                </div>

                {net && <AffiliateNetwork net={net} own={st} />}

                {data.links.length > 0 && (
                  <div className="space-y-2 rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
                    <h2 className="font-bold text-brand-dark">Link untuk dibagikan</h2>
                    <p className="text-xs text-ink/55">Pendaftar yang membuka link ini otomatis tercatat atas kode Anda (berlaku 30 hari di perangkatnya). Mereka juga bisa mengetik kode <span className="font-mono font-bold">{data.code}</span> di form pendaftaran.</p>
                    {data.links.map((l) => (
                      <div key={l.eventSlug} className="flex items-center justify-between gap-3 border-t border-brand-50 pt-2">
                        <p className="min-w-0 truncate text-sm font-semibold text-ink/80">{l.title}</p>
                        <button type="button" onClick={() => share(l)}
                          className="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-brand-100 px-3 py-1.5 text-xs font-semibold text-brand-dark hover:border-brand hover:bg-brand-50">
                          {copied === l.eventSlug ? <IconCheck className="size-4 text-brand" strokeWidth={2.6} /> : <IconShare className="size-4" />}
                          {copied === l.eventSlug ? "Tersalin!" : "Bagikan"}
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                <div className="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <h2 className="font-bold text-brand-dark">Pendaftar <span className="text-ink/40">({list.totalItems})</span></h2>
                    {net && (
                      <div className="inline-flex rounded-full border border-brand-100 p-0.5 text-xs font-semibold" role="tablist">
                        {[["direct", "Langsung"], ["network", "Dari mitra"]].map(([id, label]) => (
                          <button key={id} type="button" role="tab" aria-selected={tab === id} onClick={() => setTab(id)}
                            className={"rounded-full px-3 py-1 transition " + (tab === id ? "bg-brand text-white" : "text-ink/60 hover:text-brand-dark")}>{label}</button>
                        ))}
                      </div>
                    )}
                  </div>
                  {list.items.length === 0 ? (
                    <p className="mt-2 text-sm text-ink/55">{list === data ? "Belum ada pendaftar lewat kode Anda." : "Belum ada pendaftar lewat mitra Anda."}</p>
                  ) : (
                    <ul className="mt-2 divide-y divide-brand-50">
                      {list.items.map((it, i) => (
                        <li key={i} className="flex items-start justify-between gap-3 py-2">
                          <div className="min-w-0">
                            <p className="text-sm font-semibold text-ink/85">{it.name} <span className="font-normal text-ink/45">· {it.quantity} peserta</span></p>
                            {it.via && <p className="truncate text-xs font-semibold text-brand-700">via {it.via}</p>}
                            <p className="truncate text-xs text-ink/50">{it.eventTitle}{it.packageName ? " – " + it.packageName : ""} · {new Date(it.createdAt).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Jakarta" })}</p>
                          </div>
                          <span className={"shrink-0 rounded-full px-2.5 py-1 text-[11px] font-bold " + (it.paymentStatus === "paid" || it.paymentStatus === "free" ? "bg-brand text-white" : it.paymentStatus === "cancelled" ? "bg-ink/10 text-ink/50" : "bg-gold/20 text-orange")}>
                            {AFF_STATUS[it.paymentStatus] || it.paymentStatus}
                          </span>
                        </li>
                      ))}
                    </ul>
                  )}
                  {list.totalItems > list.items.length && <p className="mt-2 text-xs text-ink/45">Menampilkan {list.items.length} pendaftar terbaru.</p>}
                </div>
                <p className="text-center text-xs text-ink/40">Dashboard ini tersimpan di perangkat Anda (menu Akun → Dashboard Affiliate). Jangan bagikan link-nya ke orang lain.</p>
              </React.Fragment>
            )}
           </div>
          </Container>
        );
      }

      /* ============================ APP ============================ */
      const TITLES = { "/": null, "/event": "Event", "/event-saya": "Event Saya", "/akun": "Akun" };
      function App() {
        const route = useRoute();
        const seg = route.path.split("/").filter(Boolean);
        let page, title;
        if (route.path === "/") { page = <Home />; title = null; }
        else if (route.path === "/event") { page = <EventList kategori={route.params.get("kategori")} />; title = "Event"; }
        else if (seg[0] === "event" && seg[1]) { const ev = getEvent(seg[1]); page = <EventDetail slug={seg[1]} paket={route.params.get("paket")} />; title = ev ? ev.title : "Event tidak ditemukan"; }
        else if (route.path === "/event-saya") { page = <EventSaya />; title = "Event Saya"; }
        else if (route.path === "/akun") { page = <Akun />; title = "Akun"; }
        else if (route.path === "/setor-lari") { page = <SetorLari />; title = "Setor Lari"; }
        else if (route.path === "/reset-password") { page = <ResetPassword u={route.params.get("u")} x={route.params.get("x")} t={route.params.get("t")} />; title = "Buat password baru"; }
        else if (route.path === "/affiliate") { page = <AffiliateHome />; title = "Dashboard Affiliate"; }
        else if (seg[0] === "affiliate" && seg[1]) { page = <AffiliatePage code={normalizeRefCode(decodeURIComponent(seg[1]))} token={route.params.get("t")} />; title = "Affiliate"; }
        else if (seg[0] === "bayar" && seg[1]) { page = <BayarPage code={decodeURIComponent(seg[1]).toUpperCase()} token={route.params.get("t")} />; title = "Pembayaran"; }
        else { page = <NotFound />; title = "Halaman tidak ditemukan"; }

        useEffect(() => {
          document.title = title ? title + " · " + SITE.name : SITE.name + " — " + SITE.tagline;
        }, [title]);

        return (
          <div className="app-bg flex min-h-screen flex-col font-sans text-ink">
            <AppHeader />
            <main className="flex-1 pb-24 pt-6 sm:pt-8">{page}</main>
            <BottomNav path={route.path} />
          </div>
        );
      }

      /* Terapkan warna brand dari data ke Tailwind (Play CDN) sebelum render */
      /* ============================ META PIXEL / CAPI ============================
         Dua sinyal terpisah untuk satu konversi: Pixel (browser, di sini) dan
         CAPI (server, lib/metaCapi.ts di yakesma-api) — keduanya dikirim
         dengan event_id yang SAMA supaya Meta deduplikasi jadi satu, bukan
         dihitung dobel. Sengaja BUKAN pakai "one-click setup" Meta (April
         2026) -- itu cuma menduplikasi event Pixel di infrastruktur Meta
         sendiri, bukan sinyal server yang independen. */
      function metaEventId() {
        try { return crypto.randomUUID(); } catch (e) { return "ev_" + Date.now() + "_" + Math.random().toString(36).slice(2); }
      }
      function readCookie(name) {
        const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
        return m ? decodeURIComponent(m[1]) : "";
      }
      /** Situs memakai hash routing, jadi fbclid dari klik iklan bisa tersisip SETELAH "#"
       * (…/#/event/x?fbclid=…) — di situ Pixel tidak membacanya dan cookie _fbc tak terbentuk.
       * Bentuk sendiri dengan format resmi Meta: fb.1.<waktu ms>.<fbclid>. */
      function captureFbclidFromHash() {
        try {
          if (/[?&]fbclid=/.test(location.search)) return;
          const m = location.hash.match(/[?&]fbclid=([^&#]+)/);
          if (!m) return;
          const fbclid = decodeURIComponent(m[1]);
          if (readCookie("_fbc").endsWith("." + fbclid)) return;
          const value = "fb.1." + Date.now() + "." + fbclid;
          const base = "_fbc=" + encodeURIComponent(value) + "; path=/; max-age=" + 90 * 24 * 3600 + "; SameSite=Lax";
          const parts = location.hostname.split(".");
          if (parts.length > 2) document.cookie = base + "; domain=." + parts.slice(-2).join(".");
          if (readCookie("_fbc") !== value) document.cookie = base;
        } catch (e) {}
      }

      let _pixelReady = false;
      function initMetaPixel(pixelId) {
        captureFbclidFromHash();
        if (!pixelId || _pixelReady) return;
        _pixelReady = true;
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', pixelId);
        fbq('track', 'PageView');
        // SPA hash routing tidak reload halaman — base Pixel code cuma
        // menembak PageView sekali di load awal, jadi perlu ditembak ulang
        // manual tiap kali hash berubah (pindah halaman).
        window.addEventListener('hashchange', () => { if (window.fbq) fbq('track', 'PageView'); });
      }

      function applyBrandColors() {
        try {
          const c = SITE.colors;
          if (window.tailwind && c) {
            tailwind.config = {
              theme: {
                extend: {
                  colors: {
                    brand: {
                      DEFAULT: c.green, 50: "#edf8ef", 100: "#d3efd9", 200: "#a8dfb5",
                      300: "#74c98a", 400: "#45b866", 500: c.green, 600: "#1f9036",
                      700: "#1b752f", 800: c.dark, 900: "#123f28", dark: c.dark,
                    },
                    gold: { DEFAULT: c.gold, light: "#fbcf3a" },
                    orange: c.orange,
                    ink: "#17251d",
                  },
                  fontFamily: {
                    sans: ['"Plus Jakarta Sans"', "ui-sans-serif", "system-ui", "-apple-system", "sans-serif"],
                  },
                },
              },
            };
            if (tailwind.refresh) tailwind.refresh();
          }
        } catch (e) {}
      }

      /* ============================ BOOT ============================
         Render sekali secepat mungkin (cache lokal / bawaan), lalu — begitu
         konten live datang (di-race dengan timeout 2.5 detik supaya cold-start
         Vercel/koneksi lambat tak menahan tampilan awal) — render ulang
         dengan data terkini. Kalau API gagal total, situs tetap tampil apa
         adanya (fallback), bukan kosong/rusak. */
      (async function boot() {
        captureAffiliateRef();
        const root = ReactDOM.createRoot(document.getElementById("root"));

        let resolved = null;
        try {
          resolved = await Promise.race([
            CONTENT_PROMISE,
            new Promise((resolve) => setTimeout(() => resolve(null), 2500)),
          ]);
        } catch (e) {}

        if (resolved) {
          applyContent(resolved);
          cacheContent(resolved);
          applyBrandColors();
          initMetaPixel(SITE.pixelId);
          root.render(<App key="live" />);
          return;
        }

        applyBrandColors();
        root.render(<App key="fallback" />);

        CONTENT_PROMISE.then((data) => {
          if (!data) return;
          applyContent(data);
          cacheContent(data);
          applyBrandColors();
          initMetaPixel(SITE.pixelId);
          root.render(<App key="live" />);
        }).catch(() => {});
      })();
    </script>
  </body>
</html>
