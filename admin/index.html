      /* ============ HASIL LARI (setor bukti lari virtual) ============ */
      function formatDurasi(sec) {
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
        return h > 0 ? h + ":" + mm + ":" + ss : m + ":" + ss;
      }
      function formatPace(sec) { return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
      // Awalan ' untuk isian yang diawali = + - @ supaya Excel tidak menjalankannya sebagai rumus (CSV injection).
      function csvCell(v) {
        let s = v == null ? "" : String(v);
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      function HasilLariPanel({ events }) {
        const runEvents = events.filter((e) => e.runSubmission);
        const [slug, setSlug] = useState(runEvents.length ? runEvents[0].slug : "");
        const [items, setItems] = useState([]);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [filter, setFilter] = useState("");
        const [q, setQ] = useState("");
        const [busyId, setBusyId] = useState(null);
        const [uploads, setUploads] = useState([]); // [{name, status: "menunggu"|"mengunggah"|"ok"|"gagal", message}]

        async function uploadCertificates(e) {
          const files = Array.from(e.target.files || []);
          e.target.value = "";
          if (!files.length) return;
          const list = files.map((f) => ({ name: f.name, status: "menunggu", message: "" }));
          setUploads(list.slice());
          const update = (i, patch) => { list[i] = Object.assign({}, list[i], patch); setUploads(list.slice()); };
          let next = 0;
          // 3 sekaligus — satu file per request supaya tidak melewati batas ukuran request server.
          async function worker() {
            while (next < files.length) {
              const i = next++;
              update(i, { status: "mengunggah" });
              const form = new FormData();
              form.append("event", slug);
              form.append("file", files[i]);
              try {
                const res = await apiFetch("/api/runs/certificates", { method: "POST", body: form });
                const body = await res.json().catch(() => ({}));
                if (res.ok) update(i, { status: "ok", message: body.certificateNo + " · " + (body.registrantName || "") });
                else update(i, { status: "gagal", message: body.error || "Gagal mengunggah." });
              } catch (err) {
                update(i, { status: "gagal", message: "Tidak bisa terhubung ke server." });
              }
            }
          }
          await Promise.all([worker(), worker(), worker()]);
          load();
        }

        async function hapusSertifikat(item) {
          if (!confirm("Hapus PDF khusus " + item.certificateNo + "? Peserta akan kembali mendapat sertifikat otomatis.")) return;
          setBusyId(item.id);
          const res = await apiFetch("/api/runs/certificates?event=" + encodeURIComponent(slug) + "&certificateNo=" + encodeURIComponent(item.certificateNo), { method: "DELETE" });
          setBusyId(null);
          if (!res.ok) { alert("Gagal menghapus."); return; }
          load();
        }

        async function load() {
          if (!slug) return;
          setLoading(true); setError("");
          const res = await apiFetch("/api/runs?event=" + encodeURIComponent(slug));
          if (res.status === 401) { location.reload(); return; }
          const body = await res.json().catch(() => ({}));
          setLoading(false);
          if (!res.ok) { setError(body.error || "Gagal memuat data."); return; }
          setItems(body.items || []);
        }
        useEffect(() => { load(); }, [slug]);

        async function review(item, status) {
          let rejectReason = "";
          if (status === "rejected") {
            rejectReason = prompt("Alasan penolakan (ditampilkan ke peserta):", "Screenshot tidak menunjukkan jarak/waktu/tanggal dengan jelas.");
            if (rejectReason == null) return;
            rejectReason = rejectReason.trim();
            if (!rejectReason) { alert("Alasan wajib diisi."); return; }
          }
          setBusyId(item.id);
          const res = await apiFetch("/api/runs/" + item.id, {
            method: "PATCH", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status, rejectReason }),
          });
          setBusyId(null);
          if (!res.ok) { const b = await res.json().catch(() => ({})); alert(b.error || "Gagal menyimpan."); return; }
          load();
        }

        function eksporPeringkat() {
          const rows = items.filter((i) => i.status === "accepted").sort((a, b) => a.rank - b.rank);
          const header = ["Peringkat", "No. Sertifikat", "Nama Peserta", "Kode Tiket", "Pendaftar", "Email", "Telepon", "Jarak (km)", "Waktu", "Pace (/km)", "Tanggal Lari", "Aplikasi"];
          const lines = [header.join(",")].concat(rows.map((r) => [r.rank, r.certificateNo, r.participantName, r.ticketCode, r.registrantName, r.email, r.phone, r.distanceKm, formatDurasi(r.durationSeconds), formatPace(r.paceSeconds), r.runDate, r.appName].map(csvCell).join(",")));
          download("peringkat-" + slug + ".csv", "﻿" + lines.join("\n"), "text/csv;charset=utf-8");
        }

        if (!runEvents.length) {
          return (
            <p className="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-ink/50">
              Belum ada event yang mengaktifkan setor bukti lari. Aktifkan di tab Event → Edit → "Aktifkan setor bukti lari".
            </p>
          );
        }

        const accepted = items.filter((i) => i.status === "accepted");
        const totalKm = accepted.reduce((s, i) => s + i.distanceKm, 0);
        const needle = q.trim().toLowerCase();
        const shown = items
          .filter((i) => !filter || i.status === filter)
          .filter((i) => !needle || (i.participantName + " " + i.ticketCode + " " + i.email + " " + i.registrantName).toLowerCase().includes(needle))
          .sort((a, b) => (a.rank || 1e9) - (b.rank || 1e9) || b.createdAt.localeCompare(a.createdAt));

        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <h2 className="text-lg font-extrabold text-brand-dark">Hasil Lari</h2>
              <button onClick={eksporPeringkat} disabled={!accepted.length} className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50 disabled:opacity-50">Ekspor Peringkat CSV</button>
            </div>

            <div className="grid gap-2 sm:grid-cols-3">
              <div className="rounded-xl border border-slate-200 bg-white p-3"><p className="text-xs text-ink/45">Finisher (diterima)</p><p className="text-xl font-extrabold text-brand-dark">{accepted.length}</p></div>
              <div className="rounded-xl border border-slate-200 bg-white p-3"><p className="text-xs text-ink/45">Ditolak</p><p className="text-xl font-extrabold text-orange">{items.length - accepted.length}</p></div>
              <div className="rounded-xl border border-slate-200 bg-white p-3"><p className="text-xs text-ink/45">Total jarak</p><p className="text-xl font-extrabold text-brand-dark">{totalKm.toLocaleString("id-ID", { maximumFractionDigits: 1 })} km</p></div>
            </div>

            <div className="rounded-xl border border-slate-200 bg-white p-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p className="text-sm font-bold text-brand-dark">Sertifikat PDF khusus (opsional)</p>
                  <p className="text-xs text-ink/55">
                    Menggantikan sertifikat otomatis untuk peserta tertentu. Nama file = No. Sertifikat,
                    mis. <code>YKS-AB12CD-1.pdf</code> (lihat kolom Sertifikat atau Ekspor Peringkat CSV). Maks 4MB per file.
                  </p>
                </div>
                <label className="cursor-pointer rounded-lg bg-brand px-3 py-2 text-xs font-bold text-white hover:bg-brand-600">
                  Unggah PDF (bisa banyak)
                  <input type="file" accept="application/pdf,.pdf" multiple className="hidden" onChange={uploadCertificates} />
                </label>
              </div>
              {uploads.length > 0 && (
                <div className="mt-3 max-h-56 space-y-1 overflow-y-auto border-t border-slate-100 pt-2 text-xs">
                  <p className="font-semibold text-ink/60">
                    {uploads.filter((u) => u.status === "ok").length} berhasil · {uploads.filter((u) => u.status === "gagal").length} gagal · {uploads.length} file
                  </p>
                  {uploads.map((u, i) => (
                    <p key={i} className={u.status === "gagal" ? "text-orange" : u.status === "ok" ? "text-brand-700" : "text-ink/45"}>
                      {u.status === "ok" ? "✓" : u.status === "gagal" ? "✗" : "…"} {u.name}{u.message ? " — " + u.message : ""}
                    </p>
                  ))}
                </div>
              )}
            </div>

            <div className="flex flex-wrap gap-2">
              {runEvents.length > 1 && (
                <select value={slug} onChange={(e) => setSlug(e.target.value)} className={inputCls + " max-w-xs"}>
                  {runEvents.map((e) => <option key={e.slug} value={e.slug}>{e.title}</option>)}
                </select>
              )}
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Cari nama/kode tiket/email…" className={inputCls + " max-w-xs"} />
              <select value={filter} onChange={(e) => setFilter(e.target.value)} className={inputCls + " max-w-[180px]"}>
                <option value="">Semua status</option>
                <option value="accepted">Diterima</option>
                <option value="rejected">Ditolak</option>
              </select>
              <button onClick={load} className="rounded-lg bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brand-600">Muat ulang</button>
            </div>

            {error && <p className="rounded-lg bg-orange/10 px-3 py-2 text-sm text-orange">{error}</p>}
            {loading ? (
              <p className="py-8 text-center text-sm text-ink/40">Memuat…</p>
            ) : shown.length === 0 ? (
              <p className="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-ink/50">Belum ada setoran bukti lari.</p>
            ) : (
              <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-slate-200 text-left text-xs uppercase tracking-wide text-ink/40">
                      <th className="px-3 py-2">#</th>
                      <th className="px-3 py-2">Peserta</th>
                      <th className="px-3 py-2">Hasil</th>
                      <th className="px-3 py-2">Tanggal</th>
                      <th className="px-3 py-2">Bukti</th>
                      <th className="px-3 py-2">Status</th>
                      <th className="px-3 py-2">Sertifikat</th>
                      <th className="px-3 py-2">Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    {shown.map((r) => (
                      <tr key={r.id} className="border-b border-slate-100 align-top last:border-0">
                        <td className="px-3 py-2 font-extrabold text-brand-dark">{r.rank || "—"}</td>
                        <td className="px-3 py-2">
                          <p className="font-semibold text-ink">{r.participantName}</p>
                          <p className="text-xs text-ink/50"><span className="font-mono">{r.ticketCode}</span>{r.participantNo > 1 ? " · peserta " + r.participantNo : ""}</p>
                          <p className="text-xs text-ink/40">{r.email} · {r.phone}</p>
                        </td>
                        <td className="px-3 py-2 whitespace-nowrap">
                          <p className="font-semibold">{r.distanceKm.toLocaleString("id-ID")} km · {formatDurasi(r.durationSeconds)}</p>
                          <p className="text-xs text-ink/50">pace {formatPace(r.paceSeconds)}/km{r.appName ? " · " + r.appName : ""}</p>
                        </td>
                        <td className="px-3 py-2 whitespace-nowrap text-xs text-ink/60">{formatTanggal(r.runDate)}</td>
                        <td className="px-3 py-2">
                          {r.proofUrl ? (
                            <a href={r.proofUrl} target="_blank" rel="noopener noreferrer" title="Buka screenshot">
                              <img src={r.proofUrl} alt="" className="h-14 w-14 rounded-md border border-slate-200 object-cover" />
                            </a>
                          ) : <span className="text-xs text-ink/30">—</span>}
                        </td>
                        <td className="px-3 py-2">
                          {r.status === "accepted"
                            ? <span className="rounded-full bg-brand px-2.5 py-1 text-[11px] font-bold text-white">Diterima</span>
                            : <span className="rounded-full bg-orange/15 px-2.5 py-1 text-[11px] font-bold text-orange">Ditolak</span>}
                          {r.status === "rejected" && r.rejectReason && <p className="mt-1 max-w-[180px] text-[11px] text-ink/50">{r.rejectReason}</p>}
                        </td>
                        <td className="px-3 py-2 text-xs">
                          {r.customCertificateUrl ? (
                            <React.Fragment>
                              <a href={r.customCertificateUrl} target="_blank" rel="noopener noreferrer" className="font-semibold text-brand hover:underline">PDF khusus ↗</a>
                              <button disabled={busyId === r.id} onClick={() => hapusSertifikat(r)} className="ml-2 text-orange hover:underline disabled:opacity-50">hapus</button>
                            </React.Fragment>
                          ) : <span className="text-ink/45">Otomatis</span>}
                          <p className="mt-0.5 font-mono text-[10px] text-ink/40">{r.certificateNo}</p>
                        </td>
                        <td className="px-3 py-2">
                          {r.status === "accepted" ? (
                            <button disabled={busyId === r.id} onClick={() => review(r, "rejected")}
                              className="rounded-lg border border-orange/40 px-2.5 py-1 text-xs font-semibold text-orange hover:bg-orange/10 disabled:opacity-50">Tolak</button>
                          ) : (
                            <button disabled={busyId === r.id} onClick={() => review(r, "accepted")}
                              className="rounded-lg bg-brand px-2.5 py-1 text-xs font-bold text-white hover:bg-brand-600 disabled:opacity-50">Terima</button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            <p className="text-xs text-ink/45">Link screenshot berlaku 1 jam — klik "Muat ulang" kalau gambar tidak terbuka.</p>
          </div>
        );
      }

      /* ============ LOGIN ADMIN ============ */
      function AdminLogin({ onLoggedIn, idleLoggedOut }) {
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);
        async function submit(e) {
          e.preventDefault();
          setError(""); setLoading(true);
          const res = await apiLogin(password);
          setLoading(false);
          if (!res.ok) { setError(res.error); setPassword(""); return; }
          setApiToken({ token: res.token, expiresAt: res.expiresAt });
          onLoggedIn();
        }
        return (
          <div className="grid min-h-screen place-items-center px-4">
            <form onSubmit={submit} className="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
              <img src="../yakesma-logo.png" alt="YAKESMA" className="mx-auto h-9" />
              <h1 className="mt-5 text-center text-lg font-extrabold text-brand-dark">Panel Admin</h1>
              <p className="mt-1 text-center text-sm text-ink/50">Masuk dengan password admin untuk lanjut.</p>
              {idleLoggedOut && (
                <p className="mt-2 rounded-lg bg-gold/10 px-3 py-2 text-center text-xs font-semibold text-brand-dark">
                  Sesi berakhir karena tidak ada aktivitas. Silakan masuk kembali.
                </p>
              )}
              <input autoFocus type="password" value={password}
                onChange={(e) => { setPassword(e.target.value); setError(""); }}
                placeholder="Password admin" className="mt-5 w-full rounded-xl border border-slate-300 px-4 py-3 text-center outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
              {error && <p className="mt-2 text-center text-sm text-orange">{error}</p>}
              <button type="submit" disabled={loading} className="mt-4 w-full rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white hover:bg-brand-600 disabled:opacity-60">
                {loading ? "Memeriksa…" : "Masuk"}
              </button>
            </form>
          </div>
        );
      }

      /* ============ APP ============ */
      function AdminApp() {
        const [loadState, setLoadState] = useState("loading"); // loading | ready | error
        const [loadErrorMsg, setLoadErrorMsg] = useState("");
        const [data, setDataRaw] = useState(null);
        const [recovery, setRecovery] = useState(null);
        const [saveState, setSaveState] = useState("idle"); // idle | pending | saving | saved | error
        const [saveErrorMsg, setSaveErrorMsg] = useState("");
        const [saveErrorStatus, setSaveErrorStatus] = useState(null);
        const [tab, setTab] = useState("event");
        const [editing, setEditing] = useState(null); // index | "new" | null

        const latestDataRef = useRef(null);
        const updatedAtRef = useRef(null);
        const savingRef = useRef(false);
        const pendingRef = useRef(false);
        const saveTimer = useRef(null);

        useEffect(() => {
          let cancelled = false;
          (async () => {
            const res = await loadContent();
            if (cancelled) return;
            if (!res.ok) { setLoadState("error"); setLoadErrorMsg(res.error); return; }
            setDataRaw(res.data);
            latestDataRef.current = res.data;
            updatedAtRef.current = res.updatedAt;
            setLoadState("ready");
            // WORK_KEY hanya ada kalau sesi sebelumnya berakhir dengan edit
            // yang belum sukses tersimpan (ditulis di setData, dihapus begitu
            // flushSave sukses) — jadi cukup cek keberadaannya, bukan
            // membandingkan isinya. Membandingkan isi akan salah-positif:
            // server menormalisasi field opsional (mis. menambah "speaker":"")
            // setiap kali disimpan, jadi salinan lokal & server bisa berbeda
            // padahal sama-sama sudah tersimpan.
            try {
              const saved = JSON.parse(localStorage.getItem(WORK_KEY) || "null");
              if (saved && saved.events && saved.events.length) setRecovery(saved);
            } catch (e) {}
          })();
          return () => { cancelled = true; };
        }, []);

        function flushSave() {
          if (savingRef.current) { pendingRef.current = true; return; }
          savingRef.current = true;
          setSaveState("saving");
          saveContent(latestDataRef.current, updatedAtRef.current).then((res) => {
            savingRef.current = false;
            if (!res.ok) {
              if (res.status === 401) { location.reload(); return; }
              setSaveState("error");
              setSaveErrorMsg(res.error);
              setSaveErrorStatus(res.status || null);
              return;
            }
            updatedAtRef.current = res.updatedAt;
            setSaveErrorStatus(null);
            setSaveState("saved");
            if (pendingRef.current) {
              pendingRef.current = false;
              scheduleSave();
            } else {
              try { localStorage.removeItem(WORK_KEY); } catch (e) {}
            }
          });
        }
        function scheduleSave() {
          if (saveTimer.current) clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(flushSave, 600);
        }
        function retrySave() {
          if (saveTimer.current) clearTimeout(saveTimer.current);
          flushSave();
        }
        function setData(d) {
          setDataRaw(d);
          latestDataRef.current = d;
          try { localStorage.setItem(WORK_KEY, JSON.stringify(d)); } catch (e) {}
          setSaveState("pending");
          scheduleSave();
        }
        function restoreRecovery() {
          const r = recovery;
          setRecovery(null);
          setData(r);
        }
        function dismissRecovery() {
          setRecovery(null);
          try { localStorage.removeItem(WORK_KEY); } catch (e) {}
        }

        if (loadState === "loading") {
          return <p className="grid min-h-screen place-items-center text-sm text-ink/40">Memuat konten…</p>;
        }
        if (loadState === "error") {
          return (
            <div className="grid min-h-screen place-items-center px-4 text-center">
              <div>
                <p className="text-sm text-orange">{loadErrorMsg}</p>
                <button onClick={() => location.reload()} className="mt-3 rounded-lg bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brand-600">Muat Ulang</button>
              </div>
            </div>
          );
        }

        const cats = (data.categories && data.categories.length ? data.categories : FALLBACK_CATEGORIES);
        const existingSlugs = data.events.map((e) => e.slug);

        function saveEvent(ev) {
          const arr = data.events.slice();
          if (editing === "new") arr.push(ev);
          else arr[editing] = ev;
          setData({ ...data, events: arr });
          setEditing(null);
        }

        const tabs = [["event", "Event"], ["pendaftaran", "Pendaftaran"], ["hasil-lari", "Hasil Lari"], ["pengaturan", "Pengaturan"], ["pratinjau", "Pratinjau"]];
        const badge = {
          idle: { text: "Tersinkron", cls: "text-ink/35" },
          pending: { text: "Menunggu disimpan…", cls: "text-ink/40" },
          saving: { text: "Menyimpan…", cls: "text-ink/40" },
          saved: { text: "✓ Tersimpan & tayang", cls: "text-brand" },
          error: { text: "⚠ Gagal simpan", cls: "text-orange" },
        }[saveState];

        return (
          <div className="min-h-screen">
            {/* Top bar */}
            <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
              <div className="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
                <div className="flex items-center gap-2">
                  <img src="../yakesma-mark.png" alt="" className="h-7" />
                  <span className="font-extrabold text-brand-dark">Admin</span>
                  <span className={"ml-2 text-xs transition " + badge.cls}>{badge.text}</span>
                  {saveState === "error" && (
                    <button
                      onClick={saveErrorStatus === 409 ? () => location.reload() : retrySave}
                      title={saveErrorMsg}
                      className="ml-1 rounded border border-orange/40 px-2 py-0.5 text-[11px] font-semibold text-orange hover:bg-orange/10"
                    >
                      {saveErrorStatus === 409 ? "Muat ulang" : "Coba lagi"}
                    </button>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <a href="../index.html" target="_blank" rel="noopener" className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">Buka situs ↗</a>
                  <button onClick={revokeAllSessions} title="Keluarkan semua perangkat yang sedang login admin (mis. laptop/HP hilang)" className="rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs font-semibold text-ink/60 hover:bg-slate-50">Keluar semua perangkat</button>
                  <button onClick={() => { clearApiToken(); location.reload(); }} title="Kunci" className="rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs text-ink/60 hover:bg-slate-50">🔒</button>
                </div>
              </div>
              {!editing && (
                <div className="mx-auto flex max-w-4xl gap-1 overflow-x-auto px-4">
                  {tabs.map(([k, lbl]) => (
                    <button key={k} onClick={() => setTab(k)} className={"shrink-0 border-b-2 px-3 py-2 text-sm font-semibold transition " + (tab === k ? "border-brand text-brand-dark" : "border-transparent text-ink/50 hover:text-ink")}>{lbl}</button>
                  ))}
                </div>
              )}
            </header>

            {recovery && (
              <div className="mx-auto mt-3 max-w-4xl px-4">
                <div className="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-gold/40 bg-gold/10 px-4 py-2.5 text-sm">
                  <span className="text-ink/80">Ditemukan perubahan yang belum sempat tersimpan dari sesi sebelumnya.</span>
                  <div className="flex gap-2">
                    <button onClick={restoreRecovery} className="rounded-lg bg-brand px-3 py-1.5 text-xs font-bold text-white hover:bg-brand-600">Pulihkan</button>
                    <button onClick={dismissRecovery} className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">Abaikan</button>
                  </div>
                </div>
              </div>
            )}

            <main className="mx-auto max-w-4xl px-4 py-6">
              {editing != null ? (
                <EventEditor
                  initial={editing === "new" ? emptyEvent() : data.events[editing]}
                  categories={cats}
                  existingSlugs={existingSlugs.filter((_, i) => i !== editing)}
                  onSave={saveEvent}
                  onCancel={() => setEditing(null)}
                />
              ) : tab === "event" ? (
                <EventList data={data} setData={setData} onEdit={(i) => setEditing(i)} onNew={() => setEditing("new")} />
              ) : tab === "pendaftaran" ? (
                <PendaftaranPanel />
              ) : tab === "hasil-lari" ? (
                <HasilLariPanel events={data.events} />
              ) : tab === "pengaturan" ? (
                <Settings data={data} setData={setData} />
              ) : (
                <Preview />
              )}
            </main>
          </div>
        );
      }

      // Auto-logout kalau panel tidak disentuh sama sekali selama sekian lama —
      // melindungi data pendaftar & pengaturan situs kalau admin lupa mengunci
      // panel di komputer bersama/tanpa pengawasan. Murni dicek di browser
      // (bukan di server) — token sesi sendiri tetap berlaku sampai masa aktif
      // 12 jam-nya habis, tapi begitu idle, panel dipaksa kembali ke layar
      // login supaya orang lain yang lewat tidak bisa langsung pakai sesi ini.
      const IDLE_TIMEOUT_MS = 15 * 60 * 1000; // 15 menit tanpa aktivitas
      const IDLE_CHECK_INTERVAL_MS = 15 * 1000;
      const IDLE_ACTIVITY_EVENTS = ["mousemove", "mousedown", "keydown", "scroll", "touchstart"];

      function Root() {
        const [state, setState] = useState("checking"); // checking | out | in
        const [idleLoggedOut, setIdleLoggedOut] = useState(false);
        const lastActivityRef = useRef(Date.now());

        useEffect(() => {
          const tok = getApiToken();
          if (!tok) { setState("out"); return; }
          apiFetch("/api/admin/session").then((res) => setState(res.ok ? "in" : "out"));
        }, []);

        useEffect(() => {
          if (state !== "in") return;
          lastActivityRef.current = Date.now();
          const markActive = () => { lastActivityRef.current = Date.now(); };
          IDLE_ACTIVITY_EVENTS.forEach((ev) => window.addEventListener(ev, markActive, { passive: true }));
          const timer = setInterval(() => {
            if (Date.now() - lastActivityRef.current >= IDLE_TIMEOUT_MS) {
              clearApiToken();
              setIdleLoggedOut(true);
              setState("out");
            }
          }, IDLE_CHECK_INTERVAL_MS);
          return () => {
            IDLE_ACTIVITY_EVENTS.forEach((ev) => window.removeEventListener(ev, markActive));
            clearInterval(timer);
          };
        }, [state]);

        if (state === "checking") return <p className="grid min-h-screen place-items-center text-sm text-ink/40">Memuat…</p>;
        if (state === "out") {
          return <AdminLogin idleLoggedOut={idleLoggedOut} onLoggedIn={() => { setIdleLoggedOut(false); setState("in"); }} />;
        }
        return <AdminApp />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
    </script>
  </body>
</html>
