<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../yakesma-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Admin · YAKESMA</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      Babel.registerPreset("react-classic", {
        presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
      });
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: "#28a840", 50: "#edf8ef", 100: "#d3efd9", 500: "#28a840",
                600: "#1f9036", 700: "#1b752f", 800: "#185838", 900: "#123f28", dark: "#185838",
              },
              gold: "#f6b700", orange: "#f58634", ink: "#17251d",
            },
            fontFamily: { sans: ['"Plus Jakarta Sans"', "ui-sans-serif", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <style>
      body { background: #f6f8f7; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #d3ddd6; border-radius: 999px; }
    </style>
  </head>
  <body class="font-sans text-ink">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
      const { useState, useEffect, useMemo, useRef } = React;

      /* ============ KONFIG ============ */
      const WORK_KEY = "yakesma_admin_data"; // buffer pemulihan jika simpan gagal, bukan draft

      const FALLBACK_CATEGORIES = ["Kajian", "Webinar", "Kelas", "Seminar", "Sosial", "Relawan", "Lari Virtual"];
      const EMOJIS = ["🕌","📖","🎓","🤝","🎈","💻","🌙","🎪","👨‍👩‍👧","✨","📿","🕋","💚","🎁","📣","🍲"];
      const GRADIENTS = [
        ["#28a840","#185838"],["#1f9036","#0e6b4e"],["#f6b700","#f58634"],
        ["#185838","#28a840"],["#f58634","#f6b700"],["#28a840","#1f9036"],
        ["#f6b700","#28a840"],["#f58634","#185838"],["#1f9036","#f6b700"],
      ];

      /* ============ HELPERS ============ */
      const clone = (x) => JSON.parse(JSON.stringify(x));
      function slugify(s) {
        return (s || "").toString().toLowerCase()
          .replace(/['"]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
      }
      function formatRupiah(n) {
        if (!n || n <= 0) return "Gratis";
        return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
      }
      function formatTanggal(iso) {
        if (!iso) return "-";
        const d = new Date(iso + "T00:00:00");
        return new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "short", year: "numeric" }).format(d);
      }
      function download(name, text, type) {
        const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      }
      function emptyEvent() {
        return {
          slug: "", title: "", category: "Kajian", speaker: "",
          location: "", city: "", online: false,
          date: "", timeStart: "", timeEnd: "",
          price: 0, quota: 100, registered: 0,
          gradient: ["#28a840", "#185838"], emoji: "🕌", image: "",
          excerpt: "", about: [""], benefits: [""], featured: false,
          requiresShipping: false,
        };
      }
      async function loadContent() {
        try {
          const res = await apiFetch("/api/content");
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal memuat konten." };
          return {
            ok: true,
            data: {
              site: body.site || {},
              categories: body.categories && body.categories.length ? body.categories : FALLBACK_CATEGORIES.slice(),
              events: body.events || [],
            },
            updatedAt: body.updatedAt,
          };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }
      async function saveContent(data, expectedUpdatedAt) {
        try {
          const res = await apiFetch("/api/content", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ site: data.site, categories: data.categories, events: data.events, expectedUpdatedAt }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal menyimpan.", status: res.status };
          return { ok: true, updatedAt: body.updatedAt };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      /* ============ FIELD UI ============ */
      function Label({ children }) { return <label className="mb-1 block text-sm font-semibold text-ink/80">{children}</label>; }
      const inputCls = "w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20";

      function Text({ label, value, onChange, placeholder, type }) {
        return <div><Label>{label}</Label><input type={type || "text"} className={inputCls} value={value == null ? "" : value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} /></div>;
      }
      function Num({ label, value, onChange, min, hint }) {
        return <div><Label>{label}</Label><input type="number" min={min == null ? 0 : min} className={inputCls} value={value == null ? "" : value} onChange={(e) => onChange(e.target.value === "" ? 0 : Number(e.target.value))} />{hint && <p className="mt-1 text-xs text-ink/45">{hint}</p>}</div>;
      }
      function Area({ label, value, onChange, rows, hint }) {
        return <div><Label>{label}</Label><textarea rows={rows || 3} className={inputCls} value={value == null ? "" : value} onChange={(e) => onChange(e.target.value)} />{hint && <p className="mt-1 text-xs text-ink/45">{hint}</p>}</div>;
      }
      function Select({ label, value, onChange, options }) {
        return <div><Label>{label}</Label><select className={inputCls} value={value} onChange={(e) => onChange(e.target.value)}>{options.map((o) => <option key={o} value={o}>{o}</option>)}</select></div>;
      }
      function Toggle({ label, checked, onChange }) {
        return (
          <button type="button" onClick={() => onChange(!checked)} className="flex items-center gap-3">
            <span className={"relative h-6 w-11 rounded-full transition " + (checked ? "bg-brand" : "bg-slate-300")}>
              <span className={"absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition " + (checked ? "left-[22px]" : "left-0.5")} />
            </span>
            <span className="text-sm font-semibold text-ink/80">{label}</span>
          </button>
        );
      }

      /* ============ EVENT EDITOR ============ */
      function EventEditor({ initial, categories, onSave, onCancel, existingSlugs }) {
        const [ev, setEv] = useState(clone(initial));
        const [slugTouched, setSlugTouched] = useState(!!initial.slug);
        const [uploading, setUploading] = useState(false);
        const [uploadError, setUploadError] = useState("");
        const set = (k, v) => setEv((p) => ({ ...p, [k]: v }));

        function setTitle(v) {
          setEv((p) => ({ ...p, title: v, slug: slugTouched ? p.slug : slugify(v) }));
        }
        async function handleImageUpload(e) {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          setUploadError("");
          setUploading(true);
          const res = await uploadEventImage(file);
          setUploading(false);
          if (!res.ok) { setUploadError(res.error); return; }
          set("image", res.url);
        }
        function save() {
          const e = clone(ev);
          e.title = (e.title || "").trim();
          if (!e.title) { alert("Judul wajib diisi."); return; }
          if (!e.date) { alert("Tanggal wajib diisi."); return; }
          e.slug = slugify(e.slug || e.title);
          if (existingSlugs.filter((s) => s === e.slug).length > 0) {
            // pastikan unik
            let base = e.slug, i = 2;
            while (existingSlugs.indexOf(e.slug) !== -1) { e.slug = base + "-" + i; i++; }
          }
          e.price = Number(e.price) || 0;
          e.quota = Number(e.quota) || 0;
          e.registered = Number(e.registered) || 0;
          e.about = (typeof e.about === "string" ? e.about.split("\n") : e.about).map((x) => x.trim()).filter(Boolean);
          e.benefits = (typeof e.benefits === "string" ? e.benefits.split("\n") : e.benefits).map((x) => x.trim()).filter(Boolean);
          if (!e.about.length) e.about = [""];
          if (!e.benefits.length) e.benefits = [""];
          onSave(e);
        }

        const aboutText = Array.isArray(ev.about) ? ev.about.join("\n") : ev.about;
        const benefitsText = Array.isArray(ev.benefits) ? ev.benefits.join("\n") : ev.benefits;

        return (
          <div className="space-y-5">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-extrabold text-brand-dark">{initial.slug ? "Edit Event" : "Tambah Event"}</h2>
              <button onClick={onCancel} className="text-sm font-semibold text-ink/50 hover:text-ink">Batal</button>
            </div>

            {/* Poster preview */}
            <div className="relative overflow-hidden rounded-xl" style={{ aspectRatio: "16/7", backgroundImage: ev.image ? undefined : "linear-gradient(145deg," + ev.gradient[0] + "," + ev.gradient[1] + ")" }}>
              {ev.image && <img src={ev.image} alt="" className="absolute inset-0 h-full w-full object-cover" />}
              {ev.image && <div className="absolute inset-0" style={{ backgroundImage: "linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 55%, transparent)" }} />}
              <div className="relative flex h-full flex-col justify-between p-4 text-white">
                <div className="flex justify-between"><span className="text-[11px] font-extrabold uppercase tracking-widest opacity-90">YAKESMA</span><span className="rounded-full bg-white/20 px-2 py-0.5 text-[11px] font-semibold">{ev.category}</span></div>
                <div className="text-xl font-extrabold drop-shadow">{ev.title || "Judul Event"} <span className="text-2xl">{ev.emoji}</span></div>
              </div>
            </div>

            <div className="grid gap-4 sm:grid-cols-2">
              <div className="sm:col-span-2"><Text label="Judul Event" value={ev.title} onChange={setTitle} placeholder="mis. Kajian Akbar: Keajaiban Sedekah" /></div>
              <div className="sm:col-span-2">
                <Label>Slug (URL)</Label>
                <input className={inputCls} value={ev.slug} onChange={(e) => { setSlugTouched(true); set("slug", e.target.value); }} placeholder="otomatis-dari-judul" />
                <p className="mt-1 text-xs text-ink/45">Alamat: <code>#/event/{ev.slug || "..."}</code></p>
              </div>
              <Select label="Kategori" value={ev.category} onChange={(v) => set("category", v)} options={categories} />
              <Text label="Pemateri (opsional)" value={ev.speaker} onChange={(v) => set("speaker", v)} placeholder="mis. Ustadz Ahmad Zaki" />
              <Text label="Nama Lokasi" value={ev.location} onChange={(v) => set("location", v)} placeholder="mis. Masjid Raya Bintaro / Online (Zoom)" />
              <Text label="Kota" value={ev.city} onChange={(v) => set("city", v)} placeholder="mis. Jakarta / Online" />
              <div className="flex items-end pb-1"><Toggle label="Event online" checked={!!ev.online} onChange={(v) => set("online", v)} /></div>
              <div className="flex items-end pb-1"><Toggle label="Tampilkan sebagai unggulan" checked={!!ev.featured} onChange={(v) => set("featured", v)} /></div>
              <div className="sm:col-span-2 flex items-end pb-1">
                <Toggle label="Butuh info pengiriman (alamat, ukuran kaos, kurir) — mis. lari virtual"
                  checked={!!ev.requiresShipping} onChange={(v) => set("requiresShipping", v)} />
              </div>
              <Text label="Tanggal" type="date" value={ev.date} onChange={(v) => set("date", v)} />
              <div className="grid grid-cols-2 gap-3">
                <Text label="Mulai" value={ev.timeStart} onChange={(v) => set("timeStart", v)} placeholder="08:00" />
                <Text label="Selesai" value={ev.timeEnd} onChange={(v) => set("timeEnd", v)} placeholder="11:00" />
              </div>
              <Num label="Harga (Rp)" value={ev.price} onChange={(v) => set("price", v)} hint="0 = Gratis" />
              <div className="grid grid-cols-2 gap-3">
                <Num label="Kuota" value={ev.quota} onChange={(v) => set("quota", v)} />
                <Num label="Sudah daftar" value={ev.registered} onChange={(v) => set("registered", v)} />
              </div>
              <div className="sm:col-span-2"><Area label="Ringkasan singkat" value={ev.excerpt} onChange={(v) => set("excerpt", v)} rows={2} hint="1 kalimat, muncul di kartu & detail." /></div>
              <div className="sm:col-span-2"><Area label="Deskripsi" value={aboutText} onChange={(v) => set("about", v)} rows={4} hint="Satu paragraf per baris." /></div>
              <div className="sm:col-span-2"><Area label="Yang Anda Dapatkan" value={benefitsText} onChange={(v) => set("benefits", v)} rows={3} hint="Satu poin per baris." /></div>

              <div className="sm:col-span-2">
                <Label>Gambar Thumbnail (opsional)</Label>
                <div className="flex flex-wrap items-center gap-3">
                  <label className="cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-ink/70 hover:bg-slate-50">
                    {uploading ? "Mengunggah…" : ev.image ? "Ganti Gambar" : "Unggah Gambar"}
                    <input type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={handleImageUpload} disabled={uploading} />
                  </label>
                  {ev.image && (
                    <button type="button" onClick={() => set("image", "")} className="text-sm font-semibold text-orange hover:underline">Hapus gambar (pakai warna + emoji)</button>
                  )}
                </div>
                {uploadError && <p className="mt-1 text-xs text-orange">{uploadError}</p>}
                <p className="mt-1 text-xs text-ink/45">
                  Direkomendasikan 1600×900px (rasio 16:9), format JPG/PNG/WEBP, maks 3MB. Gambar
                  otomatis menyesuaikan bentuk kartu (kotak) dan halaman detail (lebar) — tanpa
                  gambar, poster memakai warna gradient + emoji seperti biasa.
                </p>
              </div>
              <div className="sm:col-span-2">
                <Label>Emoji poster</Label>
                <div className="flex flex-wrap gap-1.5">
                  {EMOJIS.map((em) => <button key={em} type="button" onClick={() => set("emoji", em)} className={"grid h-9 w-9 place-items-center rounded-lg border text-lg " + (ev.emoji === em ? "border-brand bg-brand-50" : "border-slate-200 bg-white")}>{em}</button>)}
                </div>
              </div>
              <div className="sm:col-span-2">
                <Label>Warna poster</Label>
                <div className="flex flex-wrap gap-2">
                  {GRADIENTS.map((g, i) => (
                    <button key={i} type="button" onClick={() => set("gradient", g.slice())} title={g.join(" → ")}
                      className={"h-9 w-14 rounded-lg border-2 " + (ev.gradient[0] === g[0] && ev.gradient[1] === g[1] ? "border-brand-dark" : "border-white shadow")}
                      style={{ backgroundImage: "linear-gradient(145deg," + g[0] + "," + g[1] + ")" }} />
                  ))}
                  <div className="flex items-center gap-1">
                    <input type="color" value={ev.gradient[0]} onChange={(e) => set("gradient", [e.target.value, ev.gradient[1]])} className="h-9 w-9 rounded" />
                    <input type="color" value={ev.gradient[1]} onChange={(e) => set("gradient", [ev.gradient[0], e.target.value])} className="h-9 w-9 rounded" />
                  </div>
                </div>
              </div>
            </div>

            <div className="flex gap-3 pt-2">
              <button onClick={save} className="rounded-xl bg-brand px-5 py-2.5 text-sm font-bold text-white hover:bg-brand-600">Simpan Event</button>
              <button onClick={onCancel} className="rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-ink/70 hover:bg-slate-50">Batal</button>
            </div>
          </div>
        );
      }

      /* ============ EVENT LIST ============ */
      function EventList({ data, setData, onEdit, onNew }) {
        const events = data.events;
        function move(i, dir) {
          const j = i + dir; if (j < 0 || j >= events.length) return;
          const arr = events.slice(); const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
          setData({ ...data, events: arr });
        }
        function del(i) {
          if (!confirm("Hapus event \"" + events[i].title + "\"?")) return;
          setData({ ...data, events: events.filter((_, k) => k !== i) });
        }
        function dup(i) {
          const c = clone(events[i]); c.slug = ""; c.title = c.title + " (salinan)";
          const arr = events.slice(); arr.splice(i + 1, 0, c); setData({ ...data, events: arr });
        }
        return (
          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-extrabold text-brand-dark">Event <span className="text-ink/40">({events.length})</span></h2>
              <button onClick={onNew} className="rounded-xl bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brand-600">+ Tambah Event</button>
            </div>
            {events.length === 0 && <p className="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-ink/50">Belum ada event. Klik "Tambah Event".</p>}
            <div className="space-y-2.5">
              {events.map((e, i) => (
                <div key={e.slug || i} className="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3">
                  {e.image ? (
                    <img src={e.image} alt="" className="h-12 w-12 shrink-0 rounded-lg object-cover" />
                  ) : (
                    <div className="grid h-12 w-12 shrink-0 place-items-center rounded-lg text-xl text-white" style={{ backgroundImage: "linear-gradient(145deg," + e.gradient[0] + "," + e.gradient[1] + ")" }}>{e.emoji}</div>
                  )}
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2">
                      <p className="truncate font-bold text-ink">{e.title}</p>
                      {e.featured && <span className="rounded bg-gold/20 px-1.5 py-0.5 text-[10px] font-bold text-orange">unggulan</span>}
                    </div>
                    <p className="truncate text-xs text-ink/55">{e.category} · {formatTanggal(e.date)} · {e.online ? "Online" : e.city} · {formatRupiah(e.price)}</p>
                  </div>
                  <div className="flex shrink-0 items-center gap-1">
                    <button onClick={() => move(i, -1)} title="Naik" className="grid h-8 w-8 place-items-center rounded text-ink/50 hover:bg-slate-100">▲</button>
                    <button onClick={() => move(i, 1)} title="Turun" className="grid h-8 w-8 place-items-center rounded text-ink/50 hover:bg-slate-100">▼</button>
                    <button onClick={() => dup(i)} title="Duplikat" className="grid h-8 w-8 place-items-center rounded text-ink/50 hover:bg-slate-100">⧉</button>
                    <button onClick={() => onEdit(i)} className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">Edit</button>
                    <button onClick={() => del(i)} title="Hapus" className="grid h-8 w-8 place-items-center rounded text-orange hover:bg-orange/10">🗑</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      /* ============ SETTINGS ============ */
      function Settings({ data, setData }) {
        const s = data.site || {};
        const setS = (k, v) => setData({ ...data, site: { ...s, [k]: v } });
        const colors = s.colors || { green: "#28a840", dark: "#185838", gold: "#f6b700", orange: "#f58634" };
        const setColor = (k, v) => setData({ ...data, site: { ...s, colors: { ...colors, [k]: v } } });
        return (
          <div className="space-y-6">
            <h2 className="text-lg font-extrabold text-brand-dark">Pengaturan Situs</h2>
            <div className="grid gap-4 sm:grid-cols-2">
              <Text label="Nama Brand" value={s.name} onChange={(v) => setS("name", v)} />
              <Text label="Tagline" value={s.tagline} onChange={(v) => setS("tagline", v)} />
              <div className="sm:col-span-2"><Area label="Intro (di beranda)" value={s.intro} onChange={(v) => setS("intro", v)} rows={2} /></div>
              <Text label="Nomor WhatsApp" value={s.whatsapp} onChange={(v) => setS("whatsapp", v)} placeholder="62812xxxxxxx (tanpa +, tanpa spasi)" />
              <Text label="Email" value={s.email} onChange={(v) => setS("email", v)} />
              <Text label="Instagram (username)" value={s.instagram} onChange={(v) => setS("instagram", v)} placeholder="yakesma.official" />
              <Text label="Website" value={s.website} onChange={(v) => setS("website", v)} />
              <div className="sm:col-span-2"><Text label="Alamat" value={s.address} onChange={(v) => setS("address", v)} /></div>
            </div>
            <div>
              <Label>Rekening untuk Transfer Manual</Label>
              <p className="mb-2 text-xs text-ink/45">Ditampilkan ke pendaftar event berbayar sebagai tujuan transfer.</p>
              <div className="grid gap-4 sm:grid-cols-3">
                <Text label="Nama Bank" value={s.bankName} onChange={(v) => setS("bankName", v)} placeholder="mis. Bank Syariah Indonesia (BSI)" />
                <Text label="Nomor Rekening" value={s.accountNumber} onChange={(v) => setS("accountNumber", v)} placeholder="1234567890" />
                <Text label="Atas Nama" value={s.accountHolder} onChange={(v) => setS("accountHolder", v)} placeholder="Yayasan YAKESMA" />
              </div>
            </div>
            <div>
              <Label>Warna Brand</Label>
              <div className="flex flex-wrap gap-4">
                {[["green","Hijau utama"],["dark","Hijau tua"],["gold","Emas"],["orange","Oranye"]].map(([k, lbl]) => (
                  <label key={k} className="flex items-center gap-2 text-sm">
                    <input type="color" value={colors[k]} onChange={(e) => setColor(k, e.target.value)} className="h-9 w-9 rounded" />
                    <span className="text-ink/70">{lbl}</span>
                  </label>
                ))}
              </div>
              <p className="mt-2 text-xs text-ink/45">Logo diganti dengan menimpa file <code>yakesma-logo.png</code> / <code>yakesma-mark.png</code> di repo.</p>
            </div>
          </div>
        );
      }

      /* ============ PREVIEW ============ */
      function Preview() {
        const [nonce, setNonce] = useState(Date.now());
        const [wide, setWide] = useState(true);
        return (
          <div className="space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-extrabold text-brand-dark">Pratinjau Langsung</h2>
              <div className="flex items-center gap-2">
                <button onClick={() => setWide(!wide)} className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">{wide ? "📱 Mobile" : "🖥 Desktop"}</button>
                <button onClick={() => setNonce(Date.now())} className="rounded-lg bg-brand px-3 py-1.5 text-xs font-bold text-white hover:bg-brand-600">↻ Segarkan</button>
              </div>
            </div>
            <p className="text-xs text-ink/50">Menampilkan situs publik saat ini — setiap perubahan yang tersimpan langsung terlihat di sini.</p>
            <div className="mx-auto overflow-hidden rounded-xl border border-slate-300 bg-white transition-all" style={{ width: wide ? "100%" : "390px" }}>
              <iframe key={nonce} src={"../index.html?t=" + nonce} title="Pratinjau" className="h-[70vh] w-full" />
            </div>
          </div>
        );
      }

      /* ============ PENDAFTARAN (backend nyata: yakesma-api) ============ */
      const API_BASE = "https://yakesma-event-api.vercel.app";
      const API_TOKEN_KEY = "yakesma_admin_api_token";

      function getApiToken() {
        try { return JSON.parse(sessionStorage.getItem(API_TOKEN_KEY) || "null"); } catch (e) { return null; }
      }
      function setApiToken(tok) { sessionStorage.setItem(API_TOKEN_KEY, JSON.stringify(tok)); }
      function clearApiToken() { sessionStorage.removeItem(API_TOKEN_KEY); }

      async function apiLogin(password) {
        try {
          const res = await fetch(API_BASE + "/api/admin/login", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal masuk." };
          return { ok: true, token: body.token, expiresAt: body.expiresAt };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      /** fetch ke yakesma-api dengan header Authorization otomatis dari token tersimpan. */
      async function apiFetch(path, opts) {
        const tok = getApiToken();
        const headers = Object.assign({}, (opts && opts.headers) || {}, tok ? { Authorization: "Bearer " + tok.token } : {});
        const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
        if (res.status === 401) clearApiToken();
        return res;
      }

      /** Unggah gambar thumbnail event, balikan {ok:true,url} atau {ok:false,error}. */
      async function uploadEventImage(file) {
        try {
          const form = new FormData();
          form.append("file", file);
          const res = await apiFetch("/api/content/image", { method: "POST", body: form });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal mengunggah gambar." };
          return { ok: true, url: body.url };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      const REG_STATUS_LABEL = {
        free: { text: "Gratis", cls: "bg-brand-50 text-brand-700" },
        pending_transfer: { text: "Menunggu Konfirmasi", cls: "bg-gold/20 text-orange" },
        paid: { text: "Lunas", cls: "bg-brand text-white" },
        cancelled: { text: "Dibatalkan", cls: "bg-slate-200 text-ink/50" },
      };
      function RegStatusBadge({ status }) {
        const s = REG_STATUS_LABEL[status] || REG_STATUS_LABEL.free;
        return <span className={"rounded-full px-2.5 py-1 text-[11px] font-bold " + s.cls}>{s.text}</span>;
      }

      function PendaftaranPanel() {
        const [items, setItems] = useState([]);
        const [total, setTotal] = useState(0);
        const [q, setQ] = useState("");
        const [status, setStatus] = useState("");
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");
        const [busyId, setBusyId] = useState(null);
        const [expandedId, setExpandedId] = useState(null);

        async function load() {
          setLoading(true); setError("");
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          if (status) params.set("status", status);
          params.set("pageSize", "100");
          const res = await apiFetch("/api/registrations?" + params.toString());
          if (res.status === 401) { location.reload(); return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { setError(body.error || "Gagal memuat data."); setLoading(false); return; }
          setItems(body.items || []); setTotal(body.total || 0); setLoading(false);
        }

        useEffect(() => { load(); }, []);

        async function ubahStatus(id, paymentStatus) {
          if (paymentStatus === "cancelled" && !confirm("Batalkan pendaftaran ini?")) return;
          setBusyId(id);
          const res = await apiFetch("/api/registrations/" + id, {
            method: "PATCH", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentStatus, confirmedBy: "Admin" }),
          });
          setBusyId(null);
          if (!res.ok) { const b = await res.json().catch(() => ({})); alert(b.error || "Gagal mengubah status."); return; }
          load();
        }

        async function ekspor() {
          const params = new URLSearchParams();
          if (status) params.set("status", status);
          const res = await apiFetch("/api/registrations/export?" + params.toString());
          if (!res.ok) { alert("Gagal mengekspor."); return; }
          const text = await res.text();
          download("pendaftaran-yakesma.csv", text, "text/csv;charset=utf-8");
        }

        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <h2 className="text-lg font-extrabold text-brand-dark">Pendaftaran <span className="text-ink/40">({total})</span></h2>
              <div className="flex items-center gap-2">
                <button onClick={ekspor} className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">Ekspor CSV</button>
              </div>
            </div>

            <div className="flex flex-wrap gap-2">
              <input value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && load()}
                placeholder="Cari nama/email/telepon…" className={inputCls + " max-w-xs"} />
              <select value={status} onChange={(e) => setStatus(e.target.value)} className={inputCls + " max-w-[220px]"}>
                <option value="">Semua status</option>
                <option value="free">Gratis</option>
                <option value="pending_transfer">Menunggu Konfirmasi</option>
                <option value="paid">Lunas</option>
                <option value="cancelled">Dibatalkan</option>
              </select>
              <button onClick={load} className="rounded-lg bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brand-600">Cari</button>
            </div>

            {error && <p className="rounded-lg bg-orange/10 px-3 py-2 text-sm text-orange">{error}</p>}
            {loading ? (
              <p className="py-8 text-center text-sm text-ink/40">Memuat…</p>
            ) : items.length === 0 ? (
              <p className="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-ink/50">Belum ada pendaftaran.</p>
            ) : (
              <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-slate-200 text-left text-xs uppercase tracking-wide text-ink/40">
                      <th className="px-3 py-2">Pendaftar</th>
                      <th className="px-3 py-2">Event</th>
                      <th className="px-3 py-2">Qty</th>
                      <th className="px-3 py-2">Total</th>
                      <th className="px-3 py-2">Kode</th>
                      <th className="px-3 py-2">Status</th>
                      <th className="px-3 py-2">Kirim</th>
                      <th className="px-3 py-2">Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    {items.map((r) => {
                      const hasShipping = !!r.address;
                      const expanded = expandedId === r.id;
                      return (
                        <React.Fragment key={r.id}>
                          <tr className="border-b border-slate-100 last:border-0">
                            <td className="px-3 py-2">
                              <p className="font-semibold text-ink">{r.name}</p>
                              <p className="text-xs text-ink/50">{r.email} · {r.phone}</p>
                            </td>
                            <td className="px-3 py-2">
                              <p className="text-ink/80">{r.event_title}</p>
                              <p className="text-xs text-ink/40">{formatTanggal(r.event_date)}</p>
                            </td>
                            <td className="px-3 py-2">{r.quantity}</td>
                            <td className="px-3 py-2 font-semibold">{formatRupiah(r.total_amount)}</td>
                            <td className="px-3 py-2 font-mono text-xs">{r.ticket_code}</td>
                            <td className="px-3 py-2"><RegStatusBadge status={r.payment_status} /></td>
                            <td className="px-3 py-2">
                              {hasShipping ? (
                                <button onClick={() => setExpandedId(expanded ? null : r.id)}
                                  className="rounded-lg border border-brand-100 px-2.5 py-1 text-xs font-semibold text-brand-dark hover:bg-brand-50">
                                  📦 {expanded ? "Tutup" : "Detail"}
                                </button>
                              ) : (
                                <span className="text-xs text-ink/30">—</span>
                              )}
                            </td>
                            <td className="px-3 py-2">
                              <div className="flex gap-2">
                                {r.payment_status === "pending_transfer" && (
                                  <button disabled={busyId === r.id} onClick={() => ubahStatus(r.id, "paid")}
                                    className="rounded-lg bg-brand px-2.5 py-1 text-xs font-bold text-white hover:bg-brand-600 disabled:opacity-50">Tandai Lunas</button>
                                )}
                                {(r.payment_status === "pending_transfer" || r.payment_status === "free") && (
                                  <button disabled={busyId === r.id} onClick={() => ubahStatus(r.id, "cancelled")}
                                    className="rounded-lg border border-orange/40 px-2.5 py-1 text-xs font-semibold text-orange hover:bg-orange/10 disabled:opacity-50">Batalkan</button>
                                )}
                              </div>
                            </td>
                          </tr>
                          {expanded && hasShipping && (
                            <tr className="border-b border-slate-100 bg-brand-50/40 last:border-0">
                              <td colSpan={8} className="px-3 py-3">
                                <div className="grid gap-x-6 gap-y-1 text-xs sm:grid-cols-2">
                                  <p><span className="font-semibold text-ink/60">Alamat:</span> {r.address}</p>
                                  <p><span className="font-semibold text-ink/60">Kode Pos:</span> {r.postal_code}</p>
                                  <p><span className="font-semibold text-ink/60">Kelurahan:</span> {r.subdistrict}</p>
                                  <p><span className="font-semibold text-ink/60">Kecamatan:</span> {r.district}</p>
                                  <p><span className="font-semibold text-ink/60">Kota/Kabupaten:</span> {r.city}</p>
                                  <p><span className="font-semibold text-ink/60">Provinsi:</span> {r.province}</p>
                                  <p><span className="font-semibold text-ink/60">Ukuran Jersey:</span> {r.shirt_size}</p>
                                  <p><span className="font-semibold text-ink/60">Kurir:</span> {r.courier}</p>
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      }

      /* ============ LOGIN ADMIN ============ */
      function AdminLogin({ onLoggedIn }) {
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);
        async function submit(e) {
          e.preventDefault();
          setError(""); setLoading(true);
          const res = await apiLogin(password);
          setLoading(false);
          if (!res.ok) { setError(res.error); setPassword(""); return; }
          setApiToken({ token: res.token, expiresAt: res.expiresAt });
          onLoggedIn();
        }
        return (
          <div className="grid min-h-screen place-items-center px-4">
            <form onSubmit={submit} className="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
              <img src="../yakesma-logo.png" alt="YAKESMA" className="mx-auto h-9" />
              <h1 className="mt-5 text-center text-lg font-extrabold text-brand-dark">Panel Admin</h1>
              <p className="mt-1 text-center text-sm text-ink/50">Masuk dengan password admin untuk lanjut.</p>
              <input autoFocus type="password" value={password}
                onChange={(e) => { setPassword(e.target.value); setError(""); }}
                placeholder="Password admin" className="mt-5 w-full rounded-xl border border-slate-300 px-4 py-3 text-center outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
              {error && <p className="mt-2 text-center text-sm text-orange">{error}</p>}
              <button type="submit" disabled={loading} className="mt-4 w-full rounded-xl bg-brand px-4 py-3 text-sm font-bold text-white hover:bg-brand-600 disabled:opacity-60">
                {loading ? "Memeriksa…" : "Masuk"}
              </button>
            </form>
          </div>
        );
      }

      /* ============ APP ============ */
      function AdminApp() {
        const [loadState, setLoadState] = useState("loading"); // loading | ready | error
        const [loadErrorMsg, setLoadErrorMsg] = useState("");
        const [data, setDataRaw] = useState(null);
        const [recovery, setRecovery] = useState(null);
        const [saveState, setSaveState] = useState("idle"); // idle | pending | saving | saved | error
        const [saveErrorMsg, setSaveErrorMsg] = useState("");
        const [saveErrorStatus, setSaveErrorStatus] = useState(null);
        const [tab, setTab] = useState("event");
        const [editing, setEditing] = useState(null); // index | "new" | null

        const latestDataRef = useRef(null);
        const updatedAtRef = useRef(null);
        const savingRef = useRef(false);
        const pendingRef = useRef(false);
        const saveTimer = useRef(null);

        useEffect(() => {
          let cancelled = false;
          (async () => {
            const res = await loadContent();
            if (cancelled) return;
            if (!res.ok) { setLoadState("error"); setLoadErrorMsg(res.error); return; }
            setDataRaw(res.data);
            latestDataRef.current = res.data;
            updatedAtRef.current = res.updatedAt;
            setLoadState("ready");
            // WORK_KEY hanya ada kalau sesi sebelumnya berakhir dengan edit
            // yang belum sukses tersimpan (ditulis di setData, dihapus begitu
            // flushSave sukses) — jadi cukup cek keberadaannya, bukan
            // membandingkan isinya. Membandingkan isi akan salah-positif:
            // server menormalisasi field opsional (mis. menambah "speaker":"")
            // setiap kali disimpan, jadi salinan lokal & server bisa berbeda
            // padahal sama-sama sudah tersimpan.
            try {
              const saved = JSON.parse(localStorage.getItem(WORK_KEY) || "null");
              if (saved && saved.events && saved.events.length) setRecovery(saved);
            } catch (e) {}
          })();
          return () => { cancelled = true; };
        }, []);

        function flushSave() {
          if (savingRef.current) { pendingRef.current = true; return; }
          savingRef.current = true;
          setSaveState("saving");
          saveContent(latestDataRef.current, updatedAtRef.current).then((res) => {
            savingRef.current = false;
            if (!res.ok) {
              if (res.status === 401) { location.reload(); return; }
              setSaveState("error");
              setSaveErrorMsg(res.error);
              setSaveErrorStatus(res.status || null);
              return;
            }
            updatedAtRef.current = res.updatedAt;
            setSaveErrorStatus(null);
            setSaveState("saved");
            if (pendingRef.current) {
              pendingRef.current = false;
              scheduleSave();
            } else {
              try { localStorage.removeItem(WORK_KEY); } catch (e) {}
            }
          });
        }
        function scheduleSave() {
          if (saveTimer.current) clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(flushSave, 600);
        }
        function retrySave() {
          if (saveTimer.current) clearTimeout(saveTimer.current);
          flushSave();
        }
        function setData(d) {
          setDataRaw(d);
          latestDataRef.current = d;
          try { localStorage.setItem(WORK_KEY, JSON.stringify(d)); } catch (e) {}
          setSaveState("pending");
          scheduleSave();
        }
        function restoreRecovery() {
          const r = recovery;
          setRecovery(null);
          setData(r);
        }
        function dismissRecovery() {
          setRecovery(null);
          try { localStorage.removeItem(WORK_KEY); } catch (e) {}
        }

        if (loadState === "loading") {
          return <p className="grid min-h-screen place-items-center text-sm text-ink/40">Memuat konten…</p>;
        }
        if (loadState === "error") {
          return (
            <div className="grid min-h-screen place-items-center px-4 text-center">
              <div>
                <p className="text-sm text-orange">{loadErrorMsg}</p>
                <button onClick={() => location.reload()} className="mt-3 rounded-lg bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brand-600">Muat Ulang</button>
              </div>
            </div>
          );
        }

        const cats = (data.categories && data.categories.length ? data.categories : FALLBACK_CATEGORIES);
        const existingSlugs = data.events.map((e) => e.slug);

        function saveEvent(ev) {
          const arr = data.events.slice();
          if (editing === "new") arr.push(ev);
          else arr[editing] = ev;
          setData({ ...data, events: arr });
          setEditing(null);
        }

        const tabs = [["event", "Event"], ["pendaftaran", "Pendaftaran"], ["pengaturan", "Pengaturan"], ["pratinjau", "Pratinjau"]];
        const badge = {
          idle: { text: "Tersinkron", cls: "text-ink/35" },
          pending: { text: "Menunggu disimpan…", cls: "text-ink/40" },
          saving: { text: "Menyimpan…", cls: "text-ink/40" },
          saved: { text: "✓ Tersimpan & tayang", cls: "text-brand" },
          error: { text: "⚠ Gagal simpan", cls: "text-orange" },
        }[saveState];

        return (
          <div className="min-h-screen">
            {/* Top bar */}
            <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
              <div className="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
                <div className="flex items-center gap-2">
                  <img src="../yakesma-mark.png" alt="" className="h-7" />
                  <span className="font-extrabold text-brand-dark">Admin</span>
                  <span className={"ml-2 text-xs transition " + badge.cls}>{badge.text}</span>
                  {saveState === "error" && (
                    <button
                      onClick={saveErrorStatus === 409 ? () => location.reload() : retrySave}
                      title={saveErrorMsg}
                      className="ml-1 rounded border border-orange/40 px-2 py-0.5 text-[11px] font-semibold text-orange hover:bg-orange/10"
                    >
                      {saveErrorStatus === 409 ? "Muat ulang" : "Coba lagi"}
                    </button>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <a href="../index.html" target="_blank" rel="noopener" className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">Buka situs ↗</a>
                  <button onClick={() => { clearApiToken(); location.reload(); }} title="Kunci" className="rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs text-ink/60 hover:bg-slate-50">🔒</button>
                </div>
              </div>
              {!editing && (
                <div className="mx-auto flex max-w-4xl gap-1 overflow-x-auto px-4">
                  {tabs.map(([k, lbl]) => (
                    <button key={k} onClick={() => setTab(k)} className={"shrink-0 border-b-2 px-3 py-2 text-sm font-semibold transition " + (tab === k ? "border-brand text-brand-dark" : "border-transparent text-ink/50 hover:text-ink")}>{lbl}</button>
                  ))}
                </div>
              )}
            </header>

            {recovery && (
              <div className="mx-auto mt-3 max-w-4xl px-4">
                <div className="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-gold/40 bg-gold/10 px-4 py-2.5 text-sm">
                  <span className="text-ink/80">Ditemukan perubahan yang belum sempat tersimpan dari sesi sebelumnya.</span>
                  <div className="flex gap-2">
                    <button onClick={restoreRecovery} className="rounded-lg bg-brand px-3 py-1.5 text-xs font-bold text-white hover:bg-brand-600">Pulihkan</button>
                    <button onClick={dismissRecovery} className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">Abaikan</button>
                  </div>
                </div>
              </div>
            )}

            <main className="mx-auto max-w-4xl px-4 py-6">
              {editing != null ? (
                <EventEditor
                  initial={editing === "new" ? emptyEvent() : data.events[editing]}
                  categories={cats}
                  existingSlugs={existingSlugs.filter((_, i) => i !== editing)}
                  onSave={saveEvent}
                  onCancel={() => setEditing(null)}
                />
              ) : tab === "event" ? (
                <EventList data={data} setData={setData} onEdit={(i) => setEditing(i)} onNew={() => setEditing("new")} />
              ) : tab === "pendaftaran" ? (
                <PendaftaranPanel />
              ) : tab === "pengaturan" ? (
                <Settings data={data} setData={setData} />
              ) : (
                <Preview />
              )}
            </main>
          </div>
        );
      }

      function Root() {
        const [state, setState] = useState("checking"); // checking | out | in
        useEffect(() => {
          const tok = getApiToken();
          if (!tok) { setState("out"); return; }
          apiFetch("/api/admin/session").then((res) => setState(res.ok ? "in" : "out"));
        }, []);
        if (state === "checking") return <p className="grid min-h-screen place-items-center text-sm text-ink/40">Memuat…</p>;
        if (state === "out") return <AdminLogin onLoggedIn={() => setState("in")} />;
        return <AdminApp />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
    </script>
  </body>
</html>
