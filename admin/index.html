<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../yakesma-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Admin · YAKESMA</title>

    <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@8.0.7/babel.min.js" integrity="sha384-oO1UkcqdSTjrtWIjKpx1K6eE5I0WAXPWoezFn46CIHNoN6+CGVMK+GNSaDdkJ+u5"></script>
    <script>
      Babel.registerPreset("react-classic", {
        presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
      });
    </script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: "#28a840", 50: "#edf8ef", 100: "#d3efd9", 500: "#28a840",
                600: "#1f9036", 700: "#1b752f", 800: "#185838", 900: "#123f28", dark: "#185838",
              },
              gold: "#f6b700", orange: "#f58634", ink: "#17251d",
            },
            fontFamily: { sans: ['"Plus Jakarta Sans"', "ui-sans-serif", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <style>
      body { background: #f6f8f7; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #d3ddd6; border-radius: 999px; }
    </style>
  </head>
  <body class="font-sans text-ink">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
      const { useState, useEffect, useMemo, useRef } = React;

      /* ============ KONFIG ============ */
      const WORK_KEY = "yakesma_admin_data"; // buffer pemulihan jika simpan gagal, bukan draft

      const FALLBACK_CATEGORIES = ["Kajian", "Webinar", "Kelas", "Seminar", "Sosial", "Relawan", "Lari Virtual"];
      const EMOJIS = ["🕌","📖","🎓","🤝","🎈","💻","🌙","🎪","👨‍👩‍👧","✨","📿","🕋","💚","🎁","📣","🍲"];
      const GRADIENTS = [
        ["#28a840","#185838"],["#1f9036","#0e6b4e"],["#f6b700","#f58634"],
        ["#185838","#28a840"],["#f58634","#f6b700"],["#28a840","#1f9036"],
        ["#f6b700","#28a840"],["#f58634","#185838"],["#1f9036","#f6b700"],
      ];

      /* ============ HELPERS ============ */
      const clone = (x) => JSON.parse(JSON.stringify(x));
      function slugify(s) {
        return (s || "").toString().toLowerCase()
          .replace(/['"]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
      }
      function formatRupiah(n) {
        if (!n || n <= 0) return "Gratis";
        return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
      }
      function formatTanggal(iso) {
        if (!iso) return "-";
        const d = new Date(iso + "T00:00:00");
        return new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "short", year: "numeric" }).format(d);
      }
      function download(name, text, type) {
        const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      }
      function emptyEvent() {
        return {
          slug: "", title: "", category: "Kajian", speaker: "",
          location: "", city: "", online: false,
          date: "", dateEnd: "", registrationStart: "", registrationEnd: "", timeStart: "", timeEnd: "",
          price: 0, quota: 100, registered: 0,
          gradient: ["#28a840", "#185838"], emoji: "🕌", imageSquare: "", imageWide: "", sizeChartImage: "", gallery: [],
          excerpt: "", about: [""], benefits: [""], featured: false,
          requiresShipping: false,
          donationEnabled: false, donationLabel: "",
          runSubmission: false, runMinKm: 5, submissionEnd: "", certificateTemplate: "", certificateLayout: null,
          packages: [],
        };
      }
      async function loadContent() {
        try {
          const res = await apiFetch("/api/content");
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal memuat konten." };
          return {
            ok: true,
            data: {
              site: body.site || {},
              categories: body.categories && body.categories.length ? body.categories : FALLBACK_CATEGORIES.slice(),
              events: body.events || [],
            },
            updatedAt: body.updatedAt,
          };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }
      async function saveContent(data, expectedUpdatedAt) {
        try {
          const res = await apiFetch("/api/content", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              site: data.site,
              categories: data.categories,
              events: data.events,
              expectedUpdatedAt,
            }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal menyimpan.", status: res.status };
          return { ok: true, updatedAt: body.updatedAt };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      /* ============ FIELD UI ============ */
      function Label({ children }) { return <label className="mb-1 block text-sm font-semibold text-ink/80">{children}</label>; }
      const inputCls = "w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20";

      function Text({ label, value, onChange, placeholder, type, hint }) {
        return (
          <div>
            <Label>{label}</Label>
            <input type={type || "text"} className={inputCls} value={value == null ? "" : value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
            {hint && <p className="mt-1 text-xs text-ink/45">{hint}</p>}
          </div>
        );
      }
      function Num({ label, value, onChange, min, hint }) {
        return <div><Label>{label}</Label><input type="number" min={min == null ? 0 : min} className={inputCls} value={value == null ? "" : value} onChange={(e) => onChange(e.target.value === "" ? 0 : Number(e.target.value))} />{hint && <p className="mt-1 text-xs text-ink/45">{hint}</p>}</div>;
      }
      function Area({ label, value, onChange, rows, hint }) {
        return <div><Label>{label}</Label><textarea rows={rows || 3} className={inputCls} value={value == null ? "" : value} onChange={(e) => onChange(e.target.value)} />{hint && <p className="mt-1 text-xs text-ink/45">{hint}</p>}</div>;
      }
      function Select({ label, value, onChange, options }) {
        return <div><Label>{label}</Label><select className={inputCls} value={value} onChange={(e) => onChange(e.target.value)}>{options.map((o) => <option key={o} value={o}>{o}</option>)}</select></div>;
      }
      function Toggle({ label, checked, onChange }) {
        return (
          <button type="button" onClick={() => onChange(!checked)} className="flex items-center gap-3">
            <span className={"relative h-6 w-11 rounded-full transition " + (checked ? "bg-brand" : "bg-slate-300")}>
              <span className={"absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition " + (checked ? "left-[22px]" : "left-0.5")} />
            </span>
            <span className="text-sm font-semibold text-ink/80">{label}</span>
          </button>
        );
      }

      function ImageUploadField({ label, hint, value, onChange }) {
        const [uploading, setUploading] = useState(false);
        const [error, setError] = useState("");
        async function handleUpload(e) {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          setError("");
          setUploading(true);
          const res = await uploadEventImage(file);
          setUploading(false);
          if (!res.ok) { setError(res.error); return; }
          onChange(res.url);
        }
        return (
          <div>
            <Label>{label}</Label>
            <div className="flex flex-wrap items-center gap-3">
              <label className="cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-ink/70 hover:bg-slate-50">
                {uploading ? "Mengunggah…" : value ? "Ganti Gambar" : "Unggah Gambar"}
                <input type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={handleUpload} disabled={uploading} />
              </label>
              {value && (
                <button type="button" onClick={() => onChange("")} className="text-sm font-semibold text-orange hover:underline">Hapus</button>
              )}
            </div>
            {error && <p className="mt-1 text-xs text-orange">{error}</p>}
            {hint && <p className="mt-1 text-xs text-ink/45">{hint}</p>}
          </div>
        );
      }

      function GalleryUploadField({ label, hint, max, value, onChange }) {
        const items = value || [];
        const [uploading, setUploading] = useState(false);
        const [error, setError] = useState("");
        async function handleAdd(e) {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          if (items.length >= max) { setError("Maksimal " + max + " foto."); return; }
          setError("");
          setUploading(true);
          const res = await uploadEventImage(file);
          setUploading(false);
          if (!res.ok) { setError(res.error); return; }
          onChange([...items, res.url]);
        }
        function remove(i) { onChange(items.filter((_, k) => k !== i)); }
        function move(i, dir) {
          const j = i + dir;
          if (j < 0 || j >= items.length) return;
          const arr = items.slice();
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
          onChange(arr);
        }
        return (
          <div className="sm:col-span-2">
            <Label>{label}</Label>
            {items.length > 0 && (
              <div className="mb-3 space-y-2">
                {items.map((url, i) => (
                  <div key={url + i} className="flex items-center gap-3 rounded-lg border border-slate-200 bg-white p-2">
                    <img src={url} alt="" className="h-12 w-12 shrink-0 rounded-md object-cover" />
                    <span className="min-w-0 flex-1 truncate text-xs text-ink/45">Foto {i + 1}</span>
                    <div className="flex shrink-0 items-center gap-1">
                      <button type="button" onClick={() => move(i, -1)} title="Naik" className="grid h-7 w-7 place-items-center rounded text-ink/50 hover:bg-slate-100">▲</button>
                      <button type="button" onClick={() => move(i, 1)} title="Turun" className="grid h-7 w-7 place-items-center rounded text-ink/50 hover:bg-slate-100">▼</button>
                      <button type="button" onClick={() => remove(i)} title="Hapus" className="grid h-7 w-7 place-items-center rounded text-orange hover:bg-orange/10">🗑</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {items.length < max ? (
              <label className="inline-block cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-ink/70 hover:bg-slate-50">
                {uploading ? "Mengunggah…" : "+ Tambah Foto"}
                <input type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={handleAdd} disabled={uploading} />
              </label>
            ) : (
              <p className="text-xs text-ink/45">Maksimal {max} foto tercapai.</p>
            )}
            {error && <p className="mt-1 text-xs text-orange">{error}</p>}
            {hint && <p className="mt-1 text-xs text-ink/45">{hint}</p>}
          </div>
        );
      }

      /* ============ SERTIFIKAT (template resmi + tata letak) ============
         Pratinjau di sini HARUS menghasilkan gambar yang sama dengan renderTemplateCertificate
         di yakesma-site/index.html (yang dipakai peserta saat mengunduh). */
      const CERT_FIELD_LABELS = [
        ["name", "Nama peserta"], ["distance", "Jarak"], ["duration", "Waktu tempuh"],
        ["pace", "Pace"], ["runDate", "Tanggal lari"], ["certificateNo", "No. sertifikat"],
      ];
      const DEFAULT_CERT_LAYOUT = {
        name: { show: true, x: 50, y: 45, size: 6, color: "#185838", align: "center", bold: true, label: "" },
        distance: { show: true, x: 30, y: 65, size: 3.2, color: "#185838", align: "center", bold: true, label: "" },
        duration: { show: true, x: 50, y: 65, size: 3.2, color: "#185838", align: "center", bold: true, label: "" },
        pace: { show: true, x: 70, y: 65, size: 3.2, color: "#185838", align: "center", bold: true, label: "" },
        runDate: { show: true, x: 50, y: 76, size: 2.2, color: "#5b6b63", align: "center", bold: false, label: "Tanggal lari: " },
        certificateNo: { show: true, x: 8, y: 92, size: 1.6, color: "#8a968f", align: "left", bold: false, label: "No. Sertifikat: " },
      };
      const SAMPLE_CERT = { name: "Nama Peserta Contoh", distanceKm: 5.02, durationSeconds: 1694, paceSeconds: 337, runDate: "2026-11-22", certificateNo: "YKS-AB12CD-1" };

      function certFieldText(key, c) {
        if (key === "name") return c.name;
        if (key === "distance") return new Intl.NumberFormat("id-ID", { maximumFractionDigits: 2 }).format(c.distanceKm) + " km";
        if (key === "duration") return formatDurasi(c.durationSeconds);
        if (key === "pace") return formatPace(c.paceSeconds) + " /km";
        if (key === "runDate") return new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date(c.runDate + "T00:00:00")).replace("Minggu", "Ahad");
        if (key === "certificateNo") return c.certificateNo;
        return "";
      }
      function loadCertImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
      }
      async function renderTemplateCertificate(templateUrl, layout, c) {
        const img = await loadCertImage(templateUrl);
        if (!img) return null;
        const W = img.naturalWidth, H = img.naturalHeight;
        const canvas = document.createElement("canvas");
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext("2d");
        try { await Promise.all(["500", "800"].map((w) => document.fonts.load(w + " 40px 'Plus Jakarta Sans'"))); } catch (e) {}
        ctx.drawImage(img, 0, 0, W, H);
        ctx.textBaseline = "middle";
        Object.keys(layout).forEach((key) => {
          const f = layout[key];
          if (!f || !f.show) return;
          const text = (f.label || "") + certFieldText(key, c);
          let size = Math.round((f.size / 100) * H);
          const font = (sz) => (f.bold ? "800 " : "500 ") + sz + "px 'Plus Jakarta Sans', system-ui, sans-serif";
          ctx.font = font(size);
          while (ctx.measureText(text).width > W * 0.92 && size > 8) { size -= 2; ctx.font = font(size); }
          ctx.fillStyle = f.color;
          ctx.textAlign = f.align;
          ctx.fillText(text, (f.x / 100) * W, (f.y / 100) * H);
        });
        return canvas;
      }

      /** Template sertifikat perlu resolusi lebih tinggi dari gambar event biasa (dicetak/diunduh A4). */
      async function uploadCertTemplate(file) {
        let toUpload = file;
        try { toUpload = await compressImageForUpload(file, 2480, 0.9); } catch (e) {}
        if (toUpload.size > 3 * 1024 * 1024) {
          try { toUpload = await compressImageForUpload(file, 2000, 0.85); } catch (e) {}
        }
        try {
          const form = new FormData();
          form.append("file", toUpload);
          const res = await apiFetch("/api/content/image", { method: "POST", body: form });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal mengunggah template." };
          return { ok: true, url: body.url };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      function CertificateSettings({ template, layout, onChange }) {
        const lay = layout || DEFAULT_CERT_LAYOUT;
        const [selected, setSelected] = useState("name");
        const [preview, setPreview] = useState("");
        const [uploading, setUploading] = useState(false);
        const [error, setError] = useState("");

        useEffect(() => {
          if (!template) { setPreview(""); return; }
          let stale = false;
          const t = setTimeout(() => {
            renderTemplateCertificate(template, lay, SAMPLE_CERT).then((canvas) => {
              if (stale) return;
              if (!canvas) { setError("Template gagal dimuat."); return; }
              setPreview(canvas.toDataURL("image/jpeg", 0.8));
            });
          }, 150);
          return () => { stale = true; clearTimeout(t); };
        }, [template, JSON.stringify(lay)]);

        async function onUpload(e) {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          setError(""); setUploading(true);
          const res = await uploadCertTemplate(file);
          setUploading(false);
          if (!res.ok) { setError(res.error); return; }
          onChange(res.url, layout || DEFAULT_CERT_LAYOUT);
        }
        function setField(k, v) {
          onChange(template, Object.assign({}, lay, { [selected]: Object.assign({}, lay[selected], { [k]: v }) }));
        }
        function placeAt(e) {
          const r = e.currentTarget.getBoundingClientRect();
          const x = Math.round(((e.clientX - r.left) / r.width) * 1000) / 10;
          const y = Math.round(((e.clientY - r.top) / r.height) * 1000) / 10;
          onChange(template, Object.assign({}, lay, { [selected]: Object.assign({}, lay[selected], { x, y, show: true }) }));
        }
        const f = lay[selected];

        return (
          <div className="col-span-2 space-y-3 border-t border-brand-100 pt-3">
            <p className="text-sm font-bold text-brand-dark">Sertifikat</p>
            <p className="text-xs text-ink/55">
              Unggah desain sertifikat resmi yang <b>belum berisi nama/hasil</b> (JPG/PNG, idealnya A4 lanskap ~3508×2480px).
              Tanpa template, peserta mendapat desain bawaan. PDF khusus per peserta bisa diunggah di tab Hasil Lari.
            </p>
            <div className="flex flex-wrap items-center gap-3">
              <label className="cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-ink/70 hover:bg-slate-50">
                {uploading ? "Mengunggah…" : template ? "Ganti Template" : "Unggah Template"}
                <input type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={onUpload} disabled={uploading} />
              </label>
              {template && <button type="button" onClick={() => onChange("", null)} className="text-sm font-semibold text-orange hover:underline">Hapus template</button>}
            </div>
            {error && <p className="text-xs text-orange">{error}</p>}

            {template && (
              <React.Fragment>
                <div className="flex flex-wrap gap-1.5">
                  {CERT_FIELD_LABELS.map(([k, lbl]) => (
                    <button key={k} type="button" onClick={() => setSelected(k)}
                      className={"rounded-full border px-3 py-1 text-xs font-semibold " + (selected === k ? "border-brand bg-brand text-white" : "border-slate-300 bg-white text-ink/70") + (lay[k].show ? "" : " opacity-50")}>
                      {lbl}
                    </button>
                  ))}
                </div>
                <p className="text-xs text-ink/55">Klik pada pratinjau untuk memindahkan <b>{(CERT_FIELD_LABELS.find((x) => x[0] === selected) || [])[1]}</b> ke titik itu.</p>
                <div className="overflow-hidden rounded-lg border border-slate-200 bg-slate-50">
                  {preview
                    ? <img src={preview} alt="Pratinjau sertifikat" onClick={placeAt} className="w-full cursor-crosshair" />
                    : <p className="p-6 text-center text-xs text-ink/45">Menyiapkan pratinjau…</p>}
                </div>
                <div className="grid grid-cols-2 gap-3 rounded-lg bg-white p-3 sm:grid-cols-3">
                  <label className="col-span-2 flex items-center gap-2 text-sm font-semibold text-ink/80 sm:col-span-3">
                    <input type="checkbox" checked={!!f.show} onChange={(e) => setField("show", e.target.checked)} /> Tampilkan di sertifikat
                  </label>
                  <div className="col-span-2 sm:col-span-3"><Text label="Teks di depan (opsional)" value={f.label} onChange={(v) => setField("label", v)} placeholder="mis. Jarak: " /></div>
                  <div><Label>Ukuran ({f.size}%)</Label><input type="range" min="0.5" max="20" step="0.1" value={f.size} onChange={(e) => setField("size", Number(e.target.value))} className="w-full" /></div>
                  <div><Label>Posisi X ({f.x}%)</Label><input type="range" min="0" max="100" step="0.5" value={f.x} onChange={(e) => setField("x", Number(e.target.value))} className="w-full" /></div>
                  <div><Label>Posisi Y ({f.y}%)</Label><input type="range" min="0" max="100" step="0.5" value={f.y} onChange={(e) => setField("y", Number(e.target.value))} className="w-full" /></div>
                  <div><Label>Warna</Label><input type="color" value={f.color} onChange={(e) => setField("color", e.target.value)} className="h-9 w-full rounded" /></div>
                  <Select label="Rata" value={f.align} onChange={(v) => setField("align", v)} options={["left", "center", "right"]} />
                  <label className="flex items-end gap-2 pb-2 text-sm font-semibold text-ink/80">
                    <input type="checkbox" checked={!!f.bold} onChange={(e) => setField("bold", e.target.checked)} /> Tebal
                  </label>
                </div>
              </React.Fragment>
            )}
          </div>
        );
      }

      /* ============ KATALOG PAKET ============ */
      const PUBLIC_SITE_URL = "https://runforcharity.morningflow.id";
      function emptyPackage() {
        return { id: "", name: "", description: "", price: 0, medal: false, jersey: false, active: true, internal: false };
      }
      function PackagesEditor({ slug, packages, onChange }) {
        const list = packages || [];
        const [copied, setCopied] = useState("");
        function update(i, patch) { onChange(list.map((p, j) => (j === i ? Object.assign({}, p, patch) : p))); }
        function setName(i, v) {
          const p = list[i];
          const autoId = !p.id || p.id === slugify(p.name).slice(0, 20);
          update(i, autoId ? { name: v, id: slugify(v).slice(0, 20) } : { name: v });
        }
        function move(i, dir) {
          const j = i + dir;
          if (j < 0 || j >= list.length) return;
          const arr = list.slice(); const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
          onChange(arr);
        }
        function copyLink(link) {
          try { navigator.clipboard.writeText(link); setCopied(link); setTimeout(() => setCopied(""), 1800); } catch (e) { prompt("Salin link ini:", link); }
        }
        return (
          <div className="sm:col-span-2 space-y-3 rounded-xl border border-brand-100 bg-brand-50/40 p-3">
            <div>
              <p className="text-sm font-bold text-brand-dark">Katalog Paket (opsional)</p>
              <p className="text-xs text-ink/55">
                Kalau ada paket aktif, pendaftar memilih paket dan harga di bawah tidak dipakai. Paket dengan medali/jersey
                otomatis meminta alamat & ongkir; ukuran jersey hanya diminta untuk paket berisi jersey.
                Paket <b>internal</b> tersembunyi dari publik, hanya bisa dipilih lewat link khususnya, dan tidak dikirim ke Meta Ads.
              </p>
            </div>
            {list.map((p, i) => {
              const link = PUBLIC_SITE_URL + "/#/event/" + (slug || "...") + "?paket=" + (p.id || "...");
              return (
                <div key={i} className={"space-y-2 rounded-lg border bg-white p-3 " + (p.internal ? "border-gold/60" : "border-slate-200")}>
                  <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                    <div className="col-span-2"><Text label="Nama paket" value={p.name} onChange={(v) => setName(i, v)} placeholder="mis. Paket A" /></div>
                    <Text label="Kode" value={p.id} onChange={(v) => update(i, { id: v.toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 20) })} placeholder="paket-a" />
                    <Num label="Harga (Rp)" value={p.price} onChange={(v) => update(i, { price: v })} />
                    <div className="col-span-2 sm:col-span-4"><Text label="Isi paket (tampil ke pendaftar)" value={p.description} onChange={(v) => update(i, { description: v })} placeholder="mis. Donasi pohon + medali finisher" /></div>
                  </div>
                  <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm font-semibold text-ink/75">
                    <label className="flex items-center gap-1.5"><input type="checkbox" checked={!!p.medal} onChange={(e) => update(i, { medal: e.target.checked })} /> 🏅 Medali</label>
                    <label className="flex items-center gap-1.5"><input type="checkbox" checked={!!p.jersey} onChange={(e) => update(i, { jersey: e.target.checked })} /> 👕 Jersey</label>
                    <label className="flex items-center gap-1.5"><input type="checkbox" checked={!!p.active} onChange={(e) => update(i, { active: e.target.checked })} /> Aktif</label>
                    <label className="flex items-center gap-1.5"><input type="checkbox" checked={!!p.internal} onChange={(e) => update(i, { internal: e.target.checked })} /> Internal / testing</label>
                    <span className="ml-auto flex items-center gap-1">
                      <button type="button" onClick={() => move(i, -1)} title="Naik" className="grid h-7 w-7 place-items-center rounded text-ink/50 hover:bg-slate-100">▲</button>
                      <button type="button" onClick={() => move(i, 1)} title="Turun" className="grid h-7 w-7 place-items-center rounded text-ink/50 hover:bg-slate-100">▼</button>
                      <button type="button" onClick={() => onChange(list.filter((_, j) => j !== i))} title="Hapus paket" className="grid h-7 w-7 place-items-center rounded text-orange hover:bg-orange/10">🗑</button>
                    </span>
                  </div>
                  {p.internal && (
                    <div className="flex flex-wrap items-center gap-2 rounded-md bg-gold/10 px-2.5 py-2 text-xs">
                      <span className="font-semibold text-ink/70">Link khusus:</span>
                      <code className="break-all text-ink/70">{link}</code>
                      <button type="button" onClick={() => copyLink(link)} className="rounded border border-slate-300 bg-white px-2 py-0.5 font-semibold text-ink/70 hover:bg-slate-50">{copied === link ? "Tersalin ✓" : "Salin"}</button>
                    </div>
                  )}
                </div>
              );
            })}
            <button type="button" onClick={() => onChange(list.concat(emptyPackage()))}
              className="rounded-lg border border-dashed border-brand px-3 py-1.5 text-sm font-semibold text-brand hover:bg-white">+ Tambah Paket</button>
          </div>
        );
      }

      /* ============ EVENT EDITOR ============ */
      function EventEditor({ initial, categories, onSave, onCancel, existingSlugs }) {
        const [ev, setEv] = useState(clone(initial));
        const [slugTouched, setSlugTouched] = useState(!!initial.slug);
        const set = (k, v) => setEv((p) => ({ ...p, [k]: v }));

        function setTitle(v) {
          setEv((p) => ({ ...p, title: v, slug: slugTouched ? p.slug : slugify(v) }));
        }
        function save() {
          const e = clone(ev);
          e.title = (e.title || "").trim();
          if (!e.title) { alert("Judul wajib diisi."); return; }
          if (!e.date) { alert("Tanggal wajib diisi."); return; }
          e.slug = slugify(e.slug || e.title);
          if (existingSlugs.filter((s) => s === e.slug).length > 0) {
            // pastikan unik
            let base = e.slug, i = 2;
            while (existingSlugs.indexOf(e.slug) !== -1) { e.slug = base + "-" + i; i++; }
          }
          e.price = Number(e.price) || 0;
          e.quota = Number(e.quota) || 0;
          e.registered = Number(e.registered) || 0;
          e.about = (typeof e.about === "string" ? e.about.split("\n") : e.about).map((x) => x.trim()).filter(Boolean);
          e.benefits = (typeof e.benefits === "string" ? e.benefits.split("\n") : e.benefits).map((x) => x.trim()).filter(Boolean);
          if (!e.about.length) e.about = [""];
          if (!e.benefits.length) e.benefits = [""];
          onSave(e);
        }

        const aboutText = Array.isArray(ev.about) ? ev.about.join("\n") : ev.about;
        const benefitsText = Array.isArray(ev.benefits) ? ev.benefits.join("\n") : ev.benefits;

        return (
          <div className="space-y-5">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-extrabold text-brand-dark">{initial.slug ? "Edit Event" : "Tambah Event"}</h2>
              <button onClick={onCancel} className="text-sm font-semibold text-ink/50 hover:text-ink">Batal</button>
            </div>

            {/* Poster preview (pratinjau versi lebar) */}
            {(() => {
              const previewImg = ev.imageWide || ev.imageSquare;
              return (
                <div className="relative overflow-hidden rounded-xl" style={{ aspectRatio: "16/7", backgroundImage: previewImg ? undefined : "linear-gradient(145deg," + ev.gradient[0] + "," + ev.gradient[1] + ")" }}>
                  {previewImg && <img src={previewImg} alt="" className="absolute inset-0 h-full w-full object-cover" />}
                  {previewImg && <div className="absolute inset-0" style={{ backgroundImage: "linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 55%, transparent)" }} />}
                  <div className="relative flex h-full flex-col justify-between p-4 text-white">
                    <div className="flex justify-between"><span className="text-[11px] font-extrabold uppercase tracking-widest opacity-90">YAKESMA</span><span className="rounded-full bg-white/20 px-2 py-0.5 text-[11px] font-semibold">{ev.category}</span></div>
                    <div className="text-xl font-extrabold drop-shadow">{ev.title || "Judul Event"} <span className="text-2xl">{ev.emoji}</span></div>
                  </div>
                </div>
              );
            })()}

            <div className="grid gap-4 sm:grid-cols-2">
              <div className="sm:col-span-2"><Text label="Judul Event" value={ev.title} onChange={setTitle} placeholder="mis. Kajian Akbar: Keajaiban Sedekah" /></div>
              <div className="sm:col-span-2">
                <Label>Slug (URL)</Label>
                <input className={inputCls} value={ev.slug} onChange={(e) => { setSlugTouched(true); set("slug", e.target.value); }} placeholder="otomatis-dari-judul" />
                <p className="mt-1 text-xs text-ink/45">Alamat: <code>#/event/{ev.slug || "..."}</code></p>
              </div>
              <Select label="Kategori" value={ev.category} onChange={(v) => set("category", v)} options={categories} />
              <Text label="Pemateri (opsional)" value={ev.speaker} onChange={(v) => set("speaker", v)} placeholder="mis. Ustadz Ahmad Zaki" />
              <Text label="Nama Lokasi" value={ev.location} onChange={(v) => set("location", v)} placeholder="mis. Masjid Raya Bintaro / Online (Zoom)" />
              <Text label="Kota" value={ev.city} onChange={(v) => set("city", v)} placeholder="mis. Jakarta / Online" />
              <div className="flex items-end pb-1"><Toggle label="Event online" checked={!!ev.online} onChange={(v) => set("online", v)} /></div>
              <div className="flex items-end pb-1"><Toggle label="Tampilkan sebagai unggulan" checked={!!ev.featured} onChange={(v) => set("featured", v)} /></div>
              <div className="sm:col-span-2 flex items-end pb-1">
                <Toggle label="Butuh info pengiriman (alamat, ukuran kaos, kurir) — mis. lari virtual"
                  checked={!!ev.requiresShipping} onChange={(v) => set("requiresShipping", v)} />
              </div>
              {ev.requiresShipping && (
                <div className="sm:col-span-2">
                  <ImageUploadField
                    label="Panduan Ukuran Jersey (opsional)"
                    hint="Ditampilkan sebagai tautan 'Lihat Panduan Ukuran' di dekat pilihan ukuran jersey saat pendaftaran."
                    value={ev.sizeChartImage}
                    onChange={(v) => set("sizeChartImage", v)}
                  />
                </div>
              )}
              <div className="sm:col-span-2 flex items-end pb-1">
                <Toggle label="Aktifkan donasi tambahan (opsional saat pendaftaran)"
                  checked={!!ev.donationEnabled} onChange={(v) => set("donationEnabled", v)} />
              </div>
              {ev.donationEnabled && (
                <div className="sm:col-span-2">
                  <Text label="Tujuan Donasi" value={ev.donationLabel} onChange={(v) => set("donationLabel", v)} placeholder="mis. Penanaman Pohon di Bali" />
                </div>
              )}
              <div className="sm:col-span-2 flex items-end pb-1">
                <Toggle label="Aktifkan setor bukti lari, peringkat & e-sertifikat (lari virtual)"
                  checked={!!ev.runSubmission} onChange={(v) => set("runSubmission", v)} />
              </div>
              {ev.runSubmission && (
                <div className="sm:col-span-2 grid grid-cols-2 gap-3 rounded-xl border border-brand-100 bg-brand-50/40 p-3">
                  <Num label="Jarak minimal (km)" value={ev.runMinKm == null ? 5 : ev.runMinKm} onChange={(v) => set("runMinKm", v)} min={1}
                    hint="Satu kali lari (single run)." />
                  <Text label="Batas setor bukti lari (opsional)" type="date" value={ev.submissionEnd || ""} onChange={(v) => set("submissionEnd", v)}
                    hint="Kosongkan = sama dengan tanggal selesai pelaksanaan." />
                  <p className="col-span-2 text-xs text-ink/55">
                    Peserta dengan tiket Lunas/Gratis bisa setor dari tanggal mulai pelaksanaan sampai batas setor, lewat menu
                    "Setor Lari" di situs. Hasil langsung masuk peringkat; periksa & tolak yang tidak valid di tab Hasil Lari.
                  </p>
                  <CertificateSettings template={ev.certificateTemplate || ""} layout={ev.certificateLayout || null}
                    onChange={(url, layout) => setEv((p) => ({ ...p, certificateTemplate: url, certificateLayout: layout }))} />
                </div>
              )}
              <div className="grid grid-cols-2 gap-3">
                <Text label="Tanggal Mulai" type="date" value={ev.date} onChange={(v) => set("date", v)} />
                <Text label="Tanggal Selesai (opsional)" type="date" value={ev.dateEnd} onChange={(v) => set("dateEnd", v)}
                  hint="Isi kalau pelaksanaan berbentuk rentang, mis. lari virtual." />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Text label="Mulai" value={ev.timeStart} onChange={(v) => set("timeStart", v)} placeholder="08:00" />
                <Text label="Selesai" value={ev.timeEnd} onChange={(v) => set("timeEnd", v)} placeholder="11:00" />
              </div>
              <div className="sm:col-span-2 grid grid-cols-2 gap-3">
                <Text label="Pendaftaran Dibuka (opsional)" type="date" value={ev.registrationStart} onChange={(v) => set("registrationStart", v)}
                  hint="Kosongkan jika pendaftaran boleh kapan saja." />
                <Text label="Pendaftaran Ditutup (opsional)" type="date" value={ev.registrationEnd} onChange={(v) => set("registrationEnd", v)} />
              </div>
              <PackagesEditor slug={ev.slug} packages={ev.packages} onChange={(arr) => set("packages", arr)} />
              <Num label="Harga (Rp)" value={ev.price} onChange={(v) => set("price", v)} hint={(ev.packages || []).some((p) => p.active) ? "Tidak dipakai — event ini memakai katalog paket." : "0 = Gratis"} />
              <div className="grid grid-cols-2 gap-3">
                <Num label="Kuota" value={ev.quota} onChange={(v) => set("quota", v)} />
                <Num label="Peserta tambahan (manual)" value={ev.registered} onChange={(v) => set("registered", v)}
                  hint={"Terkonfirmasi otomatis (Lunas + Gratis): " + (ev.confirmedCount || 0) + ". Tampil di situs: " + ((ev.confirmedCount || 0) + (Number(ev.registered) || 0)) + " terisi."} />
              </div>
              <div className="sm:col-span-2"><Area label="Ringkasan singkat" value={ev.excerpt} onChange={(v) => set("excerpt", v)} rows={2} hint="1 kalimat, muncul di kartu & detail." /></div>
              <div className="sm:col-span-2"><Area label="Deskripsi" value={aboutText} onChange={(v) => set("about", v)} rows={4} hint="Satu paragraf per baris." /></div>
              <div className="sm:col-span-2"><Area label="Yang Anda Dapatkan" value={benefitsText} onChange={(v) => set("benefits", v)} rows={3} hint="Satu poin per baris." /></div>

              <GalleryUploadField
                label="Galeri Foto (opsional)"
                hint="Ditampilkan sebagai slide foto sebelum Deskripsi, di halaman detail event — dokumentasi event sebelumnya untuk menambah kepercayaan calon pendaftar. Maks 10 foto."
                max={10}
                value={ev.gallery}
                onChange={(arr) => set("gallery", arr)}
              />

              <ImageUploadField
                label="Gambar Kotak (opsional)"
                hint="Untuk kartu event di beranda & daftar event. Rekomendasi 1200×1200px (rasio 1:1)."
                value={ev.imageSquare}
                onChange={(url) => set("imageSquare", url)}
              />
              <ImageUploadField
                label="Gambar Lebar (opsional)"
                hint="Untuk halaman detail event & pratinjau saat dibagikan. Rekomendasi 1600×900px (rasio 16:9)."
                value={ev.imageWide}
                onChange={(url) => set("imageWide", url)}
              />
              <p className="sm:col-span-2 -mt-2 text-xs text-ink/45">
                Kalau cuma salah satu diisi, gambar itu dipakai untuk keduanya. Tanpa gambar sama
                sekali, poster memakai warna gradient + emoji seperti biasa. Format JPG/PNG/WEBP,
                maks 3MB per gambar.
              </p>
              <div className="sm:col-span-2">
                <Label>Emoji poster</Label>
                <div className="flex flex-wrap gap-1.5">
                  {EMOJIS.map((em) => <button key={em} type="button" onClick={() => set("emoji", em)} className={"grid h-9 w-9 place-items-center rounded-lg border text-lg " + (ev.emoji === em ? "border-brand bg-brand-50" : "border-slate-200 bg-white")}>{em}</button>)}
                </div>
              </div>
              <div className="sm:col-span-2">
                <Label>Warna poster</Label>
                <div className="flex flex-wrap gap-2">
                  {GRADIENTS.map((g, i) => (
                    <button key={i} type="button" onClick={() => set("gradient", g.slice())} title={g.join(" → ")}
                      className={"h-9 w-14 rounded-lg border-2 " + (ev.gradient[0] === g[0] && ev.gradient[1] === g[1] ? "border-brand-dark" : "border-white shadow")}
                      style={{ backgroundImage: "linear-gradient(145deg," + g[0] + "," + g[1] + ")" }} />
                  ))}
                  <div className="flex items-center gap-1">
                    <input type="color" value={ev.gradient[0]} onChange={(e) => set("gradient", [e.target.value, ev.gradient[1]])} className="h-9 w-9 rounded" />
                    <input type="color" value={ev.gradient[1]} onChange={(e) => set("gradient", [ev.gradient[0], e.target.value])} className="h-9 w-9 rounded" />
                  </div>
                </div>
              </div>
            </div>

            <div className="flex gap-3 pt-2">
              <button onClick={save} className="rounded-xl bg-brand px-5 py-2.5 text-sm font-bold text-white hover:bg-brand-600">Simpan Event</button>
              <button onClick={onCancel} className="rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-ink/70 hover:bg-slate-50">Batal</button>
            </div>
          </div>
        );
      }

      /* ============ EVENT LIST ============ */
      function EventList({ data, setData, onEdit, onNew }) {
        const events = data.events;
        function move(i, dir) {
          const j = i + dir; if (j < 0 || j >= events.length) return;
          const arr = events.slice(); const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
          setData({ ...data, events: arr });
        }
        function del(i) {
          if (!confirm("Hapus event \"" + events[i].title + "\"?")) return;
          setData({ ...data, events: events.filter((_, k) => k !== i) });
        }
        function dup(i) {
          const c = clone(events[i]); c.slug = ""; c.title = c.title + " (salinan)";
          const arr = events.slice(); arr.splice(i + 1, 0, c); setData({ ...data, events: arr });
        }
        return (
          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-extrabold text-brand-dark">Event <span className="text-ink/40">({events.length})</span></h2>
              <button onClick={onNew} className="rounded-xl bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brand-600">+ Tambah Event</button>
            </div>
            {events.length === 0 && <p className="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-ink/50">Belum ada event. Klik "Tambah Event".</p>}
            <div className="space-y-2.5">
              {events.map((e, i) => (
                <div key={e.slug || i} className="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3">
                  {(e.imageSquare || e.imageWide) ? (
                    <img src={e.imageSquare || e.imageWide} alt="" className="h-12 w-12 shrink-0 rounded-lg object-cover" />
                  ) : (
                    <div className="grid h-12 w-12 shrink-0 place-items-center rounded-lg text-xl text-white" style={{ backgroundImage: "linear-gradient(145deg," + e.gradient[0] + "," + e.gradient[1] + ")" }}>{e.emoji}</div>
                  )}
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2">
                      <p className="truncate font-bold text-ink">{e.title}</p>
                      {e.featured && <span className="rounded bg-gold/20 px-1.5 py-0.5 text-[10px] font-bold text-orange">unggulan</span>}
                    </div>
                    <p className="truncate text-xs text-ink/55">{e.category} · {formatTanggal(e.date)} · {e.online ? "Online" : e.city} · {formatRupiah(e.price)}</p>
                  </div>
                  <div className="flex shrink-0 items-center gap-1">
                    <button onClick={() => move(i, -1)} title="Naik" className="grid h-8 w-8 place-items-center rounded text-ink/50 hover:bg-slate-100">▲</button>
                    <button onClick={() => move(i, 1)} title="Turun" className="grid h-8 w-8 place-items-center rounded text-ink/50 hover:bg-slate-100">▼</button>
                    <button onClick={() => dup(i)} title="Duplikat" className="grid h-8 w-8 place-items-center rounded text-ink/50 hover:bg-slate-100">⧉</button>
                    <button onClick={() => onEdit(i)} className="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-ink/70 hover:bg-slate-50">Edit</button>
                    <button onClick={() => del(i)} title="Hapus" className="grid h-8 w-8 place-items-center rounded text-orange hover:bg-orange/10">🗑</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      /* ============ SETTINGS ============ */
      function Settings({ data, setData }) {
        const s = data.site || {};
        const setS = (k, v) => setData({ ...data, site: { ...s, [k]: v } });
        const colors = s.colors || { green: "#28a840", dark: "#185838", gold: "#f6b700", orange: "#f58634" };
        const setColor = (k, v) => setData({ ...data, site: { ...s, colors: { ...colors, [k]: v } } });
        return (
          <div className="space-y-6">
            <h2 className="text-lg font-extrabold text-brand-dark">Pengaturan Situs</h2>
            <div className="grid gap-4 sm:grid-cols-2">
              <Text label="Nama Brand" value={s.name} onChange={(v) => setS("name", v)} />
              <Text label="Tagline" value={s.tagline} onChange={(v) => setS("tagline", v)} />
              <div className="sm:col-span-2"><Area label="Intro (di beranda)" value={s.intro} onChange={(v) => setS("intro", v)} rows={2} /></div>
              <Text label="Nomor WhatsApp" value={s.whatsapp} onChange={(v) => setS("whatsapp", v)} placeholder="62812xxxxxxx (tanpa +, tanpa spasi)" />
              <Text label="Email" value={s.email} onChange={(v) => setS("email", v)} />
              <Text label="Instagram (username)" value={s.instagram} onChange={(v) => setS("instagram", v)} placeholder="yakesma.official" />
              <Text label="Website" value={s.website} onChange={(v) => setS("website", v)} />
              <div className="sm:col-span-2"><Text label="Alamat" value={s.address} onChange={(v) => setS("address", v)} /></div>
            </div>
            <div>
              <Label>Rekening untuk Transfer Manual</Label>
              <p className="mb-2 text-xs text-ink/45">Ditampilkan ke pendaftar event berbayar sebagai tujuan transfer.</p>
              <div className="grid gap-4 sm:grid-cols-3">
                <Text label="Nama Bank" value={s.bankName} onChange={(v) => setS("bankName", v)} placeholder="mis. Bank Syariah Indonesia (BSI)" />
                <Text label="Nomor Rekening" value={s.accountNumber} onChange={(v) => setS("accountNumber", v)} placeholder="1234567890" />
                <Text label="Atas Nama" value={s.accountHolder} onChange={(v) => setS("accountHolder", v)} placeholder="Yayasan YAKESMA" />
              </div>
            </div>
            <div>
              <Label>QRIS Pembayaran</Label>
              <p className="mb-2 text-xs text-ink/45">
                Isi (teks) QRIS statis lembaga, diawali <span className="font-mono">000201</span>. Bila diisi, pendaftar event berbayar
                langsung melihat QRIS dengan nominal + kode unik (Rp1–999) terisi otomatis, dan tombol "Saya sudah bayar".
                Kosongkan untuk kembali ke pembayaran lewat CS WhatsApp.
              </p>
              <Area label="Payload QRIS" value={s.qris} onChange={(v) => setS("qris", v.replace(/\s+/g, ""))} rows={3} />
              {s.qris ? (

      /* ============ PENDAFTARAN (backend nyata: yakesma-api) ============ */
      const API_BASE = "https://yakesma-event-api.vercel.app";
      const API_TOKEN_KEY = "yakesma_admin_api_token";

      function getApiToken() {
        try { return JSON.parse(sessionStorage.getItem(API_TOKEN_KEY) || "null"); } catch (e) { return null; }
      }
      function setApiToken(tok) { sessionStorage.setItem(API_TOKEN_KEY, JSON.stringify(tok)); }
      function clearApiToken() { sessionStorage.removeItem(API_TOKEN_KEY); }

      async function apiLogin(password) {
        try {
          const res = await fetch(API_BASE + "/api/admin/login", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal masuk." };
          return { ok: true, token: body.token, expiresAt: body.expiresAt };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      /** fetch ke yakesma-api dengan header Authorization otomatis dari token tersimpan. */
      async function apiFetch(path, opts) {
        const tok = getApiToken();
        const headers = Object.assign({}, (opts && opts.headers) || {}, tok ? { Authorization: "Bearer " + tok.token } : {});
        const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
        if (res.status === 401) clearApiToken();
        return res;
      }

      /** Cabut SEMUA sesi admin (termasuk sesi ini) — dipakai kalau perangkat admin hilang/dipinjam. */
      async function revokeAllSessions() {
        if (!confirm("Keluarkan semua perangkat yang sedang login admin, termasuk perangkat ini? Semua admin harus login ulang.")) return;
        const res = await apiFetch("/api/admin/revoke", { method: "POST" });
        if (!res.ok && res.status !== 401) { alert("Gagal mencabut sesi. Coba lagi."); return; }
        clearApiToken();
        location.reload();
      }

      /**
       * Kecilkan & padatkan gambar di browser sebelum diunggah — foto langsung dari HP
       * (kamera 4000×3000px, PNG multi-MB) kalau diunggah apa adanya bikin situs publik
       * lambat dimuat di internet lemah. Skala ke maks 1600px sisi terpanjang, encode
       * ulang jadi JPEG kualitas 82% (biasanya 1-3MB → 100-300KB, tanpa penurunan
       * kualitas yang kelihatan). Kalau gagal (browser lama tanpa dukungan canvas),
       * kirim file asli apa adanya — jangan sampai fitur upload jadi tak bisa dipakai.
       */
      function compressImageForUpload(file, maxDim, quality) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
              else { width = Math.round(width * (maxDim / height)); height = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            if (!ctx) { reject(new Error("canvas tidak didukung")); return; }
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(
              (blob) => {
                if (!blob) { reject(new Error("gagal memproses gambar")); return; }
                const name = (file.name || "gambar").replace(/\.[^.]+$/, "") + ".jpg";
                resolve(new File([blob], name, { type: "image/jpeg" }));
              },
              "image/jpeg",
              quality
            );
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("gagal membaca gambar")); };
          img.src = url;
        });
      }

      /** Unggah gambar thumbnail event, balikan {ok:true,url} atau {ok:false,error}. */
      async function uploadEventImage(file) {
        try {
          let toUpload = file;
          try {
            toUpload = await compressImageForUpload(file, 1600, 0.82);
          } catch (e) {
            // kompresi gagal — lanjutkan dengan file asli, jangan gagalkan upload
          }
          const form = new FormData();
          form.append("file", toUpload);
          const res = await apiFetch("/api/content/image", { method: "POST", body: form });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) return { ok: false, error: body.error || "Gagal mengunggah gambar." };
          return { ok: true, url: body.url };
        } catch (e) {
          return { ok: false, error: "Tidak bisa terhubung ke server." };
        }
      }

      // Sinkron dengan yakesma-api/src/lib/validate.ts dan yakesma-site/index.html —
      // dipakai untuk menampilkan rincian biaya di panel Detail pendaftaran.
      const SHIRT_SIZE_SURCHARGE = { S: 0, M: 0, L: 0, XL: 0, "2XL": 25000, "3XL": 50000, "4XL": 75000 };
      const REG_STATUS_LABEL = {
        free: { text: "Gratis", cls: "bg-brand-50 text-brand-700" },
        pending_transfer: { text: "Menunggu Konfirmasi", cls: "bg-gold/20 text-orange" },
        paid: { text: "Lunas", cls: "bg-brand text-white" },
        cancelled: { text: "Dibatalkan", cls: "bg-slate-200 text-ink/50" },
      };
      /* QRIS — sama dengan versi di index.html (situs), di sini hanya untuk validasi di Pengaturan. */
      function qrisCrc16(str) {
        let crc = 0xffff;
        for (let i = 0; i < str.length; i++) {
          crc ^= str.charCodeAt(i) << 8;
          for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
        }
        return crc.toString(16).toUpperCase().padStart(4, "0");
      }
      function qrisTlv(str) {
        const out = [];
        for (let i = 0; i + 4 <= str.length; ) {
          const len = parseInt(str.slice(i + 2, i + 4), 10);
          if (isNaN(len)) return null;
          out.push([str.slice(i, i + 2), str.slice(i + 4, i + 4 + len)]);
          i += 4 + len;
        }
        return out;
      }
      function qrisValid(payload) {
        return typeof payload === "string" && /^000201/.test(payload) && payload.length > 12 &&
          payload.slice(-8, -4) === "6304" && qrisCrc16(payload.slice(0, -4)) === payload.slice(-4).toUpperCase();
      }
      function qrisInfo(payload) {
        const top = qrisTlv(payload) || [];
        const get = (t) => (top.find((x) => x[0] === t) || [])[1] || "";
        const sub = qrisTlv(get("51")) || [];
        return { merchant: get("59"), city: get("60"), nmid: (sub.find((x) => x[0] === "02") || [])[1] || "" };
      }
